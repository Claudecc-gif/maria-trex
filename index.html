<style>

<script>
"use strict";
/* =====================================================================
   THE KUSH RUSH — Kuala Lumpur Most Wanted
   Super-Mario x Sonic x cinematic. Single file, no dependencies.
   A T-Rex collects kush (1pt each) while OUTRUNNING the Malaysian police.
   • Bribe the cops ONCE for 100 kush — or get hanged from a weed tree
   • Each level you enter the KUSH CASTLE; it gets crazier every time
   • KL Petronas Towers obstacle · 🪽 wings power-up at the sky-top
   • BONG = speed · CALI BUD = invincible star · BLOW CANNON = joints
   • Trampolines fling you sky-high · GLOBAL high-score leaderboard
   • 4 environments: Kuala Lumpur / Desert / Volcano / Neon Night
   ===================================================================== */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
// Fixed virtual HEIGHT, virtual WIDTH follows the screen aspect → fills portrait & landscape,
// no letterbox, no distortion (canvas aspect always matches the screen).
const VH = 540;
let VW = 960;
let safeTop = 0;                      // status-bar / notch inset in canvas px (keeps the HUD visible)
function fitCanvas(){
  const w = window.innerWidth || 960, h = window.innerHeight || 540;
  VW = Math.max(280, Math.round(VH * (w / h)));
  canvas.width = VW; canvas.height = VH;
  ctx.imageSmoothingEnabled = false;
  const probe=document.getElementById("safeTopProbe");
  safeTop = probe ? Math.round(probe.getBoundingClientRect().height * (VH / h)) : 0;
}
fitCanvas();
addEventListener("resize", fitCanvas);
addEventListener("orientationchange", fitCanvas);
// zoom the world OUT on narrow/portrait screens so you can see more of the surroundings (1 = no zoom)
function viewZoom(){ return clamp(VW/560, 0.56, 1); }
// right edge of the VISIBLE world (accounts for zoom-out) — used so off-screen-right objects aren't
// culled while still inside the zoomed-out view (which caused things to "pop in" late on portrait).
function camRightX(){ return cam.x + VW/viewZoom() + 120; }

// ---------------- constants ----------------
const GROUND_TOP = VH - 84;
const GRAVITY = 0.72, JUMP_V = 14.4, JUMP_CUT = 6.0;
const MOVE_SPD = 4.5, BOOST_SPD = 8.6, MAX_FALL = 18;
const ACCEL = 0.75, FRICTION = 0.80, COYOTE = 7, BUFFER = 7;
const SEG_W = 360, FIXED_DT = 1000/60;
const TRAMP_BOUNCE = 43.0, STOMP_BOUNCE = 9.2;   // trampolines fling you WAY up (uncut launch)
const DEATH_Y = GROUND_TOP + 280;
const LEVEL_LEN = 1180;            // metres per environment (more distance between levels)
const SKY_TOP = GROUND_TOP - 760;  // how high the world goes (reach the wings up here)
const MAX_LIVES = 3;               // hard cap — only three lives
const AMMO_CAP = 25;               // most joints you can carry/shoot at once

// ---------------- persistence ----------------
const DB = {
  get bank(){ return Number(localStorage.getItem("maria_bank")||0); },
  set bank(v){ localStorage.setItem("maria_bank", Math.max(0,Math.floor(v))); },
  get best(){ return Number(localStorage.getItem("maria_best")||0); },
  set best(v){ localStorage.setItem("maria_best", Math.floor(v)); },
  get bestDist(){ return Number(localStorage.getItem("maria_bestdist")||0); },
  set bestDist(v){ localStorage.setItem("maria_bestdist", Math.floor(v)); },
  get owned(){ return (localStorage.getItem("maria_skins")||"classic").split(",").filter(Boolean); },
  set owned(arr){ localStorage.setItem("maria_skins", arr.join(",")); },
  get skin(){ return localStorage.getItem("maria_skin")||"classic"; },
  set skin(v){ localStorage.setItem("maria_skin", v); },
  get name(){ return localStorage.getItem("maria_name")||""; },
  set name(v){ localStorage.setItem("maria_name", (v||"").toString().toUpperCase().replace(/[^A-Z0-9 _-]/g,"").slice(0,10)); },
  get pet(){ return localStorage.getItem("maria_pet")==="1"; },
  set pet(v){ localStorage.setItem("maria_pet", v?"1":"0"); },
  get passXP(){ return Number(localStorage.getItem("maria_passxp")||0); },          // battle-pass progress: total XP ever earned
  set passXP(v){ localStorage.setItem("maria_passxp", Math.max(0,Math.floor(v))); },
  get passTier(){ return Number(localStorage.getItem("maria_passtier")||0); },       // highest battle-pass tier already CLAIMED
  set passTier(v){ localStorage.setItem("maria_passtier", Math.max(0,Math.floor(v))); },
  get cc(){ return localStorage.getItem("maria_cc")||""; },                          // country flag: "MY" | "NL" | "WW" (rest of world) | "" = not picked yet
  set cc(v){ localStorage.setItem("maria_cc", (v||"").toString().toUpperCase().replace(/[^A-Z]/g,"").slice(0,2)); },
};

// ---------------- country flags (picked on the title screen, shown on the leaderboard + chat) ----------------
// Drawn as tiny vector flags (not emoji) so they render on every platform — Windows shows
// flag emojis as plain letters. "WW" = rest of the world (little globe).
const FLAG_OPTS = [ {cc:"MY", label:"MALAYSIA"}, {cc:"NL", label:"NETHERLANDS"}, {cc:"WW", label:"OTHER"} ];
function drawFlag(cc, x, y, w, h){
  if (!cc) return;
  if (cc==="MY"){
    const s=h/7;                                            // 14 stripes → 7 readable ones at icon size
    for (let i=0;i<7;i++){ ctx.fillStyle=i%2===0?"#cc0001":"#ffffff"; ctx.fillRect(x, y+i*s, w, s+0.5); }
    ctx.fillStyle="#010066"; ctx.fillRect(x, y, w*0.55, s*4);            // canton
    const mx=x+w*0.21, my=y+s*2, rr=h*0.18;                              // yellow crescent + star-dot
    ctx.fillStyle="#ffcc00"; ctx.beginPath(); ctx.arc(mx,my,rr,0,Math.PI*2); ctx.fill();
    ctx.fillStyle="#010066"; ctx.beginPath(); ctx.arc(mx+rr*0.55,my,rr*0.85,0,Math.PI*2); ctx.fill();
    ctx.fillStyle="#ffcc00"; ctx.beginPath(); ctx.arc(x+w*0.40,my,rr*0.5,0,Math.PI*2); ctx.fill();
  } else if (cc==="NL"){
    const s=h/3;
    ctx.fillStyle="#AE1C28"; ctx.fillRect(x, y,     w, s+0.5);
    ctx.fillStyle="#ffffff"; ctx.fillRect(x, y+s,   w, s+0.5);
    ctx.fillStyle="#21468B"; ctx.fillRect(x, y+2*s, w, h-2*s);
  } else {                                                   // WW / anything else → little globe
    ctx.fillStyle="#0a2440"; ctx.fillRect(x, y, w, h);
    ctx.fillStyle="#2e86d6"; ctx.beginPath(); ctx.arc(x+w/2, y+h/2, h*0.42, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle="#43c463";
    ctx.beginPath(); ctx.arc(x+w*0.42, y+h*0.40, h*0.16, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(x+w*0.60, y+h*0.62, h*0.13, 0, Math.PI*2); ctx.fill();
  }
  ctx.strokeStyle="rgba(0,0,0,.55)"; ctx.lineWidth=1; ctx.strokeRect(x+0.5, y+0.5, w-1, h-1);
}

const SKINS = [

  {id:"rainbow", name:"Trippy Rex",  cost:5000, body:"#ff66cc", dark:"#9933ff", belly:"#ffffcc", acc:"trippy"},
  {id:"chrome",  name:"Chrome Rex",  cost:6500, body:"#b9c2cc", dark:"#5a6470", belly:"#e9eef3", acc:"shades"},
  {id:"prism",   name:"Prism Rex",   cost:8000, body:"#cfe9ff", dark:"#6aa0d0", belly:"#ffffff", acc:"diamond"},
  {id:"aurora",  name:"Aurora Rex",  cost:9500, body:"#7af0c0", dark:"#2f9fb0", belly:"#dffff4", acc:"galaxy"},
  {id:"sunset",  name:"Sunset Rex",   cost:11000, body:"#ff8a3d", dark:"#c4561a", belly:"#ffe0b0", acc:"halo"},
  {id:"ocean",   name:"Ocean Rex",    cost:12500, body:"#1ea7c4", dark:"#0e6680", belly:"#bde6f5", acc:"ice"},

  {id:"midnight",name:"Midnight Rex", cost:18000, body:"#27314a", dark:"#141a2c", belly:"#8ea0c4", acc:"shades"},

  {id:"ember",   name:"Ember Rex",    cost:23000, body:"#ff4d2e", dark:"#a82412", belly:"#ffba8a", acc:"horns"},
  {id:"jade",    name:"Jade Rex",     cost:26000, body:"#2bd17a", dark:"#177a45", belly:"#bdf5d6", acc:"rasta"},
  {id:"obsidian",name:"Obsidian Rex", cost:30000, body:"#2b2b33", dark:"#141418", belly:"#7a7a8c", acc:"devil"},
  {id:"cosmic",  name:"Cosmic Rex",   cost:35000, body:"#4a2f8c", dark:"#281a4f", belly:"#c0a6ff", acc:"galaxy"},
  {id:"phantom", name:"Phantom Rex",  cost:42000, body:"#6a7a9a", dark:"#37425a", belly:"#cdd8ee", acc:"shades"},

  {id:"voidrex", name:"Void Rex",     cost:88000, body:"#160a2e", dark:"#0a0518", belly:"#7a5ad0", acc:"galaxy"},
  // ----- 🎖 battle-pass EXCLUSIVE skins (earned through the pass, never bought) -----
  {id:"pass_leaf",   name:"Kush Lord",   cost:0, pass:true, body:"#39c25a", dark:"#1f7a34", belly:"#d6ffb0", acc:"rasta"},
  {id:"pass_gold",   name:"24K Rex",     cost:0, pass:true, body:"#ffcf2e", dark:"#b8901c", belly:"#fff4c0", acc:"crown"},
  {id:"pass_cyber",  name:"Neon Outlaw", cost:0, pass:true, body:"#15e0d0", dark:"#0a8c82", belly:"#b6fff7", acc:"cyber"},
  {id:"pass_inferno",name:"Inferno Rex", cost:0, pass:true, body:"#ff3a1a", dark:"#8c1a0a", belly:"#ffae6a", acc:"devil"},
  {id:"pass_frost",  name:"Glacier Rex", cost:0, pass:true, body:"#7fe0ff", dark:"#2f8fc4", belly:"#eaffff", acc:"ice"},
  {id:"pass_legend", name:"Legend Rex",  cost:0, pass:true, body:"#e9d6ff", dark:"#7a52c4", belly:"#ffffff", acc:"diamond"},
];
const skinById = (id)=> SKINS.find(s=>s.id===id) || SKINS[0];
// ---- top-tier "chromatic" skins: metallic base + animated shimmer band (distinct from flat 'rainbow') ----
const CHROMATIC = new Set(["diamond","galaxy","prism","aurora","chrome","cosmic","celestial","titan","voidrex","pass_legend"]);  // ids that get the shimmer treatment
const isChromatic = (sk)=> sk && CHROMATIC.has(sk.id);
// a shimmering metallic fill for a band [x0,y0..x1,y1]; phase animates the light sweep
function chromaFill(x0,y0,x1,y1,phase,sat=70,lite=58){
  const g=ctx.createLinearGradient(x0,y0,x1,y1);
  const s=(Math.sin(phase)*0.5+0.5);            // 0..1 sweep position of the bright band
  for(let i=0;i<=6;i++){
    const t=i/6;
    const d=Math.abs(t-s);                       // distance from the moving light band
    const l=clamp(lite + (1-Math.min(d*3.2,1))*34, 18, 94);   // bright crest, darker flanks
    const hue=( (frameCount*1.6) + t*120 )%360;   // slow rainbow drift across the band
    g.addColorStop(t, `hsl(${hue} ${sat}% ${l}%)`);
  }
  return g;
}

// ---------------- 🎖 BATTLE PASS ----------------
// The more you play (and the better you run), the more XP you bank. Crossing a tier's XP threshold
// auto-grants its reward forever: free kush 🌿 or an EXCLUSIVE Rex skin you can't buy in the shop.
// XP per run = 50 just for playing + the run's score, so every single run pushes you forward.
const PASS_TIERS = [
  { xp:100,   reward:{kush:50} },
  { xp:250,   reward:{skin:"pass_leaf"} },
  { xp:450,   reward:{kush:100} },
  { xp:700,   reward:{kush:150} },
  { xp:1000,  reward:{skin:"pass_cyber"} },
  { xp:1400,  reward:{kush:200} },
  { xp:1900,  reward:{kush:300} },
  { xp:2500,  reward:{skin:"pass_gold"} },
  { xp:3200,  reward:{kush:400} },
  { xp:4000,  reward:{kush:500} },
  { xp:5000,  reward:{skin:"pass_frost"} },
  { xp:6200,  reward:{kush:700} },
  { xp:7600,  reward:{kush:900} },
  { xp:9200,  reward:{skin:"pass_inferno"} },
  { xp:11000, reward:{kush:1200} },
  { xp:13500, reward:{kush:1600} },
  { xp:16500, reward:{kush:2000} },
  { xp:20000, reward:{skin:"pass_legend"} },   // 🏆 final tier — the Legend Rex
];
function passXPForRun(runScore){ return 50 + Math.max(0, Math.floor(runScore||0)); }
function passRewardLabel(r){ return r.skin ? ("🦖 "+skinById(r.skin).name) : ("+"+r.kush+"🌿"); }
// grant every tier the player's XP now reaches but hasn't claimed yet; returns the freshly-unlocked rewards
function claimPassRewards(){
  const out=[];
  let tier=Math.max(0, Math.min(DB.passTier, PASS_TIERS.length));
  while (tier < PASS_TIERS.length && DB.passXP >= PASS_TIERS[tier].xp){
    const r=PASS_TIERS[tier].reward;
    if (r.kush){ DB.bank = DB.bank + r.kush; }
    if (r.skin){ const o=DB.owned; if(o.indexOf(r.skin)<0){ o.push(r.skin); DB.owned=o; } }
    out.push({tier:tier+1, reward:r});
    tier++;
  }
  DB.passTier = tier;
  return out;
}
// add XP for a finished run and bank any rewards it unlocked
function addPassProgress(runScore){
  DB.passXP = DB.passXP + passXPForRun(runScore);
  return claimPassRewards();
}
// progress info for the UI: current claimed tier, the next tier, and the bar fraction toward it
function passProgress(){
  const xp=DB.passXP, claimed=Math.max(0, Math.min(DB.passTier, PASS_TIERS.length));
  if (claimed>=PASS_TIERS.length) return { xp, claimed, done:true, frac:1, next:null, base:PASS_TIERS[PASS_TIERS.length-1].xp, target:PASS_TIERS[PASS_TIERS.length-1].xp };
  const base = claimed>0 ? PASS_TIERS[claimed-1].xp : 0;
  const target = PASS_TIERS[claimed].xp;
  return { xp, claimed, done:false, frac:clamp((xp-base)/Math.max(1,target-base),0,1), next:PASS_TIERS[claimed], base, target };
}
let lastPassUnlocks=[];   // rewards unlocked on the most recent run — shown on the game-over screen

// ---------------- leaderboard ----------------
// Works per-device out of the box. To make the list GLOBAL (shared by everyone
// who opens the link): get a free Pantry ID at getpantry.cloud (email only, no
// password), then set provider:"pantry" + paste the id below and re-deploy.
const BOARD = {
  provider: "pantry",                // GLOBAL leaderboard, shared by everyone with the link
  pantryId: "1ac0a8d5-7776-42ae-8f87-c375c3d33c30",
  basket:   "maria_trex_scores",
  max:      100,
};
// ---------------- weekly competitive season — ends Sunday 21:00 Europe/Amsterdam ----------------
// The season boundary is a fixed sequence of real instants (every Sunday at 21:00 Amsterdam
// wall-clock, DST-correct), so every client computes the same season number no matter their own
// timezone. At each boundary the current board is ARCHIVED, never wiped (see Board.unwrap), so the
// visible all-time board never loses a score — the season just buckets scores by week.
const SEASON_TZ = "Europe/Amsterdam";
const SEASON_DEADLINE_HOUR = 21;                       // 21:00 local, every Sunday
const WEEK_MS = 7*864e5;
const SEASON_REF_END = Date.UTC(2026, 5, 7, 19, 0, 0); // Sun 2026-06-07 21:00 CEST = 19:00Z — fixed season-index anchor (never change)
// Amsterdam UTC offset (minutes) at an instant, via the Intl formatToParts trick (+120 CEST / +60 CET).
function tzOffsetMin(tMs){
  const dtf=new Intl.DateTimeFormat("en-US",{timeZone:SEASON_TZ,hour12:false,year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit"});
  const p={}; for(const x of dtf.formatToParts(new Date(tMs))) p[x.type]=x.value;
  const hh = p.hour==="24" ? 0 : Number(p.hour);
  return Math.round((Date.UTC(+p.year,+p.month-1,+p.day,hh,+p.minute,+p.second) - tMs)/60000);
}
// epoch ms of the first Sunday-21:00-Amsterdam boundary strictly AFTER tMs (DST-correct)
function seasonEndAt(tMs){
  const off=tzOffsetMin(tMs);
  const wall=new Date(tMs+off*60000);                  // read via getUTC* → Amsterdam wall-clock fields
  const dow=wall.getUTCDay();
  const past=(wall.getUTCHours()>SEASON_DEADLINE_HOUR)||(wall.getUTCHours()===SEASON_DEADLINE_HOUR&&(wall.getUTCMinutes()>0||wall.getUTCSeconds()>0||wall.getUTCMilliseconds()>0));
  let add=(7-dow)%7; if(add===0 && past) add=7;        // this Sunday if 21:00 is still ahead, else next Sunday
  const targetWall=Date.UTC(wall.getUTCFullYear(),wall.getUTCMonth(),wall.getUTCDate()+add,SEASON_DEADLINE_HOUR,0,0);
  let end=targetWall-off*60000;                         // back to a real instant…
  const off2=tzOffsetMin(end); if(off2!==off) end=targetWall-off2*60000;   // …re-resolve if the boundary falls the other side of a DST switch
  return end;
}

  if (ms<0) ms=0;
  const totMin=Math.floor(ms/60000), d=Math.floor(totMin/1440), h=Math.floor((totMin%1440)/60), m=totMin%60;

// timed fetch — aborts a hung/slow Pantry after `ms` so a finish can never block for minutes
// (live-probed: Pantry can hang 60-90s). A timed-out call rejects fast so the retry/queue logic proceeds.
async function fetchT(url, opts, ms){
  ms = ms || 7000;
  let ac=null, t=null;
  try{ ac=new AbortController(); t=setTimeout(()=>{ try{ ac.abort(); }catch(e){} }, ms); }catch(e){ ac=null; }
  try{ return await fetch(url, ac ? Object.assign({}, opts||{}, {signal:ac.signal}) : (opts||{})); }
  finally{ if(t) clearTimeout(t); }
}

// Pantry was the only backend and it kept going offline. We now read/write a sturdier PRIMARY
// first and only fall back to Pantry if the primary is unreachable — so the leaderboard survives
// either provider going down. Each shared document (scores / stats / profiles) is one JSON value.
//
// PRIMARY = Firebase Realtime Database (free, rock-solid, browser-CORS-correct). To turn it on:
//   1. console.firebase.google.com → Add project (any name, e.g. "kush-rush").
//   2. Build → Realtime Database → Create database → Start in TEST mode (public read/write).
//   3. Copy the database URL shown at the top (looks like
//      https://kush-rush-default-rtdb.europe-west1.firebasedatabase.app ) and paste it into CLOUD.FB below.
// Empty CLOUD.FB ⇒ Pantry-only (exactly the old behaviour, no regression).
const CLOUD = {
  FB: "https://kush-rush-864ed-default-rtdb.europe-west1.firebasedatabase.app",   // PRIMARY backend (Pantry is now only the fallback)
  pantryId: BOARD.pantryId,
  paths: { scores:"maria_trex_scores", stats:"maria_trex_stats", profiles:"maria_trex_profiles", chat:"maria_trex_chat" },
  hasPrimary(){ return typeof this.FB==="string" && this.FB.length>10; },
  configured(){ return this.hasPrimary() || (this.pantryId && this.pantryId.length>10); },
  fbUrl(doc){ return this.FB.replace(/\/+$/,"")+"/"+this.paths[doc]+".json"; },
  pantryUrl(doc){ return "https://getpantry.cloud/apiv1/pantry/"+this.pantryId+"/basket/"+this.paths[doc]; },
  // read a document: PRIMARY first (skip if it has no data yet), else Pantry. null = BOTH unreachable.
  async read(doc){
    if (this.hasPrimary()){
      try{ const r=await fetchT(this.fbUrl(doc),{cache:"no-store"}); if(r.ok){ const d=await r.json(); if(d!==null && d!==undefined) return d; } }catch(e){}
    }

  },
  // explicit single-backend reads (used by the one-time Pantry→primary migration)

    try{ const r=await fetchT(this.pantryUrl(doc),{cache:"no-store"}); if(r.ok) return await r.json(); if(r.status===400) return {}; }catch(e){}
    return null;
  },
  // write a document: PRIMARY first; only touch Pantry if the primary write fails (keeps the dead-Pantry hang off the hot path).
  async write(doc, body){
    if (this.hasPrimary()){

    }
    try{ const w=await fetchT(this.pantryUrl(doc),{ method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body), keepalive:true }, 9000); return !!(w&&w.ok); }catch(e){}

  },
};

  pendingSet(a){ try{ localStorage.setItem("maria_scores_pending", JSON.stringify((a||[]).slice(-200))); }catch(e){} },

// ---------------- global "games played" counter (all-time, survives season resets) ----------------
// Lives in its OWN Pantry basket so the weekly season rollover never touches it. Best-effort: a read-
// modify-write bump per finished run; concurrent finishes may rarely drop a count (fine for a vanity stat).
const STATS = { pantryId: BOARD.pantryId, basket: "maria_trex_stats" };
const Stats = {
  plays: -1,                                                       // global all-time count, -1 = not yet known
  global(){ return CLOUD.configured(); },
  localPlays(){ try{ return Number(localStorage.getItem("maria_plays_local")||0)||0; }catch(e){ return 0; } },
  bumpLocal(){ try{ localStorage.setItem("maria_plays_local", String(this.localPlays()+1)); }catch(e){} },
  display(){ return this.plays>=0 ? this.plays : this.localPlays(); },   // global if synced, else the local tally
  async fetch(){
    if (!this.global()) return;
    const d=await CLOUD.read("stats");
    if (d){ const p=Math.max(0,Math.floor(Number(d.plays)||0)); this.plays=Math.max(this.plays<0?0:this.plays, p); }   // never let the counter go backwards
  },
  async bump(){
    this.bumpLocal();                                              // always count locally (offline-proof)
    if (!this.global()) return;
    const d=await CLOUD.read("stats");
    const cur=d ? Math.max(0,Math.floor(Number(d.plays)||0)) : 0;
    const next=Math.max(cur, this.plays<0?0:this.plays)+1;
    if (await CLOUD.write("stats",{plays:next})) this.plays=next;
  },

// 12345 -> "12,345"
function fmtInt(n){ return String(Math.max(0,Math.floor(n||0))).replace(/\B(?=(\d{3})+(?!\d))/g,","); }

// ---------------- per-name account sync (Pantry profiles basket) ----------------
// Every player NAME owns a cloud profile {bank,owned,skin,pet,best,bestDist}. Loading a name
// adopts that profile into DB; saving reconciles via read-modify-write so two devices (or two
// names) never clobber each other. Profile is the SINGLE SOURCE for bank/owned/skin/pet.
const PROFILES = { pantryId: BOARD.pantryId, basket: "maria_trex_profiles" };

  status: "local",          // "local" | "loading" | "synced" | "offline"

  // SAVE current DB into profiles[name]; preserves every OTHER name (read fresh each pass).
  async save(){
    if (!this.global()){ this.status="local"; return; }
    const k=this.key(DB.name); if(!k) return;
    if (k!==this.loadedName){ return; }                     // name changed but its profile not yet adopted → refuse stale save
    if (this.saving){ this.dirty=true; return; }            // a save is in-flight → coalesce
    this.saving=true; this.status="loading";
    try{
      for (let pass=0; pass<3; pass++){
        const mineNow=this.fromDB();                        // re-snapshot each pass (latest local truth)
        const basket=await this.readBasket();
        const profiles=(basket && basket.profiles && typeof basket.profiles==="object")?basket.profiles:{};
        const cloudBank=Math.max(0, Math.floor(Number((profiles[k]||{}).bank)||0));
        const delta=Math.floor(DB.bank) - Math.floor(this.syncedBank||0);   // this session's net earn/spend
        const merged=this.mergeInto(profiles[k]||{}, mineNow);
        merged.bank=Math.max(0, cloudBank + delta);             // apply delta to FRESH cloud, never clobber another device's earnings
        profiles[k]=merged;
        DB.bank=merged.bank; this.syncedBank=merged.bank;       // re-anchor to what we just persisted
        const body=Object.assign({}, basket||{}, {profiles});   // preserve any sibling top-level keys
        let ok=await CLOUD.write("profiles", body);              // primary first, Pantry fallback
        if (ok){
          const after=await this.readBasket();              // verify our slot landed; if raced, retry fresh
          const got=after && after.profiles && after.profiles[k];
          const wantOwned=profiles[k].owned||[], gotOwned=new Set((got&&got.owned)||[]);
          const ownedOK=wantOwned.every(id=>gotOwned.has(id));
          if (got && Number(got.bank)>=Number(profiles[k].bank) && ownedOK){ this.status="synced"; break; }
          continue;
        } else { this.status="offline"; break; }
      }
    } finally {
      this.saving=false;
      if (this.dirty){ this.dirty=false; this.save(); }     // a save requested mid-flight → run once more
    }
  },
};

// ---------------- global chat (💬 tab on the title screen) ----------------
// One shared room for everyone with the link, plus a 💡 FEEDBACK toggle so players can
// suggest game changes (feedback messages are highlighted). Backed by the Firebase
// primary ONLY: POST to the chat path is an atomic append (no read-modify-write races),
// which Pantry can't do — so when the primary is unreachable, chat just shows offline.
const Chat = {
  cache: [], status: "loading", lastFetch: 0, _fetching: false,
  sending: false, lastSendTs: 0, feedbackMode: false,
  MAX_LEN: 140, FETCH_EVERY: 4000, KEEP: 120,
  available(){ return CLOUD.hasPrimary(); },
  statusLine(){
    if (!this.available()) return "💬 chat needs the online backend";
    if (this.status==="sendfail") return "⚠️ message didn't send — tap SEND to retry";
    if (this.status==="offline")  return "🌐 offline — can't reach the chat";
    if (this.status==="loading")  return "🌐 loading chat…";
    return "🌐 live · everyone with the game sees this";
  },
  async fetch(force){
    if (!this.available()){ this.status="offline"; return; }
    if (this._fetching) return;
    if (!force && Date.now()-this.lastFetch < this.FETCH_EVERY) return;
    this._fetching=true; this.lastFetch=Date.now();
    try{
      // push-ids sort chronologically, so $key order = message order
      const r=await fetchT(CLOUD.fbUrl("chat")+'?orderBy="$key"&limitToLast='+this.KEEP, {cache:"no-store"}, 8000);
      if (r && r.ok){
        const d=(await r.json())||{};
        this.cache=Object.keys(d).sort().map(k=>d[k])
          .filter(m=> m && typeof m.text==="string" && m.text.trim())
          .map(m=>({
            name:(m.name||"???").toString().toUpperCase().slice(0,10)||"???",
            cc:(typeof m.cc==="string") ? m.cc.toUpperCase().replace(/[^A-Z]/g,"").slice(0,2) : "",
            text:m.text.toString().replace(/\s+/g," ").trim().slice(0,this.MAX_LEN),
            ts:Number(m.ts)||0, fb:!!m.fb,
          }));
        if (this.status!=="sendfail") this.status="online";
      } else if (this.status!=="sendfail") this.status="offline";
    }catch(e){ if (this.status!=="sendfail") this.status="offline"; }
    finally{ this._fetching=false; }
  },
  async send(){
    const el=chatInput, text=(el.value||"").replace(/\s+/g," ").trim().slice(0,this.MAX_LEN);
    if (!text || this.sending) return;
    const nm=Profile.key(DB.name);
    if (!nm){ G.scene="title"; needName=90; try{ nameInput.focus(); }catch(e){} return; }   // chat needs a name
    if (Date.now()-this.lastSendTs < 2500) return;                                          // gentle anti-spam
    this.sending=true; this.lastSendTs=Date.now();
    const msg={ name:nm, cc:DB.cc||"", text, ts:Date.now(), fb:!!this.feedbackMode };
    try{
      const r=await fetchT(CLOUD.fbUrl("chat"), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(msg), keepalive:true }, 9000);
      if (r && r.ok){
        el.value="";                                       // sent → clear; on failure the text stays so nothing is lost
        this.cache.push(msg); chatStick=true; this.status="online";
        this.fetch(true);
      } else this.status="sendfail";
    }catch(e){ this.status="sendfail"; }
    finally{ this.sending=false; }
  },
};

// ===== touch controls: floating JOYSTICK (left side) to steer, JUMP/SHOOT on the right =====
// Mobile only. Touch down anywhere on the LEFT side of the screen and a joystick spawns under
// your thumb; its base stays put (stuck) while you slide left↔right to steer. The whole RIGHT
// side is JUMP (tap anywhere), with the dedicated 🚬 SHOOT button keeping its own zone. A tap on
// the ≡ MENU button is left to the canvas handler. PC (keyboard + mouse) controls are unchanged.
const joyEl=document.getElementById("joystick"), knobEl=document.getElementById("joyKnob");
const JOY_RADIUS=46;       // px the knob centre can travel from the base centre
const JOY_DEAD=16;         // px of horizontal slack before a direction registers (no jitter at rest)
const STICK_FRAC=0.46;     // a touch starting in the left this fraction of the screen = the joystick
function inStickZone(cx){ return cx < window.innerWidth*STICK_FRAC; }
function moveKnob(dx,dy){ knobEl.style.transform="translate("+dx+"px,"+dy+"px)"; }
function showJoy(x,y){ joyEl.style.left=x+"px"; joyEl.style.top=y+"px"; joyEl.style.display="block"; moveKnob(0,0); }
function hideJoy(){ joyEl.style.display="none"; moveKnob(0,0); }

const PAD_UP=80, PAD_DN=40, PAD_X=8;              // generous invisible halo around the 🚬 SHOOT button
function zoneRect(el, padX, padUp, padDn){ const r=el.getBoundingClientRect(); return {l:r.left-padX, r:r.right+padX, t:r.top-padUp, b:r.bottom+padDn, w:r.width}; }
function rightZone(cx, cy){                        // right side: inside the 🚬 SHOOT halo = fire, else JUMP
  const F=btnEls.fire;
  if (F){ const z=zoneRect(F,PAD_X,PAD_UP,PAD_DN); if(cx>=z.l&&cx<=z.r&&cy>=z.t&&cy<=z.b) return "fire"; }
  return "jump";
}
function onScreenButton(cx, cy){ const r=canvas.getBoundingClientRect(); const px=(cx-r.left)*(VW/r.width), py=(cy-r.top)*(VH/r.height);
  for(const b of uiButtons){ if(px>=b.x&&px<=b.x+b.w&&py>=b.y&&py<=b.y+b.h) return true; } return false; }
let stickId=null;            // identifier of the touch currently driving the joystick (one at a time)
const touchCtl=new Map();    // touch identifier -> {kind:"stick",ox,oy,dir} | {kind:"fire"|"jump"}
function refreshKeys(){
  let l=false,r=false,f=false,j=false;
  for (const v of touchCtl.values()){
    if (v.kind==="stick"){ if(v.dir<0) l=true; else if(v.dir>0) r=true; }
    else if (v.kind==="fire") f=true;
    else if (v.kind==="jump") j=true;
  }
  keys.left=l; keys.right=r; keys.fire=f; keys.jump=j;
  if(btnEls.fire) btnEls.fire.classList.toggle("on",f);
  if(btnEls.jump) btnEls.jump.classList.toggle("on",j);
}
function tStart(e){
  Music.start();
  if (G.scene!=="play") return;                                  // menus: canvas handler navigates
  for (const t of e.changedTouches){
    if (onScreenButton(t.clientX,t.clientY)) continue;           // leave the ≡ MENU tap to handleClick
    if (inStickZone(t.clientX)){
      if (stickId!==null) continue;                              // one joystick at a time
      stickId=t.identifier;
      touchCtl.set(t.identifier, {kind:"stick", ox:t.clientX, oy:t.clientY, dir:0});
      showJoy(t.clientX, t.clientY);
    } else {
      touchCtl.set(t.identifier, {kind:rightZone(t.clientX,t.clientY)});
    }
  }
  refreshKeys();
  if (e.cancelable) e.preventDefault();
}
function tMove(e){
  if (G.scene!=="play" || !touchCtl.size) return;
  let changed=false;
  for (const t of e.changedTouches){
    const v=touchCtl.get(t.identifier);
    if (!v || v.kind!=="stick") continue;                        // only the joystick touch slides; jump/fire are fixed
    let dx=t.clientX-v.ox, dy=t.clientY-v.oy;
    const d=Math.hypot(dx,dy);
    if (d>JOY_RADIUS){ const s=JOY_RADIUS/d; dx*=s; dy*=s; }      // clamp the knob inside the base ring
    moveKnob(dx,dy);
    const ndir = dx<-JOY_DEAD ? -1 : (dx>JOY_DEAD ? 1 : 0);      // only the horizontal axis steers
    if (ndir!==v.dir){ v.dir=ndir; changed=true; }
  }
  if (changed) refreshKeys();
  if (e.cancelable) e.preventDefault();
}
function tEnd(e){
  for (const t of e.changedTouches){
    if (!touchCtl.has(t.identifier)) continue;
    if (t.identifier===stickId){ stickId=null; hideJoy(); }
    touchCtl.delete(t.identifier);
  }
  refreshKeys();
}
addEventListener("touchstart", tStart, {passive:false});

// ---------------- audio ----------------
let actx=null;
let muted=(function(){ try{ return localStorage.getItem("maria_muted")==="1"; }catch(e){ return false; } })();   // remembered across sessions
function ac(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ actx=null; } } return actx; }
function tone(freq, dur=0.08, type="square", vol=0.12, slideTo=null, delay=0){
  if (muted) return; const a=ac(); if(!a) return;
  const t=a.currentTime+delay;
  const o=a.createOscillator(), g=a.createGain();
  o.type=type; o.frequency.setValueAtTime(freq,t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(1,slideTo), t+dur);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+dur+0.03);
}
const sfx = {
  jump(){ tone(420,0.12,"square",0.10,760); },
  bounce(){ tone(300,0.18,"square",0.12,900); tone(620,0.10,"square",0.08,1200,0.06); },
  shoot(){ tone(820,0.07,"square",0.08,420); tone(180,0.06,"sawtooth",0.05,80,0.01); },
  collect(){ tone(880,0.06,"square",0.09,1320); },
  stomp(){ tone(220,0.10,"sawtooth",0.12,90); },
  bong(){ tone(170,0.18,"sine",0.14,520); tone(300,0.2,"sine",0.12,720,0.09); },
  star(){ [523,659,784,1046].forEach((f,i)=>tone(f,0.12,"triangle",0.12,null,i*0.07)); },
  hurt(){ tone(300,0.22,"sawtooth",0.16,70); },
  die(){ [400,300,200,120].forEach((f,i)=>tone(f,0.16,"square",0.14,null,i*0.11)); },
  bribe(){ tone(1318,0.06,"square",0.1); tone(1568,0.10,"square",0.12,null,0.07); tone(2093,0.12,"square",0.1,null,0.15); },
  hang(){ [311,277,247,220].forEach((f,i)=>tone(f,0.32,"sawtooth",0.14, f*0.8, i*0.26)); },
  level(){ [523,659,784,1046,1318].forEach((f,i)=>tone(f,0.12,"triangle",0.12,null,i*0.08)); },
  boss(){ tone(70,0.5,"sawtooth",0.18,55); tone(110,0.5,"square",0.10,90,0.1); },
  life(){ [784,1046,1318,1568].forEach((f,i)=>tone(f,0.14,"triangle",0.13,null,i*0.09)); },

// ---------------- background music (chiptune loop, theme-aware) ----------------
const midi=(n)=>440*Math.pow(2,(n-69)/12);
const Music = {
  on:true, step:0, bar:0, nextTime:0, timer:null, root:0, tempo:82, tense:false,
  // REGGAE one-drop, 16 steps/bar (4 steps per beat). null = rest.
  bass:[0,null,null,0,  null,null,7,null,  5,null,null,5,  3,null,0,null],   // deep syncopated reggae bass
  lead:[null,null,null,null, null,null,12,null, null,null,null,null, null,null,15,14], // sparse skanky lead licks
  prog:[0,0,5,5, 7,5,0,0],     // chord roots per bar (I-IV-V vibe)
  start(){
    if (this.timer) return;
    const a=ac(); if(!a) return;
    if (a.state==="suspended") a.resume();
    this.nextTime=a.currentTime+0.08;
    this.timer=setInterval(()=>this.sched(),25);
  },
  stop(){ if(this.timer){ clearInterval(this.timer); this.timer=null; } },
  setTheme(i){ const T=[{r:0,t:82},{r:5,t:86},{r:-2,t:74},{r:3,t:90}][i%4]; this.root=T.r; this.tempo=T.t; },
  note(freq,t,dur,type,vol){ const a=ac(); if(!a)return; const o=a.createOscillator(),g=a.createGain();
    o.type=type; o.frequency.setValueAtTime(freq,t); g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(vol,t+0.012); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+dur+0.03); },
  hat(t,vol){ const a=ac(); if(!a)return; const o=a.createOscillator(),g=a.createGain();
    o.type="square"; o.frequency.setValueAtTime(8200,t); g.gain.setValueAtTime(vol||0.016,t);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.03); o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+0.05); },
  skank(t, chord){ // offbeat organ chord stab — the reggae "skank"
    for(const iv of [0,3,7]) this.note(midi(48+this.root+chord+iv), t, 0.11, "square", 0.028);
    this.note(midi(60+this.root+chord), t, 0.10, "triangle", 0.018);
  },
  rim(t){ const a=ac(); if(!a)return; const o=a.createOscillator(),g=a.createGain();
    o.type="square"; o.frequency.setValueAtTime(2100,t); o.frequency.exponentialRampToValueAtTime(420,t+0.05);
    g.gain.setValueAtTime(0.06,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.06);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+0.08); },
  sched(){
    const a=ac(); if(!a){ this.stop(); return; }
    const tempo=this.tempo*(this.tense?1.12:1);
    const spb=60/tempo/4; let guard=0;
    while (this.nextTime < a.currentTime+0.12 && guard++<40){
      if (!muted && this.on){
        const s=this.step, t=this.nextTime, chord=this.prog[this.bar % this.prog.length];
        const b=this.bass[s]; if(b!=null) this.note(midi(28+this.root+chord+b), t, spb*2.2, "triangle", 0.11);
        const l=this.lead[s]; if(l!=null) this.note(midi(60+this.root+chord+l), t, spb*1.4, "square", this.tense?0.05:0.04);
        if (s%4===2){ this.skank(t, chord); this.hat(t, 0.014); }   // skank + hat on the OFFBEAT
        else if (s%4===0) this.hat(t, 0.008);
        if (s===8){ this.note(midi(21+this.root), t, 0.18, "sine", 0.13); this.rim(t); }  // ONE-DROP: kick+rim on beat 3
        if (s===0) this.note(midi(21+this.root), t, 0.10, "sine", 0.05);
      }
      this.step=(this.step+1)%16; if(this.step===0) this.bar++; this.nextTime+=spb;
    }
  },
};
function toggleMusic(){ Music.on=!Music.on; }
// master mute — silences SFX *and* music (Music.sched checks !muted); remembered across sessions
function toggleMute(){ muted=!muted; try{ localStorage.setItem("maria_muted", muted?"1":"0"); }catch(e){} if(!muted){ Music.start(); } }

// ---------------- utils ----------------
const rnd=(a,b)=>a+Math.random()*(b-a);
const irnd=(a,b)=>Math.floor(rnd(a,b+1));
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const aabb=(a,b)=> a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y;
function roundRect(x,y,w,h,r,c){ c=c||ctx; c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
// pre-render static art to an offscreen canvas ONCE, then blit per frame — drawing the same
// vector art (esp. with shadowBlur) every frame was the #1 frame-time cost on phones
function makeSprite(w,h,drawFn){ const cv=document.createElement("canvas"); cv.width=w; cv.height=h; drawFn(cv.getContext("2d")); return cv; }

// ---------------- world generation ----------------
function generateSegment(){
  const sx=genX;
  const diff = clamp(distance/2400,0,1);
  level = Math.floor(distance/LEVEL_LEN);
  const th = curTheme();

  // ground / pit  (never a pit on a level-boundary segment — keep the castle run-through safe)
  const lvX=LEVEL_LEN*10, nb=Math.ceil((sx+1)/lvX)*lvX, hasBoundary=(nb<sx+SEG_W && nb>0);
  const pitChance = 0.10 + diff*0.20;
  if (Math.random()<pitChance && sx>1100 && !hasBoundary){
    const gap = irnd(95, 95+Math.floor(120*diff));
    const px = sx+irnd(60,150);
    pits.push({x:px,w:gap,lava:th.lava});
    platforms.push({x:sx,y:GROUND_TOP,w:px-sx,h:VH-GROUND_TOP+260,ground:true});
    platforms.push({x:px+gap,y:GROUND_TOP,w:(sx+SEG_W)-(px+gap),h:VH-GROUND_TOP+260,ground:true});
    if (Math.random()<0.6){
      const fw=irnd(80,120), fy=GROUND_TOP-irnd(120,170);
      const fp={x:px+gap/2-fw/2,y:fy,w:fw,h:22,brick:true};
      platforms.push(fp); weeds.push(mkWeed(fp.x+fw/2-12, fp.y-34));
    }
  } else {
    platforms.push({x:sx,y:GROUND_TOP,w:SEG_W,h:VH-GROUND_TOP+260,ground:true});
  }
  // 🏰 KUSH CASTLE gate straddling the level boundary — run THROUGH it into the next world
  if (hasBoundary){
    platforms.push({x:nb-170, y:GROUND_TOP, w:340, h:1, castleGate:true});
    for (let k=0;k<3;k++) weeds.push(mkWeed(nb-30+k*30, GROUND_TOP-34));   // little reward at the gate
  }

  // 🏙️ KL PETRONAS TWIN TOWERS — a special landmark obstacle, once per level.
  // Solid columns up high (block traversal), but an open archway at the base so you
  // run through; climb the inner stairs to the skybridge for a reward.
  {
    const segLevel = Math.floor((sx/10)/LEVEL_LEN);
    const intoLevel = (sx/10) % LEVEL_LEN;
    if (towerLevel < segLevel && sx>1000 && intoLevel>180 && Math.random()<0.55){
      const colW=46, gap=irnd(150,190), archH=104;
      const baseX = sx + irnd(20, Math.max(30, SEG_W-2*colW-gap-20));
      const x1=baseX, x2=baseX+colW+gap, midX=x1+colW+gap/2;
      const topY = GROUND_TOP - irnd(340,470);
      const bodyH = (GROUND_TOP-archH) - topY;
      if (bodyH>120 && !inPit(x1) && !inPit(x2) && !inPit(midX)){
        // decorative columns (NO collision) so they never wall you — run/jump straight through
        platforms.push({x:x1,y:topY,w:colW,h:bodyH,tower:true});
        platforms.push({x:x2,y:topY,w:colW,h:bodyH,tower:true});
        const sbY = topY + bodyH*0.40;                       // skybridge deck
        platforms.push({x:x1+colW,y:sbY,w:gap,h:16,brick:true,skybridge:true});
        for (const hh of [80,160,240]) if (GROUND_TOP-hh > sbY+24) platforms.push({x:midX-26,y:GROUND_TOP-hh,w:52,h:14,brick:true});
        if (Math.random()<0.5) wings.push(mkWings(midX-20,sbY-50)); else stars.push(mkStar(midX-16,sbY-46));
        for (let k=0;k<3;k++) floatPickups.push(mkWeed(x1+colW+12+k*30,sbY-40,true));
        towerLevel = segLevel;
      }
    }
  }

  // FLOATING staircase blocks — lowest step removed so you run UNDERNEATH,
  // then jump up onto them. One-way (no side blocking), with headroom to pass.
  if (Math.random()<0.45 && sx>700){
    const bx=sx+irnd(20,140), steps=irnd(2,3);
    const baseY=GROUND_TOP-110;        // floats well above head height
    for (let i=0;i<steps;i++){
      platforms.push({x:bx+i*32, y:baseY-i*32, w:32, h:30, brick:true, step:true});
    }
    if (Math.random()<0.7) weeds.push(mkWeed(bx+(steps-1)*32+4, baseY-(steps-1)*32-34));
  }

  // DOODLE-JUMP vertical climb: zig-zag rungs going way up to a star
  if (Math.random()<0.16 && sx>1500){
    const cx=sx+irnd(90,SEG_W-130);
    const rungs=irnd(5,8);            // taller — climbs reach the high sky
    let py=GROUND_TOP-86, side=(Math.random()<.5?-1:1), topY=py;
    for (let i=0;i<rungs;i++){
      const px=clamp(cx+side*irnd(26,66), sx+8, sx+SEG_W-76);
      platforms.push({x:px, y:Math.max(SKY_TOP+30,py), w:66, h:18, brick:true, cloud:i>=2});
      if (Math.random()<0.5) floatPickups.push(mkWeed(px+22, py-34, true));
      topY=Math.max(SKY_TOP+30,py); py-=irnd(84,108); side*=-1;
    }
    // reward at the very top — usually the WINGS power-up
    const topX=clamp(cx-16,sx,sx+SEG_W-44);
    if (Math.random()<0.6) wings.push(mkWings(topX-6, topY-58)); else stars.push(mkStar(topX, topY-54));
  }

  // floating platforms with goodies + arcs
  if (Math.random()<0.85){
    const n=irnd(1,2);
    for (let c=0;c<n;c++){
      const fw=irnd(70,140), fx=sx+irnd(20,SEG_W-fw-20), fy=GROUND_TOP-irnd(110,300);
      platforms.push({x:fx,y:fy,w:fw,h:22,brick:true, cloud:(fy<GROUND_TOP-230)});
      if (Math.random()<0.55){
        for (let k=0;k<4;k++) floatPickups.push(mkWeed(fx-80+k*26, fy-40-Math.sin(k/3*Math.PI)*34, true));
      } else weeds.push(mkWeed(fx+fw/2-12, fy-34));
    }
  }

  // trampolines (reach the sky)
  if (Math.random()<0.22 && sx>900){
    const tx=sx+irnd(40,SEG_W-90);
    if (!inPit(tx)){
      platforms.push({x:tx,y:GROUND_TOP-14,w:56,h:14,tramp:true,squish:0});
      // reward WAY high above a trampoline (trampolines now fling you far up)
      const hy=GROUND_TOP-irnd(430,640), hw=86;
      const hx=clamp(tx-15,sx,sx+SEG_W-hw);
      platforms.push({x:Math.max(sx,hx),y:Math.max(SKY_TOP+24,hy),w:hw,h:22,brick:true,cloud:true});
      const rr=Math.random(), ry=Math.max(SKY_TOP+24,hy);
      if (rr<0.34) wings.push(mkWings(hx+hw/2-20, ry-52));
      else if (rr<0.67) stars.push(mkStar(hx+hw/2-16, ry-46));
      else { for(let k=0;k<3;k++) floatPickups.push(mkWeed(hx+10+k*28, ry-40, true)); }
    }
  }

  // CALI BUD star (sky)
  if (Math.random()<0.10 && sx>1500){
    const fw=90, fx=sx+irnd(40,SEG_W-fw-40), fy=GROUND_TOP-irnd(230,330);
    platforms.push({x:fx,y:fy,w:fw,h:22,brick:true,cloud:true});
    stars.push(mkStar(fx+fw/2-16, fy-46));
  }

  // 🔮 SECRET collectible — rare, floats high & easy to miss; counts toward rank, never shown
  if (Math.random()<0.07 && sx>1700){
    const hx=sx+irnd(40,SEG_W-60), hy=Math.max(SKY_TOP+30, GROUND_TOP-irnd(300,640));
    hiddens.push(mkHidden(hx, hy));
  }

  // BONG speed
  if (Math.random()<0.16 && sx>900){
    const bx=sx+irnd(60,SEG_W-60);
    if(!inPit(bx)) bongs.push({x:bx,y:GROUND_TOP-40,w:26,h:40,bob:rnd(0,6.28),taken:false});
  }

  // BLOW CANNON pickup
  if (Math.random()<0.13 && sx>1300){
    const cx=sx+irnd(60,SEG_W-60);
    if(!inPit(cx)) cannons.push({x:cx,y:GROUND_TOP-34,w:40,h:34,bob:rnd(0,6.28),taken:false});
  }

  // weed plants on ground
  for (let i=0;i<irnd(1,3);i++){
    const wx=sx+irnd(40,SEG_W-40);
    if(!inPit(wx)) weeds.push(mkWeed(wx, GROUND_TOP-34));
  }

  // enemies (varied cops + dealers)
  if (Math.random() < 0.5+diff*0.35 && sx>800){
    const n=irnd(1, 1+Math.round(diff*1.6));
    for (let i=0;i<n;i++){
      const ex=sx+irnd(60,SEG_W-60);
      if (inPit(ex)) continue;
      enemies.push(mkEnemy(pickEnemyType(diff), ex));
    }
  }

  // CARTEL BOSS (rare, gives +1 life)
  if (!bossAlive && distance>bossSpawnDist && sx>1400 && Math.random()<0.5){
    const ex=sx+irnd(80,SEG_W-100);
    if (!inPit(ex)){
      enemies.push(mkEnemy("boss", ex));
      bossAlive=true; bossSpawnDist=distance+rnd(420,640);
    }
  }

  genX+=SEG_W;
}
function pickEnemyType(diff){
  const r=Math.random();
  if (r<0.30) return "dealer";
  if (r<0.52) return "cop";
  if (r<0.70) return "cop_s";
  if (r<0.86) return "cop_big";
  return "cop_aggro";
}
function mkEnemy(type, x){
  const base={type,x,dead:false,squish:0,t:rnd(0,6.28),hp:1,aggro:false};
  if (type==="dealer")   return {...base,y:GROUND_TOP-44,w:38,h:44,vx:(Math.random()<.5?-1:1)*rnd(.8,1.4),homeL:x-rnd(40,90),homeR:x+rnd(40,90)};
  if (type==="cop")      return {...base,y:GROUND_TOP-46,w:38,h:46,vx:(Math.random()<.5?-1:1)*rnd(1.1,1.7),homeL:x-rnd(50,100),homeR:x+rnd(50,100)};
  if (type==="cop_s")    return {...base,y:GROUND_TOP-38,w:30,h:38,vx:(Math.random()<.5?-1:1)*rnd(1.8,2.6),homeL:x-rnd(60,120),homeR:x+rnd(60,120)};
  if (type==="cop_big")  return {...base,y:GROUND_TOP-62,w:54,h:62,vx:(Math.random()<.5?-1:1)*rnd(.7,1.0),hp:2,homeL:x-rnd(40,80),homeR:x+rnd(40,80)};
  if (type==="cop_aggro")return {...base,y:GROUND_TOP-46,w:40,h:46,vx:(Math.random()<.5?-1:1)*rnd(1.2,1.6),aggro:true,homeL:x-rnd(70,140),homeR:x+rnd(70,140)};
  /* boss */              return {...base,y:GROUND_TOP-82,w:74,h:82,vx:-rnd(.7,1.2),hp:6,maxHp:6,shootCd:80,homeL:x-300,homeR:x+300,boss:true};
}
function mkWeed(x,y,floaty=false){ return {x,y,w:24,h:30,taken:false,bob:rnd(0,6.28),floaty}; }
function mkStar(x,y){ return {x,y,w:32,h:32,taken:false,bob:rnd(0,6.28),t:rnd(0,6.28)}; }
function mkWings(x,y){ return {x,y,w:42,h:30,taken:false,bob:rnd(0,6.28)}; }
function mkHidden(x,y){ return {x,y,w:20,h:20,taken:false,bob:rnd(0,6.28),t:rnd(0,6.28)}; }  // secret rank-only collectible
function inPit(x){ return pits.some(p=> x>=p.x && x<=p.x+p.w); }

// ---------------- update ----------------
function update(){
  frameCount++;
  if (flash>0) flash--;
  if (levelFlash>0) levelFlash--;
  if (slowmo>0) slowmo--;

  for (let i=banners.length-1;i>=0;i--){ if(--banners[i].life<=0) banners.splice(i,1); }

  // hanging cinematic takes over
  if (hanging){ updateHang(); updateParticles(); return; }

  // generate ahead / cull behind
  while (genX < cam.x+VW+1500) generateSegment();
  const cull = cam.x-560;
  platforms = platforms.filter(p=> p.x+p.w>cull);
  weeds = weeds.filter(o=>!o.taken && o.x>cull);
  floatPickups = floatPickups.filter(o=>!o.taken && o.x>cull);
  enemies = enemies.filter(o=> o.x>cull-260 && o.squish<34);
  bongs = bongs.filter(o=>!o.taken && o.x>cull);
  stars = stars.filter(o=>!o.taken && o.x>cull);
  cannons = cannons.filter(o=>!o.taken && o.x>cull);
  wings = wings.filter(o=>!o.taken && o.x>cull);
  hiddens = hiddens.filter(o=>!o.taken && o.x>cull);
  pits = pits.filter(p=> p.x+p.w>cull);

  if (dead){ updateDead(); return; }

  // level progression — enter the KUSH CASTLE, each level crazier than the last
  const lv = Math.floor(distance/LEVEL_LEN);
  if (lv>level){
    level=lv; levelFlash=30; castleT=0; sfx.level(); Music.setTheme(level);
    hitTimer=Math.max(hitTimer,55);   // brief grace — the castle transition is never a death
    addBanner("🏰 LEVEL "+(level+1)+" — "+curTheme().name, "keep running, it gets crazier!", curTheme().accent, 95);
    for(let i=0;i<40;i++) particles.push({x:player.x+rnd(-40,300),y:player.y+rnd(-160,20),vx:rnd(-5,5),vy:rnd(-9,-1),life:irnd(28,56),max:56,r:rnd(2,6),col:`hsl(${irnd(0,360)} 90% 62%)`,kind:"spark"});
    screenShakeAdd(9);
  }

  if (speedTimer>0) speedTimer--;
  if (starTimer>0) starTimer--;
  if (flyTimer>0) flyTimer--;
  if (hitTimer>0) hitTimer--;
  if (fireCd>0) fireCd--;
  if (castleT>0) castleT--;
  const boosted=speedTimer>0, invincible=starTimer>0, flying=flyTimer>0;
  const targetSpd = boosted?BOOST_SPD:MOVE_SPD;

  // horizontal
  let ax=0;
  if (down("left")){ ax-=ACCEL; player.facing=-1; }
  if (down("right")){ ax+=ACCEL; player.facing=1; }
  player.vx+=ax;
  if (ax===0) player.vx*=FRICTION;
  player.vx=clamp(player.vx,-targetSpd,targetSpd);
  if (Math.abs(player.vx)<0.05) player.vx=0;

  // jump
  if (down("jump") && !player.jumpHeld) player.buffer=BUFFER;
  player.jumpHeld=down("jump");
  if (player.buffer>0) player.buffer--;
  if (player.coyote>0) player.coyote--;
  if (player.buffer>0 && (player.onGround||player.coyote>0)){
    player.vy=-JUMP_V*(boosted?1.05:1); player.onGround=false; player.coyote=0; player.buffer=0;
    player.stretch=1.18; sfx.jump(); puff(player.x+player.w/2, player.y+player.h, 6, "#e8f0ff");
  }
  if (flying){
    // 🪽 hold JUMP to soar; gravity is light and the fall is capped
    if (down("jump")){ player.vy -= 1.15; if (player.vy<-7.5) player.vy=-7.5;
      if (frameCount%3===0) particles.push({x:player.x+(player.facing>0?0:player.w),y:player.y+player.h*0.55,vx:rnd(-1,1),vy:rnd(0,1.2),life:18,max:18,r:rnd(2,4),col:"rgba(210,240,255,.85)",kind:"smoke"}); }
    player.vy = Math.min(player.vy + GRAVITY*0.32, 7);
  } else {
    // jump-cut for normal jumps only — NEVER cut a trampoline launch (let it fling you sky-high)
    if (!player.trampHold && !down("jump") && player.vy<-JUMP_CUT) player.vy=-JUMP_CUT;
    player.vy=Math.min(player.vy+GRAVITY,MAX_FALL);
    if (player.vy>=0) player.trampHold=false;   // clear at the apex
  }

  // fire joints
  if (down("fire") && ammo>0 && fireCd<=0){
    ammo--; fireCd=11; sfx.shoot();
    projectiles.push({x:player.x+(player.facing>0?player.w:-6), y:player.y+player.h*0.42,
                      vx:player.facing*12, vy:-1.1, life:64});
    puff(player.x+(player.facing>0?player.w:0), player.y+player.h*0.42, 5, "#ddd", false);
    player.vx -= player.facing*0.6; // recoil
  }

  // integrate + resolve
  player.x+=player.vx; resolveX();
  const prevFeet=player.y+player.h;
  player.y+=player.vy; resolveY(prevFeet);
  if (player.y < SKY_TOP+8){ player.y=SKY_TOP+8; if(player.vy<0) player.vy=0; }   // sky ceiling

  // squash/stretch easing
  player.stretch=lerp(player.stretch,1,0.18);
  if (player.squash>0) player.squash--;

  // fell / lava
  const cx=player.x+player.w/2;
  if (player.y>DEATH_Y){ die("fell"); }
  else if (curTheme().lava && inPit(cx) && player.y+player.h>GROUND_TOP+8){ lavaSplash(cx); die("lava"); }

  distance=Math.max(distance, Math.floor(player.x/10));

  // camera (x + vertical follow so you can climb high); zoomed out on portrait → see more around you
  const Z=viewZoom(), viewW=VW/Z, viewH=VH/Z;
  cam.x=lerp(cam.x, Math.max(0,player.x-viewW*0.34), 0.16);
  const vA=(VW<600)?0.66:0.56;                          // portrait: floor sits lower on screen (more sky above)
  const tcy=clamp(player.y-viewH*vA, SKY_TOP-40, 0);
  cam.y=lerp(cam.y, tcy, 0.12);

  // run anim
  if (player.onGround && Math.abs(player.vx)>0.4) player.runPhase+=Math.abs(player.vx)*0.06+0.07;
  else player.runPhase+=0.02;
  player.blink=(player.blink+1)%220;

  // boost trail / star sparkle (half rate when the device is struggling)
  const fxStep=lowFX?4:2;
  if (boosted && Math.abs(player.vx)>2 && frameCount%fxStep===0)
    particles.push({x:player.x+player.w/2,y:player.y+player.h*0.6,vx:-player.vx*0.3,vy:rnd(-.4,.4),life:18,max:18,r:rnd(4,9),col:"#7CFC6A",kind:"smoke"});
  if (invincible && frameCount%fxStep===0)
    particles.push({x:player.x+rnd(0,player.w),y:player.y+rnd(0,player.h),vx:rnd(-1,1),vy:rnd(-1,1),life:16,max:16,r:rnd(2,4),col:`hsl(${(frameCount*9)%360} 90% 65%)`,kind:"spark"});

  updateProjectiles();
  updateEnemies(invincible);
  updateBossShots(invincible);
  updatePickups();
  updateChase();
  if (DB.pet) updatePet();          // 🦅 move eagle + emit joint smoke BEFORE particles age this frame
  updateParticles();
}

function resolveX(){
  for (const p of platforms){
    if (!p.ground && !p.block) continue;
    if (aabb(player,p)){
      const overlapTop=(player.y+player.h)-p.y;
      if (overlapTop>10 && (player.y - p.y) < p.h - 2){
        if (player.vx>0) player.x=p.x-player.w; else if (player.vx<0) player.x=p.x+p.w;
        player.vx=0;
      }
    }
  }
}
function resolveY(prevFeet){
  player.onGround=false;
  for (const p of platforms){
    if (!(p.brick||p.ground||p.block||p.tramp)) continue;
    const thick = p.ground? (VH-GROUND_TOP+260) : (p.h+8);
    const landing = player.vy>=0 && prevFeet<=p.y+8 &&
      player.x+player.w>p.x+4 && player.x<p.x+p.w-4 &&
      player.y+player.h>=p.y && player.y+player.h<=p.y+thick;
    if (landing){
      if (p.tramp){
        player.y=p.y-player.h; player.vy=-TRAMP_BOUNCE; p.squish=12; player.trampHold=true;
        player.stretch=1.4; sfx.bounce(); puff(p.x+p.w/2,p.y,14,"#ffe27a"); player.buffer=0; screenShakeAdd(4);
      } else {
        player.y=p.y-player.h; player.vy=0; player.onGround=true; player.coyote=COYOTE;
        if (player.stretch>1.06){ player.squash=8; }
        player.stretch=0.86;
      }
    }
  }
}

function updateProjectiles(){
  for (const j of projectiles){
    j.x+=j.vx; j.vy+=0.05; j.y+=j.vy; j.life--;
    if (frameCount%2===0) particles.push({x:j.x,y:j.y,vx:rnd(-.4,.4),vy:rnd(-.6,-.1),life:14,max:14,r:rnd(2,4),col:"rgba(220,220,220,.8)",kind:"smoke"});
    for (const e of enemies){
      if (e.dead) continue;
      if (aabb({x:j.x-4,y:j.y-3,w:10,h:8}, e)){ damageEnemy(e,1,"joint"); j.life=0; flash=Math.max(flash,4); break; }
    }
  }
  projectiles=projectiles.filter(j=> j.life>0 && j.x>cam.x-80 && j.x<camRightX());
}
function updateBossShots(invincible){
  for (const b of bossShots){
    b.x+=b.vx; b.y+=b.vy; b.life--;
    if (frameCount%2===0) particles.push({x:b.x,y:b.y,vx:0,vy:0,life:8,max:8,r:2,col:"rgba(255,120,70,.6)",kind:"smoke"});
    if (hitTimer<=0 && !invincible && !dead && !hanging && aabb({x:b.x-4,y:b.y-4,w:8,h:8}, player)){ b.life=0; hurt(); }
  }
  bossShots = bossShots.filter(b=> b.life>0 && b.x>cam.x-100 && b.x<camRightX() && b.y<DEATH_Y);
}

function updateEnemies(invincible){
  for (const e of enemies){
    if (e.dead){ e.squish++; continue; }
    e.t+=0.08;
    if (e.aggro){
      const dx=(player.x+player.w/2)-(e.x+e.w/2);
      if (Math.abs(dx)<260 && Math.abs((player.y)-(e.y))<120){ e.vx=Math.sign(dx)*2.7; }
      else { if (e.x<e.homeL) e.vx=Math.abs(e.vx)||1.4; if (e.x>e.homeR) e.vx=-(Math.abs(e.vx)||1.4); }
    } else if (e.boss){
      const dx=(player.x)-(e.x);
      e.vx=clamp(dx*0.007, -1.7, 1.3);
      // 🔫 narco boss shoots back — single aimed bullets
      if (e.shootCd>0) e.shootCd--;
      const onScreen = e.x>cam.x-40 && e.x<camRightX();
      if (e.shootCd<=0 && onScreen && !dead && !hanging){
        const sx0=e.x+e.w/2, sy0=e.y+e.h*0.42;
        const tx=player.x+player.w/2-sx0, ty=player.y+player.h*0.5-sy0;
        const d=Math.max(1,Math.hypot(tx,ty)), sp=5.2;
        bossShots.push({x:sx0,y:sy0,vx:tx/d*sp,vy:ty/d*sp,life:150});
        sfx.shoot(); e.shootCd=irnd(70,110); e.muzzle=6;
      }
      if (e.muzzle>0) e.muzzle--;
    } else {
      if (e.x<e.homeL){ e.x=e.homeL; e.vx=Math.abs(e.vx); }
      if (e.x>e.homeR){ e.x=e.homeR; e.vx=-Math.abs(e.vx); }
    }
    e.x+=e.vx;
    if (e.aggro){ if(e.x<e.homeL-160)e.x=e.homeL-160; if(e.x>e.homeR+160)e.x=e.homeR+160; }

    if (hitTimer<=0 && aabb(player,e)){
      const stomping = player.vy>1.4 && (player.y+player.h)-e.y<30;
      if (invincible){ damageEnemy(e, e.boss?3:99, "star"); }
      else if (stomping){ damageEnemy(e,1,"stomp"); player.vy=-STOMP_BOUNCE; player.buffer=0; player.stretch=1.2; }
      else { hurt(); }
    }
  }
}
function damageEnemy(e,dmg,src){
  e.hp-=dmg;
  if (e.hp>0){ sfx.stomp(); e.squish=0; flash=Math.max(flash,3); puff(e.x+e.w/2,e.y+6,5,"#fff"); return; }
  e.dead=true; e.squish= src==="stomp"?26:0;
  if (e.boss){
    bossAlive=false; const gain=lives<MAX_LIVES?1:0; lives=Math.min(MAX_LIVES,lives+1); score+=10; sfx.life(); flash=14; slowmo=24; screenShakeAdd(14);
    addBanner("NARCO BOSS DOWN!", (gain?"+1 LIFE  ·  ":"MAX LIVES  ·  ")+"+10 kush", "#ffd54a", 170);
    for(let i=0;i<26;i++) particles.push({x:e.x+e.w/2,y:e.y+e.h/2,vx:rnd(-5,5),vy:rnd(-7,1),life:irnd(30,55),max:55,r:rnd(3,7),col:`hsl(${irnd(0,360)} 90% 60%)`,kind:"spark"});
    for(let i=0;i<5;i++) weeds.push(mkWeed(e.x+rnd(-10,e.w),GROUND_TOP-34));
  } else {
    score+= (src==="stomp"?1:2);
    sfx.stomp(); flash=Math.max(flash,5);
    puff(e.x+e.w/2,e.y+e.h/2,10,"#cfe0ff",true);
    for(let i=0;i<2;i++) particles.push({x:e.x+e.w/2,y:e.y,vx:rnd(-2,2),vy:rnd(-4,-1),life:22,max:22,r:5,col:"#7CFC6A",kind:"smoke"});
  }
}

function updatePickups(){
  for (const arr of [weeds,floatPickups]) for (const o of arr){
    if (o.taken) continue; o.bob+=0.08;
    if (aabb(player,o)){ o.taken=true; score+=1; sfx.collect(); puff(o.x+o.w/2,o.y,5,"#7CFC6A"); }
  }
  for (const b of bongs){ if(b.taken)continue; b.bob+=0.07;
    if (aabb(player,b)){ b.taken=true; speedTimer=60*7; sfx.bong(); flash=8; addBanner("BONG!","SPEED BOOST","#7CFC6A",80); puff(b.x+b.w/2,b.y,14,"#8af",true); } }
  for (const s of stars){ if(s.taken)continue; s.bob+=0.09; s.t+=0.12;
    if (aabb(player,s)){ s.taken=true; starTimer=60*8; sfx.star(); flash=10; screenShakeAdd(8); addBanner("CALI STAR!","INVINCIBLE","#ff7bd0",90); } }
  for (const c of cannons){ if(c.taken)continue; c.bob+=0.07;
    if (aabb(player,c)){ c.taken=true; ammo=Math.min(AMMO_CAP, ammo+14); sfx.bong(); flash=8; addBanner("BLOW CANNON!","Press F / 🚬 to fire joints (max "+AMMO_CAP+")","#ffd54a",110); } }
  for (const wg of wings){ if(wg.taken)continue; wg.bob+=0.06;
    if (aabb(player,wg)){ wg.taken=true; flyTimer=60*7; sfx.star(); flash=10; screenShakeAdd(6); addBanner("KUSH WINGS! 🪽","FLY — hold JUMP to soar","#bfe6ff",120); puff(wg.x+wg.w/2,wg.y,18,"#cfeaff",true); } }
  // secret collectible: bumps the hidden rank counter, no HUD/banner reveal
  for (const hd of hiddens){ if(hd.taken)continue; hd.bob+=0.08; hd.t+=0.1;
    if (aabb(player,hd)){ hd.taken=true; hidden++; sfx.collect();
      for(let i=0;i<10;i++) particles.push({x:hd.x+hd.w/2,y:hd.y+hd.h/2,vx:rnd(-2,2),vy:rnd(-2.4,.4),life:irnd(18,30),max:30,r:rnd(2,4),col:`hsl(${irnd(270,320)} 90% 70%)`,kind:"spark"}); } }
}

function updateChase(){
  // police line creeps forward; speed ramps with level
  chaseSpeed = 3.0 + level*0.18;
  chaseSpeed = Math.min(chaseSpeed, MOVE_SPD-0.45);   // always escapable by running
  chaseX += chaseSpeed;
  if (chaseX < player.x-980) chaseX=player.x-980;      // never lag too far behind

  const gap=player.x-chaseX;
  Music.tense = gap<260;
  if (gap<250 && frameCount%26===0) sfx.siren(Math.floor(frameCount/26)%2===0);

  if (gap < 26 && !hanging && !dead){
    if (!bribeUsed && score>=100){
      score-=100; bribeUsed=true; chaseX=player.x-560; flash=12; slowmo=18;
      sfx.bribe(); addBanner("BRIBED THE COPS! 💵","-100 weed  ·  one-time only","#36d36b",150);
      for(let i=0;i<18;i++) particles.push({x:player.x,y:player.y,vx:rnd(-4,4),vy:rnd(-6,0),life:40,max:40,r:5,col:"#36d36b",kind:"spark"});
    } else {
      startHang();
    }
  }
}

function startHang(){
  hanging=true; hangTimer=0; hangX=player.x+30; slowmo=30; sfx.hang(); screenShakeAdd(12);
  player.vx=0; player.vy=0;
  addBanner("BUSTED!","No bribe... to the weed tree 🌿","#ff5a5a",180);
}
const HANG_BODY_X = ()=> hangX+54, HANG_BODY_Y = GROUND_TOP-150;   // hanging body anchor (matches drawHanging)
const HANG_LEN = 560;                                              // way longer cinematic (~9.3s)
const HANG_FIRE_FROM=140, HANG_FIRE_TO=500, HANG_FIRE_EVERY=16;    // two cops' gunfire window
function updateHang(){
  hangTimer++;
  if (hangTimer===1) sfx.hang();
  const t=hangTimer;
  // 👮👮 two cops open fire on the hanging body
  if (t>=HANG_FIRE_FROM && t<=HANG_FIRE_TO && (t-HANG_FIRE_FROM)%HANG_FIRE_EVERY===0){
    sfx.shoot();
    const bx=HANG_BODY_X(), by=HANG_BODY_Y;
    for(let i=0;i<6;i++) particles.push({x:bx+rnd(-12,12),y:by+rnd(-8,26),vx:rnd(-2.4,2.4),vy:rnd(-2.4,1.4),life:irnd(16,30),max:30,r:rnd(2,4),col: Math.random()<0.6?"#c01020":"#7a0a16",kind:"spark"});
    screenShakeAdd(3);
  }
  if (t>HANG_LEN){
    lives--;
    if (lives>0){
      hanging=false; hitTimer=80; speedTimer=0; starTimer=0;
      player.x=Math.max(80,player.x-30); player.y=GROUND_TOP-player.h-4; player.vx=0; player.vy=0;
      let tt=0; while(inPit(player.x+player.w/2)&&tt<40){player.x+=30;tt++;}
      chaseX=player.x-620; // bribe stays used
      addBanner("CUT DOWN!","Run, "+(lives)+" "+(lives===1?"life":"lives")+" left","#ffd54a",120);
    } else {
      overReason="hanged"; gameOver();
    }
  }
}

function updateDead(){
  deadTimer++;
  player.vy=Math.min(player.vy+GRAVITY,MAX_FALL); player.y+=player.vy;
  if (deadTimer>70){
    if (lives>0) respawn(); else gameOver();
  }
  updateParticles();
}
function respawn(){
  dead=false; deadTimer=0; hitTimer=80; speedTimer=0; starTimer=0;
  player.vx=0; player.vy=0; player.x=Math.max(80,player.x-40); player.y=GROUND_TOP-player.h-4;
  let t=0; while(inPit(player.x+player.w/2)&&t<40){player.x+=30;t++;}
  chaseX=player.x-540;
}

function hurt(){
  if (starTimer>0) return;
  if (speedTimer>0) speedTimer=0;
  lives--; hitTimer=95; sfx.hurt(); flash=10; screenShakeAdd(10);
  player.vy=-8; player.vx=-player.facing*5;
  if (lives<=0) die("busted");
}
function die(reason){
  if (dead||hanging) return;
  overReason=reason; dead=true; deadTimer=0;
  player.vy = (reason==="fell"||reason==="lava")?Math.max(player.vy,2):-12;
  sfx.die();
  if (reason==="fell"||reason==="lava"){ lives=Math.max(0,lives-1); sfx.hurt(); }
}
function lavaSplash(x){ for(let i=0;i<16;i++) particles.push({x,y:GROUND_TOP+6,vx:rnd(-4,4),vy:rnd(-8,-2),life:irnd(20,40),max:40,r:rnd(3,7),col:`hsl(${irnd(10,40)} 100% 55%)`,kind:"spark"}); }

// 🦅 Kush Eagle companion — flapping bald eagle smoking a joint, drawn in WORLD space
function drawEagle(x,y,flap){
  const dir = (player.facing>0?1:-1);          // face the way we travel
  ctx.save(); ctx.translate(x,y); ctx.scale(dir,1);   // mirror for left-facing
  ctx.fillStyle="rgba(0,0,0,.14)"; ctx.beginPath(); ctx.ellipse(0,26,16,4,0,0,6.28); ctx.fill();
  // wings (behind body) — flapping
  ctx.fillStyle="#6b4a2a"; ctx.strokeStyle="#3f2c18"; ctx.lineWidth=1;
  for(const s of [-1,1]){ ctx.save(); ctx.translate(0,-2); ctx.rotate(s*flap*0.5);
    ctx.beginPath(); ctx.moveTo(0,0);
    ctx.quadraticCurveTo(s*-22,-16,s*-34,-2); ctx.quadraticCurveTo(s*-24,2,s*-30,10);
    ctx.quadraticCurveTo(s*-16,4,s*-10,12); ctx.quadraticCurveTo(s*-6,4,0,6);
    ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore(); }
  // tail
  ctx.fillStyle="#fff"; ctx.beginPath(); ctx.moveTo(-6,6); ctx.lineTo(-20,12); ctx.lineTo(-18,16); ctx.lineTo(-4,12); ctx.closePath(); ctx.fill();
  // body
  ctx.fillStyle="#7a5430"; ctx.beginPath(); ctx.ellipse(0,2,12,9,0,0,6.28); ctx.fill();
  ctx.fillStyle="#5e4022"; ctx.beginPath(); ctx.ellipse(-2,5,9,5,0,0,6.28); ctx.fill();
  // white head + eye
  ctx.fillStyle="#f4f4ee"; ctx.beginPath(); ctx.arc(9,-5,8,0,6.28); ctx.fill();
  ctx.fillStyle="#111"; ctx.beginPath(); ctx.arc(12,-6,1.8,0,6.28); ctx.fill();
  // hooked yellow beak
  ctx.fillStyle="#ffb31a"; ctx.beginPath(); ctx.moveTo(15,-6); ctx.lineTo(24,-3); ctx.quadraticCurveTo(26,-1,23,1); ctx.lineTo(15,-1); ctx.closePath(); ctx.fill();
  // the JOINT near the beak (white stick + glowing ember) — matches the smoke from updatePet
  ctx.save(); ctx.translate(24,-1); ctx.rotate(0.15);
  ctx.fillStyle="#f7f3e8"; ctx.fillRect(0,-1.4,9,2.8);
  ctx.fillStyle=(frameCount%20<10)?"#ff7a2a":"#ffae33"; ctx.beginPath(); ctx.arc(9.5,0,1.8,0,6.28); ctx.fill();
  ctx.fillStyle="rgba(255,140,40,.35)"; ctx.beginPath(); ctx.arc(9.5,0,3.2,0,6.28); ctx.fill();
  ctx.restore();
  ctx.restore();
}
function updatePet(){
  // eagle trails the player (eased follow to above-and-behind) + bob, smokes a joint (puff on cooldown)
  const dir = (player.facing>0?1:-1);
  const tx = player.x + player.w/2 - dir*64;                 // behind = opposite of facing
  const ty = player.y - 64 + Math.sin(frameCount*0.05)*6;    // gentle hover bob baked into target
  petX += (tx-petX)*0.10;                                    // smooth, laggy follow
  petY += (ty-petY)*0.10;
  petFlap = Math.sin(frameCount*0.30);                       // wing-flap phase for drawEagle
  if (--petPuffCd <= 0){
    petPuffCd = irnd(12,18);
    const bx = petX + dir*16, by = petY - 4;                 // joint tip near the beak (faces travel dir)
    for(let i=0;i<2;i++) particles.push({
      x:bx+rnd(-1,1), y:by+rnd(-1,1),
      vx:rnd(-.3,.3)+dir*0.2, vy:rnd(-.9,-.3),
      life:irnd(22,34), max:34, r:rnd(2,4),
      col:"rgba(225,235,225,.7)", kind:"smoke"
    });
  }
}

function bankAndSubmit(){
  DB.bank = DB.bank + score;             // bank this run's kush for the shop
  if (score>DB.best) DB.best=score;
  if (distance>DB.bestDist) DB.bestDist=distance;
  lastPassUnlocks = addPassProgress(score);   // 🎖 battle-pass XP for this run + auto-grant any newly-unlocked tier rewards (kush/skins added to DB before the save below)
  const nm = Profile.key(DB.name) || "PLAYER";
  // serialize the 3 cloud writes (SCORE first) so a single free Pantry account isn't slammed by ~17 concurrent requests
  Board.submit({ name:nm, cc:DB.cc, score:Math.floor(score), dist:Math.floor(distance), hidden:Math.floor(hidden), ts:Date.now() })
    .then(()=>Profile.save())            // push bank/best/bestDist (+owned/skin/pet) to the cloud account
    .then(()=>Stats.bump())              // +1 to the global all-time "games played" counter
    .catch(()=>{ try{ Profile.save(); }catch(e){} try{ Stats.bump(); }catch(e){} });
}
function gameOver(){ G.scene="over"; bankAndSubmit(); }
// in-game "back to menu": bank + submit the run (nothing lost), then to the title
function quitToMenu(){
  if (G.scene==="play"||G.scene==="paused"){ bankAndSubmit(); }
  G.scene="title"; G.paused=false; Board.refresh();
}

// particles + shake
let shake=0;
function screenShakeAdd(v){ shake=Math.min(22, shake+v); }
function updateParticles(){
  for (const p of particles){
    p.x+=p.vx; p.y+=p.vy;
    if (p.kind==="smoke"){ p.vy-=0.04; p.vx*=0.97; } else { p.vy+=0.18; }
    p.life--;
  }
  particles=particles.filter(p=>p.life>0);
  const cap=lowFX?180:460;                       // auto-quality: smaller particle budget on slow devices
  if (particles.length>cap) particles.splice(0, particles.length-cap);
}
function puff(x,y,n,col,big=false){
  for(let i=0;i<n;i++) particles.push({x,y,vx:rnd(-2.4,2.4),vy:rnd(-3.2,.4),life:irnd(16,26),max:24,r:big?rnd(4,9):rnd(2,5),col,kind:Math.random()<.5?"smoke":"spark"});
}

  else if (_skyKey===th.id){ g=_skyG; }
  else { g=ctx.createLinearGradient(0,0,0,VH); g.addColorStop(0,th.sky[0]); g.addColorStop(.55,th.sky[1]); g.addColorStop(1,th.sky[2]); _skyG=g; _skyKey=th.id; }
  ctx.fillStyle=g; ctx.fillRect(0,0,VW,VH);

  // sun / moon
  if (th.night){
    ctx.fillStyle="rgba(255,250,230,.92)"; ctx.beginPath(); ctx.arc(VW*0.8,VH*0.22-cam.y*0.05,38,0,6.28); ctx.fill();
    // stars
    ctx.fillStyle="rgba(255,255,255,.8)";
    for(let i=0;i<40;i++){ const x=((i*137.5 - cam.x*0.05)%VW+VW)%VW; const y=(i*53)%Math.floor(VH*0.5); if((i*frameCount)%97<60) ctx.fillRect(x,y-cam.y*0.05,2,2); }
  } else {
    ctx.fillStyle="rgba(255,247,214,.9)"; ctx.beginPath(); ctx.arc(VW*0.78,VH*0.24-cam.y*0.05,46,0,6.28); ctx.fill();

// Kuala Lumpur skyline (Petronas + KL Tower) — tiled parallax.
// The whole 1100px panel is STATIC art (only the KL-Tower beacon blinks), but it used to be
// re-drawn vector-by-vector — ~3,700 fillRects/frame on city/night levels, the single biggest
// frame cost on phones. Now it's rendered once into an offscreen panel and blitted.
const KL_BASE=450;                                   // skyline baseline y inside the cached panel
const _klPanelCache={};
function klPanelSprite(night){
  const key=night?"n":"d";
  if (!_klPanelCache[key])
    _klPanelCache[key]=makeSprite(1100, KL_BASE+10, c=> klPanel(0, KL_BASE, night, c));
  return _klPanelCache[key];
}
function drawCityBg(night){
  const par=0.26, panelW=1100, baseY=GROUND_TOP+6-cam.y*0.10;
  const off=((cam.x*par)%panelW+panelW)%panelW;
  const spr=klPanelSprite(night), by=Math.round(baseY-KL_BASE);
  for(let p=-1;p<=Math.ceil(VW/panelW)+1;p++){
    const ox=Math.round(p*panelW-off);
    ctx.drawImage(spr, ox, by);
    ctx.fillStyle=(frameCount%40<20)?"#ff6b6b":"#7a2020"; ctx.fillRect(ox+271,by+KL_BASE-346,4,4);   // KL-Tower beacon stays live
  }
  if (night){ // neon glow strip
    ctx.fillStyle="rgba(66,232,255,.06)"; ctx.fillRect(0,baseY-60,VW,80);
  }
}
function klPanel(ox, baseY, night, c){
  c=c||ctx;
  const col = night?"#2a2350":"#6f86c6", colD=night?"#1d1840":"#5f74b0";
  const win = night?"rgba(120,230,255,.55)":"rgba(255,243,200,.5)";
  const blds=[[20,150,90],[120,210,70],[200,120,110],[330,260,80],[430,170,95],[540,300,70],[620,140,120],[760,230,85],[860,180,75],[950,120,120],[1030,200,60]];
  c.fillStyle=colD;
  for(const [x,h,w] of blds){
    c.fillRect(ox+x,baseY-h,w,h);
    c.fillStyle=win;
    for(let yy=baseY-h+10;yy<baseY-8;yy+=16) for(let xx=ox+x+6;xx<ox+x+w-6;xx+=14){ if(!night||((xx+yy)|0)%3) c.fillRect(xx,yy,6,8); }
    c.fillStyle=colD;
  }
  klTower(ox+265,baseY,col,night,c);
  petronas(ox+650,baseY,night?"#3a3170":"#8fa3d8",night,c);
  petronas(ox+740,baseY,night?"#3a3170":"#8fa3d8",night,c);
  c.fillStyle=night?"#5a4ea0":"#aebbe6"; c.fillRect(ox+650+27,baseY-300,(740-650)+18,7);
}
function petronas(x,baseY,color,night,c){
  c=c||ctx;
  const h=360,w=46,segs=5; c.fillStyle=color;
  for(let i=0;i<segs;i++){ const sw=w-i*5,sh=h/segs,sx=x+(w-sw)/2; c.fillRect(sx,baseY-h+i*sh,sw,sh+1);
    c.fillStyle="rgba(255,255,255,.22)"; c.fillRect(sx,baseY-h+i*sh,sw,3); c.fillStyle=color; }
  const tx=x+w/2; c.beginPath(); c.moveTo(tx-6,baseY-h); c.lineTo(tx,baseY-h-34); c.lineTo(tx+6,baseY-h); c.closePath(); c.fill();
  c.fillRect(tx-1,baseY-h-58,2,26);
  c.fillStyle=night?"rgba(120,230,255,.5)":"rgba(255,243,200,.5)";
  for(let yy=baseY-h+20;yy<baseY-10;yy+=18) for(let xx=x+8;xx<x+w-8;xx+=10) c.fillRect(xx,yy,4,8);
}
function klTower(x,baseY,color,night,c){
  c=c||ctx;
  const h=300; c.fillStyle=color; c.fillRect(x,baseY-h,16,h);
  c.beginPath(); c.ellipse(x+8,baseY-h+8,26,18,0,0,6.28); c.fill();
  c.fillStyle=night?"#5a4ea0":"#cdd8f4"; c.beginPath(); c.ellipse(x+8,baseY-h+8,26,8,0,0,6.28); c.fill();
  c.fillStyle=color; c.fillRect(x+7,baseY-h-44,2,44);
  // (blinking beacon is drawn live by drawCityBg — everything here must stay static for the cache)
}
function drawDesertBg(){
  const baseY=GROUND_TOP+6-cam.y*0.1;
  // pyramids
  ctx.fillStyle="#caa24a";
  for(let p=-1;p<=4;p++){ const ox=((p*520 - cam.x*0.2)%(VW+600)); pyramid(ox+120, baseY, 150); pyramid(ox+330, baseY, 90); }
  // dunes
  ctx.fillStyle="#e0b65a";
  ctx.beginPath(); ctx.moveTo(0,baseY);
  for(let x=0;x<=VW;x+=40) ctx.lineTo(x, baseY-30-Math.sin((x+cam.x*0.3)*0.01)*22);
  ctx.lineTo(VW,baseY+200); ctx.lineTo(0,baseY+200); ctx.fill();
}
function pyramid(x,baseY,s){ ctx.beginPath(); ctx.moveTo(x,baseY); ctx.lineTo(x+s/2,baseY-s*0.8); ctx.lineTo(x+s,baseY); ctx.closePath(); ctx.fill();
  ctx.fillStyle="rgba(0,0,0,.08)"; ctx.beginPath(); ctx.moveTo(x+s/2,baseY-s*0.8); ctx.lineTo(x+s,baseY); ctx.lineTo(x+s/2,baseY); ctx.closePath(); ctx.fill(); ctx.fillStyle="#caa24a"; }
function drawLavaBg(){
  const baseY=GROUND_TOP+6-cam.y*0.1;
  ctx.fillStyle="#2a1116";

  // glowing horizon
  const g=ctx.createLinearGradient(0,baseY-40,0,baseY+40); g.addColorStop(0,"rgba(255,90,20,0)"); g.addColorStop(1,"rgba(255,120,30,.5)");
  ctx.fillStyle=g; ctx.fillRect(0,baseY-40,VW,80);
}
function volcano(x,baseY,s){ ctx.beginPath(); ctx.moveTo(x,baseY); ctx.lineTo(x+s*0.35,baseY-s*0.7); ctx.lineTo(x+s*0.5,baseY-s*0.62); ctx.lineTo(x+s*0.65,baseY-s*0.7); ctx.lineTo(x+s,baseY); ctx.closePath(); ctx.fill();
  ctx.fillStyle=(frameCount%30<15)?"#ff7a2a":"#ff5a1a"; ctx.fillRect(x+s*0.42,baseY-s*0.7,s*0.16,8); ctx.fillStyle="#2a1116"; }

let cloudSeed=[]; for(let i=0;i<12;i++) cloudSeed.push({x:rnd(0,4000),y:rnd(20,200),s:rnd(.6,1.4),spd:rnd(.1,.35)});
function drawClouds(th){

  for(const c of cloudSeed){ const x=((c.x-cam.x*0.15-frameCount*c.spd)%(VW+400)); const px=x<-200?x+VW+400:x; cloud(px, c.y-cam.y*0.08, c.s); }
}
function cloud(x,y,s){ ctx.beginPath(); ctx.arc(x,y,18*s,0,6.28); ctx.arc(x+20*s,y+4*s,22*s,0,6.28); ctx.arc(x+44*s,y,16*s,0,6.28); ctx.arc(x+22*s,y-8*s,16*s,0,6.28); ctx.fill(); }

// ----- ground / hazards (world space) -----
function drawGroundAndHazards(th){
  // every PIT renders as a clearly visible dark chasm with warning edges
  for(const p of pits){
    if (p.x+p.w<cam.x-60 || p.x>camRightX()) continue;
    const ly=GROUND_TOP+2;
    const g=ctx.createLinearGradient(0,ly,0,ly+220);
    g.addColorStop(0,"rgba(6,8,14,.92)"); g.addColorStop(1,"rgba(2,3,6,1)");
    ctx.fillStyle=g; ctx.fillRect(p.x-2, ly, p.w+4, 260);
    // crumbly cliff faces on each side
    ctx.fillStyle=th.soil;
    ctx.beginPath(); ctx.moveTo(p.x-2,ly); ctx.lineTo(p.x-2,ly+26); ctx.lineTo(p.x+11,ly+12); ctx.lineTo(p.x+7,ly); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(p.x+p.w+2,ly); ctx.lineTo(p.x+p.w+2,ly+26); ctx.lineTo(p.x+p.w-11,ly+12); ctx.lineTo(p.x+p.w-7,ly); ctx.closePath(); ctx.fill();
    // bright hazard markers at the lips
    ctx.fillStyle=th.accent; ctx.fillRect(p.x-4,ly-5,7,5); ctx.fillRect(p.x+p.w-3,ly-5,7,5);
    ctx.fillStyle="rgba(0,0,0,.45)"; ctx.fillRect(p.x-2,ly,3,30); ctx.fillRect(p.x+p.w-1,ly,3,30);
  }
  // glowing lava on top of the chasm (lava theme)
  if (th.lava){
    for(const p of pits){
      if (p.x+p.w<cam.x-60 || p.x>camRightX()) continue;
      const ly=GROUND_TOP+8;
      const g=ctx.createLinearGradient(0,ly,0,ly+120); g.addColorStop(0,"#ffd24a"); g.addColorStop(.4,"#ff6a1a"); g.addColorStop(1,"#8a1a08");
      ctx.fillStyle=g;
      ctx.beginPath(); ctx.moveTo(p.x,ly);
      for(let x=p.x;x<=p.x+p.w;x+=12) ctx.lineTo(x, ly+Math.sin((x+frameCount*3)*0.05)*4);
      ctx.lineTo(p.x+p.w,ly+200); ctx.lineTo(p.x,ly+200); ctx.fill();
      if (frameCount%6===0) particles.push({x:p.x+rnd(0,p.w),y:ly,vx:rnd(-1,1),vy:rnd(-3,-1),life:irnd(20,40),max:40,r:rnd(2,4),col:`hsl(${irnd(15,40)} 100% 55%)`,kind:"smoke"});
    }
  }
}

function drawPlatforms(th){
  for(const p of platforms){
    if (p.x+p.w<cam.x-60 || p.x>camRightX()) continue;
    if (p.ground) drawGround(p,th);
    else if (p.castleGate) drawCastleGate(p);
    else if (p.tower) drawTowerColumn(p,th);
    else if (p.skybridge) drawSkybridge(p);
    else if (p.tramp) drawTramp(p);
    else if (p.cloud) drawCloudPlat(p);
    else if (p.block||p.step) drawBlock(p);
    else drawBrick(p);
  }
}
function drawGround(p,th){
  ctx.fillStyle=th.grass; ctx.fillRect(p.x,p.y,p.w,16);
  ctx.fillStyle=th.grassDk; ctx.fillRect(p.x,p.y+12,p.w,6);
  ctx.fillStyle=th.soil; ctx.fillRect(p.x,p.y+16,p.w,p.h-16);
  ctx.strokeStyle=th.soilLine; ctx.lineWidth=2;
  for(let yy=p.y+18;yy<p.y+Math.min(p.h,160);yy+=20){ ctx.beginPath(); ctx.moveTo(p.x,yy); ctx.lineTo(p.x+p.w,yy); ctx.stroke(); }
  if (th.id==="city"||th.id==="night"){ ctx.fillStyle=th.grassDk; for(let xx=p.x+6;xx<p.x+p.w;xx+=22){ ctx.fillRect(xx,p.y-4,3,6); ctx.fillRect(xx+5,p.y-6,3,8);} }
  if (th.id==="desert"){ ctx.fillStyle="#cf9a3a"; for(let xx=p.x+10;xx<p.x+p.w;xx+=60){ ctx.fillRect(xx,p.y-8,4,10); ctx.fillRect(xx-4,p.y-3,12,3);} }
}
function drawBrick(p){
  ctx.fillStyle="#c8782e"; ctx.fillRect(p.x,p.y,p.w,p.h);
  ctx.fillStyle="#a85e1d"; ctx.fillRect(p.x,p.y+p.h-5,p.w,5);
  ctx.fillStyle="#e89a52"; ctx.fillRect(p.x,p.y,p.w,4);
  ctx.strokeStyle="rgba(60,30,0,.5)"; ctx.lineWidth=1.5;
  for(let xx=p.x+12;xx<p.x+p.w;xx+=24){ ctx.beginPath(); ctx.moveTo(xx,p.y); ctx.lineTo(xx,p.y+p.h); ctx.stroke(); }
  ctx.beginPath(); ctx.moveTo(p.x,p.y+p.h/2); ctx.lineTo(p.x+p.w,p.y+p.h/2); ctx.stroke();
}
// Tower body (gradient + mullions + window grid) is cached per platform and only re-rendered
// when the slow window-flicker epoch ticks (~every 100 frames) — it was ~330 fillRects/frame.
function towerSprite(p, night){
  const epoch=Math.floor(frameCount*0.01);
  if (p._twr && p._twrE===epoch && p._twrN===night) return p._twr;
  p._twrE=epoch; p._twrN=night;
  const w=p.w, h=p.h, fc=frameCount;
  p._twr=makeSprite(w+6, h+42, c=>{
    c.translate(3,36);
    const g=c.createLinearGradient(0,0,w,0); g.addColorStop(0,"#6f8596"); g.addColorStop(.5,"#d2e3ee"); g.addColorStop(1,"#6f8596");
    c.fillStyle=g; c.fillRect(0,0,w,h);
    c.fillStyle="rgba(40,60,80,.30)"; for(let xx=4;xx<w;xx+=6) c.fillRect(xx,0,1.4,h);
    c.fillStyle="#a9c0cf"; for(let yy=24;yy<h;yy+=30){ c.fillRect(-3,yy,w+6,5); }
    for(let yy=8;yy<h-6;yy+=12) for(let xx=5;xx<w-4;xx+=8){
      const lit=(Math.floor(((xx+p.x)*3+(yy+p.y)*5)/11 + fc*0.01)%(night?3:6)===0);   // world-coord pattern, matches the old look
      c.fillStyle= lit?"#ffe9a6":"rgba(150,190,215,.55)"; c.fillRect(xx,yy,4,7); }
    c.fillStyle="#c9dce8"; c.fillRect(w/2-2,-30,4,30);
    c.beginPath(); c.arc(w/2,-32,3.2,0,6.28); c.fill();
  });
  return p._twr;
}
function drawTowerColumn(p,th){
  const x=p.x,y=p.y,w=p.w,h=p.h, gy=GROUND_TOP, night=!!(th&&th.night);
  ctx.drawImage(towerSprite(p,night), x-3, y-36);
  // podium legs + archway down to the ground (passable) — depends on GROUND_TOP, stays live
  ctx.fillStyle="#7f97a6"; ctx.fillRect(x, y+h, 8, gy-(y+h)); ctx.fillRect(x+w-8, y+h, 8, gy-(y+h));
  ctx.fillStyle="#90a8b6"; ctx.fillRect(x-3, y+h, w+6, 6);
  ctx.fillStyle="rgba(10,16,22,.6)"; ctx.fillRect(x+8, y+h+6, w-16, gy-(y+h)-6);
  ctx.fillStyle="#b9d2e2"; ctx.fillRect(x+w/2-1, y+h+8, 2, gy-(y+h)-8);  // door divider
}
function drawSkybridge(p){
  ctx.fillStyle="#c2d8e6"; ctx.fillRect(p.x,p.y,p.w,p.h);
  ctx.fillStyle="#8fb0c6"; ctx.fillRect(p.x,p.y+p.h-3,p.w,3); ctx.fillStyle="#eaf4fb"; ctx.fillRect(p.x,p.y,p.w,2);
  ctx.strokeStyle="#8fb0c6"; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(p.x+p.w*0.42,p.y+p.h); ctx.lineTo(p.x+p.w*0.5,p.y+20); ctx.moveTo(p.x+p.w*0.58,p.y+p.h); ctx.lineTo(p.x+p.w*0.5,p.y+20); ctx.stroke();
}
function drawBlock(p){
  ctx.fillStyle="#d99a3a"; ctx.fillRect(p.x,p.y,p.w,p.h);
  ctx.fillStyle="#b87a1d"; ctx.fillRect(p.x,p.y+p.h-4,p.w,4); ctx.fillRect(p.x,p.y,4,p.h);
  ctx.fillStyle="#f0c060"; ctx.fillRect(p.x+2,p.y+2,p.w-4,3);
  ctx.fillStyle="#7a4a10"; for(const [dx,dy] of [[6,6],[p.w-12,6],[6,p.h-12],[p.w-12,p.h-12]]) ctx.fillRect(p.x+dx,p.y+dy,4,4);
}
function drawCloudPlat(p){
  ctx.fillStyle="rgba(255,255,255,.95)";
  for(let xx=p.x;xx<p.x+p.w;xx+=18){ ctx.beginPath(); ctx.arc(xx+9,p.y+10,13,0,6.28); ctx.fill(); }
