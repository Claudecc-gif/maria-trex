// ---------------- world generation ----------------
function generateSegment(){
  const sx=genX;
  const diff = clamp(distance/2400,0,1);
  level = Math.floor(distance/LEVEL_LEN);
  const th = curTheme();

  // ground / pit  (never a pit on a level-boundary segment — keep the castle run-through safe)
  const lvX=LEVEL_LEN*10, nb=Math.ceil((sx+1)/lvX)*lvX, hasBoundary=(nb<sx+SEG_W && nb>0);
  const pitChance = 0.10 + diff*0.20;
  if (Math.random()<pitChance && sx>1100 && !hasBoundary){
    const gap = irnd(95, 95+Math.floor(120*diff));
    const px = sx+irnd(60,150);
    pits.push({x:px,w:gap,lava:th.lava});
    platforms.push({x:sx,y:GROUND_TOP,w:px-sx,h:VH-GROUND_TOP+260,ground:true});
    platforms.push({x:px+gap,y:GROUND_TOP,w:(sx+SEG_W)-(px+gap),h:VH-GROUND_TOP+260,ground:true});
    if (Math.random()<0.6){
      const fw=irnd(80,120), fy=GROUND_TOP-irnd(120,170);
      const fp={x:px+gap/2-fw/2,y:fy,w:fw,h:22,brick:true};
      platforms.push(fp); weeds.push(mkWeed(fp.x+fw/2-12, fp.y-34));
    }
  } else {
    platforms.push({x:sx,y:GROUND_TOP,w:SEG_W,h:VH-GROUND_TOP+260,ground:true});
  }
  // 🏰 KUSH CASTLE gate straddling the level boundary — run THROUGH it into the next world
  if (hasBoundary){
    platforms.push({x:nb-170, y:GROUND_TOP, w:340, h:1, castleGate:true});
    for (let k=0;k<3;k++) weeds.push(mkWeed(nb-30+k*30, GROUND_TOP-34));   // little reward at the gate
  }

  // 🏙️ KL PETRONAS TWIN TOWERS — a special landmark obstacle, once per level.
  // Solid columns up high (block traversal), but an open archway at the base so you
  // run through; climb the inner stairs to the skybridge for a reward.
  {
    const segLevel = Math.floor((sx/10)/LEVEL_LEN);
    const intoLevel = (sx/10) % LEVEL_LEN;
    if (towerLevel < segLevel && sx>1000 && intoLevel>180 && Math.random()<0.55){
      const colW=46, gap=irnd(150,190), archH=104;
      const baseX = sx + irnd(20, Math.max(30, SEG_W-2*colW-gap-20));
      const x1=baseX, x2=baseX+colW+gap, midX=x1+colW+gap/2;
      const topY = GROUND_TOP - irnd(340,470);
      const bodyH = (GROUND_TOP-archH) - topY;
      if (bodyH>120 && !inPit(x1) && !inPit(x2) && !inPit(midX)){
        // decorative columns (NO collision) so they never wall you — run/jump straight through
        platforms.push({x:x1,y:topY,w:colW,h:bodyH,tower:true});
        platforms.push({x:x2,y:topY,w:colW,h:bodyH,tower:true});
        const sbY = topY + bodyH*0.40;                       // skybridge deck
        platforms.push({x:x1+colW,y:sbY,w:gap,h:16,brick:true,skybridge:true});
        for (const hh of [80,160,240]) if (GROUND_TOP-hh > sbY+24) platforms.push({x:midX-26,y:GROUND_TOP-hh,w:52,h:14,brick:true});
        if (Math.random()<0.5) wings.push(mkWings(midX-20,sbY-50)); else stars.push(mkStar(midX-16,sbY-46));
        for (let k=0;k<3;k++) floatPickups.push(mkWeed(x1+colW+12+k*30,sbY-40,true));
        towerLevel = segLevel;
      }
    }
  }

  // FLOATING staircase blocks — lowest step removed so you run UNDERNEATH,
  // then jump up onto them. One-way (no side blocking), with headroom to pass.
  if (Math.random()<0.45 && sx>700){
    const bx=sx+irnd(20,140), steps=irnd(2,3);
    const baseY=GROUND_TOP-110;        // floats well above head height
    for (let i=0;i<steps;i++){
      platforms.push({x:bx+i*32, y:baseY-i*32, w:32, h:30, brick:true, step:true});
    }
    if (Math.random()<0.7) weeds.push(mkWeed(bx+(steps-1)*32+4, baseY-(steps-1)*32-34));
  }

  // DOODLE-JUMP vertical climb: zig-zag rungs going way up to a star
  if (Math.random()<0.16 && sx>1500){
    const cx=sx+irnd(90,SEG_W-130);
    const rungs=irnd(5,8);            // taller — climbs reach the high sky
    let py=GROUND_TOP-86, side=(Math.random()<.5?-1:1), topY=py;
    for (let i=0;i<rungs;i++){
      const px=clamp(cx+side*irnd(26,66), sx+8, sx+SEG_W-76);
      platforms.push({x:px, y:Math.max(SKY_TOP+30,py), w:66, h:18, brick:true, cloud:i>=2});
      if (Math.random()<0.5) floatPickups.push(mkWeed(px+22, py-34, true));
      topY=Math.max(SKY_TOP+30,py); py-=irnd(84,108); side*=-1;
    }
    // reward at the very top — usually the WINGS power-up
    const topX=clamp(cx-16,sx,sx+SEG_W-44);
    if (Math.random()<0.6) wings.push(mkWings(topX-6, topY-58)); else stars.push(mkStar(topX, topY-54));
  }

  // floating platforms with goodies + arcs
  if (Math.random()<0.85){
    const n=irnd(1,2);
    for (let c=0;c<n;c++){
      const fw=irnd(70,140), fx=sx+irnd(20,SEG_W-fw-20), fy=GROUND_TOP-irnd(110,300);
      platforms.push({x:fx,y:fy,w:fw,h:22,brick:true, cloud:(fy<GROUND_TOP-230)});
      if (Math.random()<0.55){
        for (let k=0;k<4;k++) floatPickups.push(mkWeed(fx-80+k*26, fy-40-Math.sin(k/3*Math.PI)*34, true));
      } else weeds.push(mkWeed(fx+fw/2-12, fy-34));
    }
  }

  // trampolines (reach the sky)
  if (Math.random()<0.22 && sx>900){
    const tx=sx+irnd(40,SEG_W-90);
    if (!inPit(tx)){
      platforms.push({x:tx,y:GROUND_TOP-14,w:56,h:14,tramp:true,squish:0});
      // reward WAY high above a trampoline (trampolines now fling you far up)
      const hy=GROUND_TOP-irnd(430,640), hw=86;
      const hx=clamp(tx-15,sx,sx+SEG_W-hw);
      platforms.push({x:Math.max(sx,hx),y:Math.max(SKY_TOP+24,hy),w:hw,h:22,brick:true,cloud:true});
      const rr=Math.random(), ry=Math.max(SKY_TOP+24,hy);
      if (rr<0.34) wings.push(mkWings(hx+hw/2-20, ry-52));
      else if (rr<0.67) stars.push(mkStar(hx+hw/2-16, ry-46));
      else { for(let k=0;k<3;k++) floatPickups.push(mkWeed(hx+10+k*28, ry-40, true)); }
    }
  }

  // CALI BUD star (sky)
  if (Math.random()<0.10 && sx>1500){
    const fw=90, fx=sx+irnd(40,SEG_W-fw-40), fy=GROUND_TOP-irnd(230,330);
    platforms.push({x:fx,y:fy,w:fw,h:22,brick:true,cloud:true});
    stars.push(mkStar(fx+fw/2-16, fy-46));
  }

  // 🔮 SECRET collectible — rare, floats high & easy to miss; counts toward rank, never shown
  if (Math.random()<0.07 && sx>1700){
    const hx=sx+irnd(40,SEG_W-60), hy=Math.max(SKY_TOP+30, GROUND_TOP-irnd(300,640));
    hiddens.push(mkHidden(hx, hy));
  }

  // BONG speed
  if (Math.random()<0.16 && sx>900){
    const bx=sx+irnd(60,SEG_W-60);
    if(!inPit(bx)) bongs.push({x:bx,y:GROUND_TOP-40,w:26,h:40,bob:rnd(0,6.28),taken:false});
  }

  // BLOW CANNON pickup
  if (Math.random()<0.13 && sx>1300){
    const cx=sx+irnd(60,SEG_W-60);
    if(!inPit(cx)) cannons.push({x:cx,y:GROUND_TOP-34,w:40,h:34,bob:rnd(0,6.28),taken:false});
  }

  // weed plants on ground
  for (let i=0;i<irnd(1,3);i++){
    const wx=sx+irnd(40,SEG_W-40);
    if(!inPit(wx)) weeds.push(mkWeed(wx, GROUND_TOP-34));
  }

  // enemies (varied cops + dealers)
  if (Math.random() < 0.5+diff*0.35 && sx>800){
    const n=irnd(1, 1+Math.round(diff*1.6));
    for (let i=0;i<n;i++){
      const ex=sx+irnd(60,SEG_W-60);
      if (inPit(ex)) continue;
      enemies.push(mkEnemy(pickEnemyType(diff), ex));
    }
  }

  // CARTEL BOSS (rare, gives +1 life)
  if (!bossAlive && distance>bossSpawnDist && sx>1400 && Math.random()<0.5){
    const ex=sx+irnd(80,SEG_W-100);
    if (!inPit(ex)){
      enemies.push(mkEnemy("boss", ex));
      bossAlive=true; bossSpawnDist=distance+rnd(420,640);
    }
  }

  genX+=SEG_W;
}
function pickEnemyType(diff){
  const r=Math.random();
  if (r<0.30) return "dealer";
  if (r<0.52) return "cop";
  if (r<0.70) return "cop_s";
  if (r<0.86) return "cop_big";
  return "cop_aggro";
}
function mkEnemy(type, x){
  const base={type,x,dead:false,squish:0,t:rnd(0,6.28),hp:1,aggro:false};
  if (type==="dealer")   return {...base,y:GROUND_TOP-44,w:38,h:44,vx:(Math.random()<.5?-1:1)*rnd(.8,1.4),homeL:x-rnd(40,90),homeR:x+rnd(40,90)};
  if (type==="cop")      return {...base,y:GROUND_TOP-46,w:38,h:46,vx:(Math.random()<.5?-1:1)*rnd(1.1,1.7),homeL:x-rnd(50,100),homeR:x+rnd(50,100)};
  if (type==="cop_s")    return {...base,y:GROUND_TOP-38,w:30,h:38,vx:(Math.random()<.5?-1:1)*rnd(1.8,2.6),homeL:x-rnd(60,120),homeR:x+rnd(60,120)};
  if (type==="cop_big")  return {...base,y:GROUND_TOP-62,w:54,h:62,vx:(Math.random()<.5?-1:1)*rnd(.7,1.0),hp:2,homeL:x-rnd(40,80),homeR:x+rnd(40,80)};
  if (type==="cop_aggro")return {...base,y:GROUND_TOP-46,w:40,h:46,vx:(Math.random()<.5?-1:1)*rnd(1.2,1.6),aggro:true,homeL:x-rnd(70,140),homeR:x+rnd(70,140)};
  /* boss */              return {...base,y:GROUND_TOP-82,w:74,h:82,vx:-rnd(.7,1.2),hp:6,maxHp:6,shootCd:80,homeL:x-300,homeR:x+300,boss:true};
}
function mkWeed(x,y,floaty=false){ return {x,y,w:24,h:30,taken:false,bob:rnd(0,6.28),floaty}; }
function mkStar(x,y){ return {x,y,w:32,h:32,taken:false,bob:rnd(0,6.28),t:rnd(0,6.28)}; }
function mkWings(x,y){ return {x,y,w:42,h:30,taken:false,bob:rnd(0,6.28)}; }
function mkHidden(x,y){ return {x,y,w:20,h:20,taken:false,bob:rnd(0,6.28),t:rnd(0,6.28)}; }  // secret rank-only collectible
function inPit(x){ return pits.some(p=> x>=p.x && x<=p.x+p.w); }

// ---------------- update ----------------
function update(){
  frameCount++;
  if (flash>0) flash--;
  if (levelFlash>0) levelFlash--;
  if (slowmo>0) slowmo--;

  for (let i=banners.length-1;i>=0;i--){ if(--banners[i].life<=0) banners.splice(i,1); }

  // hanging cinematic takes over
  if (hanging){ updateHang(); updateParticles(); return; }

  // generate ahead / cull behind
  while (genX < cam.x+VW+1500) generateSegment();
  const cull = cam.x-560;
  platforms = platforms.filter(p=> p.x+p.w>cull);
  weeds = weeds.filter(o=>!o.taken && o.x>cull);
  floatPickups = floatPickups.filter(o=>!o.taken && o.x>cull);
  enemies = enemies.filter(o=> o.x>cull-260 && o.squish<34);
  bongs = bongs.filter(o=>!o.taken && o.x>cull);
  stars = stars.filter(o=>!o.taken && o.x>cull);
  cannons = cannons.filter(o=>!o.taken && o.x>cull);
  wings = wings.filter(o=>!o.taken && o.x>cull);
  hiddens = hiddens.filter(o=>!o.taken && o.x>cull);
  pits = pits.filter(p=> p.x+p.w>cull);

  if (dead){ updateDead(); return; }

  // level progression — enter the KUSH CASTLE, each level crazier than the last
  const lv = Math.floor(distance/LEVEL_LEN);
  if (lv>level){
    level=lv; levelFlash=30; castleT=0; sfx.level(); Music.setTheme(level);
    hitTimer=Math.max(hitTimer,55);   // brief grace — the castle transition is never a death
    addBanner("🏰 LEVEL "+(level+1)+" — "+curTheme().name, "keep running, it gets crazier!", curTheme().accent, 95);
    for(let i=0;i<40;i++) particles.push({x:player.x+rnd(-40,300),y:player.y+rnd(-160,20),vx:rnd(-5,5),vy:rnd(-9,-1),life:irnd(28,56),max:56,r:rnd(2,6),col:`hsl(${irnd(0,360)} 90% 62%)`,kind:"spark"});
    screenShakeAdd(9);
  }

  if (speedTimer>0) speedTimer--;
  if (starTimer>0) starTimer--;
  if (flyTimer>0) flyTimer--;
  if (hitTimer>0) hitTimer--;
  if (fireCd>0) fireCd--;
  if (castleT>0) castleT--;
  const boosted=speedTimer>0, invincible=starTimer>0, flying=flyTimer>0;
  const targetSpd = boosted?BOOST_SPD:MOVE_SPD;

  // horizontal
  let ax=0;
  if (down("left")){ ax-=ACCEL; player.facing=-1; }
  if (down("right")){ ax+=ACCEL; player.facing=1; }
  player.vx+=ax;
  if (ax===0) player.vx*=FRICTION;
  player.vx=clamp(player.vx,-targetSpd,targetSpd);
  if (Math.abs(player.vx)<0.05) player.vx=0;

  // jump
  if (down("jump") && !player.jumpHeld) player.buffer=BUFFER;
  player.jumpHeld=down("jump");
  if (player.buffer>0) player.buffer--;
  if (player.coyote>0) player.coyote--;
  if (player.buffer>0 && (player.onGround||player.coyote>0)){
    player.vy=-JUMP_V*(boosted?1.05:1); player.onGround=false; player.coyote=0; player.buffer=0;
    player.stretch=1.18; sfx.jump(); puff(player.x+player.w/2, player.y+player.h, 6, "#e8f0ff");
  }
  if (flying){
    // 🪽 hold JUMP to soar; gravity is light and the fall is capped
    if (down("jump")){ player.vy -= 1.15; if (player.vy<-7.5) player.vy=-7.5;
      if (frameCount%3===0) particles.push({x:player.x+(player.facing>0?0:player.w),y:player.y+player.h*0.55,vx:rnd(-1,1),vy:rnd(0,1.2),life:18,max:18,r:rnd(2,4),col:"rgba(210,240,255,.85)",kind:"smoke"}); }
    player.vy = Math.min(player.vy + GRAVITY*0.32, 7);
  } else {
    // jump-cut for normal jumps only — NEVER cut a trampoline launch (let it fling you sky-high)
    if (!player.trampHold && !down("jump") && player.vy<-JUMP_CUT) player.vy=-JUMP_CUT;
    player.vy=Math.min(player.vy+GRAVITY,MAX_FALL);
    if (player.vy>=0) player.trampHold=false;   // clear at the apex
  }

  // fire joints
  if (down("fire") && ammo>0 && fireCd<=0){
    ammo--; fireCd=11; sfx.shoot();
    projectiles.push({x:player.x+(player.facing>0?player.w:-6), y:player.y+player.h*0.42,
                      vx:player.facing*12, vy:-1.1, life:64});
    puff(player.x+(player.facing>0?player.w:0), player.y+player.h*0.42, 5, "#ddd", false);
    player.vx -= player.facing*0.6; // recoil
  }

  // integrate + resolve
  player.x+=player.vx; resolveX();
  const prevFeet=player.y+player.h;
  player.y+=player.vy; resolveY(prevFeet);
  if (player.y < SKY_TOP+8){ player.y=SKY_TOP+8; if(player.vy<0) player.vy=0; }   // sky ceiling

  // squash/stretch easing
  player.stretch=lerp(player.stretch,1,0.18);
  if (player.squash>0) player.squash--;

  // fell / lava
  const cx=player.x+player.w/2;
  if (player.y>DEATH_Y){ die("fell"); }
  else if (curTheme().lava && inPit(cx) && player.y+player.h>GROUND_TOP+8){ lavaSplash(cx); die("lava"); }

  distance=Math.max(distance, Math.floor(player.x/10));

  // camera (x + vertical follow so you can climb high); zoomed out on portrait → see more around you
  const Z=viewZoom(), viewW=VW/Z, viewH=VH/Z;
  cam.x=lerp(cam.x, Math.max(0,player.x-viewW*0.34), 0.16);
  const vA=(VW<600)?0.66:0.56;                          // portrait: floor sits lower on screen (more sky above)
  const tcy=clamp(player.y-viewH*vA, SKY_TOP-40, 0);
  cam.y=lerp(cam.y, tcy, 0.12);

  // run anim
  if (player.onGround && Math.abs(player.vx)>0.4) player.runPhase+=Math.abs(player.vx)*0.06+0.07;
  else player.runPhase+=0.02;
  player.blink=(player.blink+1)%220;

  // boost trail / star sparkle
  if (boosted && Math.abs(player.vx)>2 && frameCount%2===0)
    particles.push({x:player.x+player.w/2,y:player.y+player.h*0.6,vx:-player.vx*0.3,vy:rnd(-.4,.4),life:18,max:18,r:rnd(4,9),col:"#7CFC6A",kind:"smoke"});
  if (invincible && frameCount%2===0)
    particles.push({x:player.x+rnd(0,player.w),y:player.y+rnd(0,player.h),vx:rnd(-1,1),vy:rnd(-1,1),life:16,max:16,r:rnd(2,4),col:`hsl(${(frameCount*9)%360} 90% 65%)`,kind:"spark"});

  updateProjectiles();
  updateEnemies(invincible);
  updateBossShots(invincible);
  updatePickups();
  updateChase();
  if (DB.pet) updatePet();          // 🦅 move eagle + emit joint smoke BEFORE particles age this frame
  updateParticles();
}

function resolveX(){
  for (const p of platforms){
    if (!p.ground && !p.block) continue;
    if (aabb(player,p)){
      const overlapTop=(player.y+player.h)-p.y;
      if (overlapTop>10 && (player.y - p.y) < p.h - 2){
        if (player.vx>0) player.x=p.x-player.w; else if (player.vx<0) player.x=p.x+p.w;
        player.vx=0;
      }
    }
  }
}
function resolveY(prevFeet){
  player.onGround=false;
  for (const p of platforms){
    if (!(p.brick||p.ground||p.block||p.tramp)) continue;
    const thick = p.ground? (VH-GROUND_TOP+260) : (p.h+8);
    const landing = player.vy>=0 && prevFeet<=p.y+8 &&
      player.x+player.w>p.x+4 && player.x<p.x+p.w-4 &&
      player.y+player.h>=p.y && player.y+player.h<=p.y+thick;
    if (landing){
      if (p.tramp){
        player.y=p.y-player.h; player.vy=-TRAMP_BOUNCE; p.squish=12; player.trampHold=true;
        player.stretch=1.4; sfx.bounce(); puff(p.x+p.w/2,p.y,14,"#ffe27a"); player.buffer=0; screenShakeAdd(4);
      } else {
        player.y=p.y-player.h; player.vy=0; player.onGround=true; player.coyote=COYOTE;
        if (player.stretch>1.06){ player.squash=8; }
        player.stretch=0.86;
      }
    }
  }
}

function updateProjectiles(){
  for (const j of projectiles){
    j.x+=j.vx; j.vy+=0.05; j.y+=j.vy; j.life--;
    if (frameCount%2===0) particles.push({x:j.x,y:j.y,vx:rnd(-.4,.4),vy:rnd(-.6,-.1),life:14,max:14,r:rnd(2,4),col:"rgba(220,220,220,.8)",kind:"smoke"});
    for (const e of enemies){
      if (e.dead) continue;
      if (aabb({x:j.x-4,y:j.y-3,w:10,h:8}, e)){ damageEnemy(e,1,"joint"); j.life=0; flash=Math.max(flash,4); break; }
    }
  }
  projectiles=projectiles.filter(j=> j.life>0 && j.x>cam.x-80 && j.x<camRightX());
}
function updateBossShots(invincible){
  for (const b of bossShots){
    b.x+=b.vx; b.y+=b.vy; b.life--;
    if (frameCount%2===0) particles.push({x:b.x,y:b.y,vx:0,vy:0,life:8,max:8,r:2,col:"rgba(255,120,70,.6)",kind:"smoke"});
    if (hitTimer<=0 && !invincible && !dead && !hanging && aabb({x:b.x-4,y:b.y-4,w:8,h:8}, player)){ b.life=0; hurt(); }
  }
  bossShots = bossShots.filter(b=> b.life>0 && b.x>cam.x-100 && b.x<camRightX() && b.y<DEATH_Y);
}

function updateEnemies(invincible){
  for (const e of enemies){
    if (e.dead){ e.squish++; continue; }
    e.t+=0.08;
    if (e.aggro){
      const dx=(player.x+player.w/2)-(e.x+e.w/2);
      if (Math.abs(dx)<260 && Math.abs((player.y)-(e.y))<120){ e.vx=Math.sign(dx)*2.7; }
      else { if (e.x<e.homeL) e.vx=Math.abs(e.vx)||1.4; if (e.x>e.homeR) e.vx=-(Math.abs(e.vx)||1.4); }
    } else if (e.boss){
      const dx=(player.x)-(e.x);
      e.vx=clamp(dx*0.007, -1.7, 1.3);
      // 🔫 narco boss shoots back — single aimed bullets
      if (e.shootCd>0) e.shootCd--;
      const onScreen = e.x>cam.x-40 && e.x<camRightX();
      if (e.shootCd<=0 && onScreen && !dead && !hanging){
        const sx0=e.x+e.w/2, sy0=e.y+e.h*0.42;
        const tx=player.x+player.w/2-sx0, ty=player.y+player.h*0.5-sy0;
        const d=Math.max(1,Math.hypot(tx,ty)), sp=5.2;
        bossShots.push({x:sx0,y:sy0,vx:tx/d*sp,vy:ty/d*sp,life:150});
        sfx.shoot(); e.shootCd=irnd(70,110); e.muzzle=6;
      }
      if (e.muzzle>0) e.muzzle--;
    } else {
      if (e.x<e.homeL){ e.x=e.homeL; e.vx=Math.abs(e.vx); }
      if (e.x>e.homeR){ e.x=e.homeR; e.vx=-Math.abs(e.vx); }
    }
    e.x+=e.vx;
    if (e.aggro){ if(e.x<e.homeL-160)e.x=e.homeL-160; if(e.x>e.homeR+160)e.x=e.homeR+160; }

    if (hitTimer<=0 && aabb(player,e)){
      const stomping = player.vy>1.4 && (player.y+player.h)-e.y<30;
      if (invincible){ damageEnemy(e, e.boss?3:99, "star"); }
      else if (stomping){ damageEnemy(e,1,"stomp"); player.vy=-STOMP_BOUNCE; player.buffer=0; player.stretch=1.2; }
      else { hurt(); }
    }
  }
}
function damageEnemy(e,dmg,src){
  e.hp-=dmg;
  if (e.hp>0){ sfx.stomp(); e.squish=0; flash=Math.max(flash,3); puff(e.x+e.w/2,e.y+6,5,"#fff"); return; }
  e.dead=true; e.squish= src==="stomp"?26:0;
  if (e.boss){
    bossAlive=false; const gain=lives<MAX_LIVES?1:0; lives=Math.min(MAX_LIVES,lives+1); score+=10; sfx.life(); flash=14; slowmo=24; screenShakeAdd(14);
    addBanner("NARCO BOSS DOWN!", (gain?"+1 LIFE  ·  ":"MAX LIVES  ·  ")+"+10 kush", "#ffd54a", 170);
    for(let i=0;i<26;i++) particles.push({x:e.x+e.w/2,y:e.y+e.h/2,vx:rnd(-5,5),vy:rnd(-7,1),life:irnd(30,55),max:55,r:rnd(3,7),col:`hsl(${irnd(0,360)} 90% 60%)`,kind:"spark"});
    for(let i=0;i<5;i++) weeds.push(mkWeed(e.x+rnd(-10,e.w),GROUND_TOP-34));
  } else {
    score+= (src==="stomp"?1:2);
    sfx.stomp(); flash=Math.max(flash,5);
    puff(e.x+e.w/2,e.y+e.h/2,10,"#cfe0ff",true);
    for(let i=0;i<2;i++) particles.push({x:e.x+e.w/2,y:e.y,vx:rnd(-2,2),vy:rnd(-4,-1),life:22,max:22,r:5,col:"#7CFC6A",kind:"smoke"});
  }
}

function updatePickups(){
  for (const arr of [weeds,floatPickups]) for (const o of arr){
    if (o.taken) continue; o.bob+=0.08;
    if (aabb(player,o)){ o.taken=true; score+=1; sfx.collect(); puff(o.x+o.w/2,o.y,5,"#7CFC6A"); }
  }
  for (const b of bongs){ if(b.taken)continue; b.bob+=0.07;
    if (aabb(player,b)){ b.taken=true; speedTimer=60*7; sfx.bong(); flash=8; addBanner("BONG!","SPEED BOOST","#7CFC6A",80); puff(b.x+b.w/2,b.y,14,"#8af",true); } }
  for (const s of stars){ if(s.taken)continue; s.bob+=0.09; s.t+=0.12;
    if (aabb(player,s)){ s.taken=true; starTimer=60*8; sfx.star(); flash=10; screenShakeAdd(8); addBanner("CALI STAR!","INVINCIBLE","#ff7bd0",90); } }
  for (const c of cannons){ if(c.taken)continue; c.bob+=0.07;
    if (aabb(player,c)){ c.taken=true; ammo=Math.min(AMMO_CAP, ammo+14); sfx.bong(); flash=8; addBanner("BLOW CANNON!","Press F / 🚬 to fire joints (max "+AMMO_CAP+")","#ffd54a",110); } }
  for (const wg of wings){ if(wg.taken)continue; wg.bob+=0.06;
    if (aabb(player,wg)){ wg.taken=true; flyTimer=60*7; sfx.star(); flash=10; screenShakeAdd(6); addBanner("KUSH WINGS! 🪽","FLY — hold JUMP to soar","#bfe6ff",120); puff(wg.x+wg.w/2,wg.y,18,"#cfeaff",true); } }
  // secret collectible: bumps the hidden rank counter, no HUD/banner reveal
  for (const hd of hiddens){ if(hd.taken)continue; hd.bob+=0.08; hd.t+=0.1;
    if (aabb(player,hd)){ hd.taken=true; hidden++; sfx.collect();
      for(let i=0;i<10;i++) particles.push({x:hd.x+hd.w/2,y:hd.y+hd.h/2,vx:rnd(-2,2),vy:rnd(-2.4,.4),life:irnd(18,30),max:30,r:rnd(2,4),col:`hsl(${irnd(270,320)} 90% 70%)`,kind:"spark"}); } }
}

function updateChase(){
  // police line creeps forward; speed ramps with level
  chaseSpeed = 3.0 + level*0.18;
  chaseSpeed = Math.min(chaseSpeed, MOVE_SPD-0.45);   // always escapable by running
  chaseX += chaseSpeed;
  if (chaseX < player.x-980) chaseX=player.x-980;      // never lag too far behind

  const gap=player.x-chaseX;
  Music.tense = gap<260;
  if (gap<250 && frameCount%26===0) sfx.siren(Math.floor(frameCount/26)%2===0);

  if (gap < 26 && !hanging && !dead){
    if (!bribeUsed && score>=100){
      score-=100; bribeUsed=true; chaseX=player.x-560; flash=12; slowmo=18;
      sfx.bribe(); addBanner("BRIBED THE COPS! 💵","-100 weed  ·  one-time only","#36d36b",150);
      for(let i=0;i<18;i++) particles.push({x:player.x,y:player.y,vx:rnd(-4,4),vy:rnd(-6,0),life:40,max:40,r:5,col:"#36d36b",kind:"spark"});
    } else {
      startHang();
    }
  }
}

function startHang(){
  hanging=true; hangTimer=0; hangX=player.x+30; slowmo=30; sfx.hang(); screenShakeAdd(12);
  player.vx=0; player.vy=0;
  addBanner("BUSTED!","No bribe... to the weed tree 🌿","#ff5a5a",180);
}
const HANG_BODY_X = ()=> hangX+54, HANG_BODY_Y = GROUND_TOP-150;   // hanging body anchor (matches drawHanging)
const HANG_LEN = 560;                                              // way longer cinematic (~9.3s)
const HANG_FIRE_FROM=140, HANG_FIRE_TO=500, HANG_FIRE_EVERY=16;    // two cops' gunfire window
function updateHang(){
  hangTimer++;
  if (hangTimer===1) sfx.hang();
  const t=hangTimer;
  // 👮👮 two cops open fire on the hanging body
  if (t>=HANG_FIRE_FROM && t<=HANG_FIRE_TO && (t-HANG_FIRE_FROM)%HANG_FIRE_EVERY===0){
    sfx.shoot();
    const bx=HANG_BODY_X(), by=HANG_BODY_Y;
    for(let i=0;i<6;i++) particles.push({x:bx+rnd(-12,12),y:by+rnd(-8,26),vx:rnd(-2.4,2.4),vy:rnd(-2.4,1.4),life:irnd(16,30),max:30,r:rnd(2,4),col: Math.random()<0.6?"#c01020":"#7a0a16",kind:"spark"});
    screenShakeAdd(3);
  }
  if (t>HANG_LEN){
    lives--;
    if (lives>0){
      hanging=false; hitTimer=80; speedTimer=0; starTimer=0;
      player.x=Math.max(80,player.x-30); player.y=GROUND_TOP-player.h-4; player.vx=0; player.vy=0;
      let tt=0; while(inPit(player.x+player.w/2)&&tt<40){player.x+=30;tt++;}
      chaseX=player.x-620; // bribe stays used
      addBanner("CUT DOWN!","Run, "+(lives)+" "+(lives===1?"life":"lives")+" left","#ffd54a",120);
    } else {
      overReason="hanged"; gameOver();
    }
  }
}

function updateDead(){
  deadTimer++;
  player.vy=Math.min(player.vy+GRAVITY,MAX_FALL); player.y+=player.vy;
  if (deadTimer>70){
    if (lives>0) respawn(); else gameOver();
  }
  updateParticles();
}
function respawn(){
  dead=false; deadTimer=0; hitTimer=80; speedTimer=0; starTimer=0;
  player.vx=0; player.vy=0; player.x=Math.max(80,player.x-40); player.y=GROUND_TOP-player.h-4;
  let t=0; while(inPit(player.x+player.w/2)&&t<40){player.x+=30;t++;}
  chaseX=player.x-540;
}

function hurt(){
  if (starTimer>0) return;
  if (speedTimer>0) speedTimer=0;
  lives--; hitTimer=95; sfx.hurt(); flash=10; screenShakeAdd(10);
  player.vy=-8; player.vx=-player.facing*5;
  if (lives<=0) die("busted");
}
function die(reason){
  if (dead||hanging) return;
  overReason=reason; dead=true; deadTimer=0;
  player.vy = (reason==="fell"||reason==="lava")?Math.max(player.vy,2):-12;
  sfx.die();
  if (reason==="fell"||reason==="lava"){ lives=Math.max(0,lives-1); sfx.hurt(); }
}
function lavaSplash(x){ for(let i=0;i<16;i++) particles.push({x,y:GROUND_TOP+6,vx:rnd(-4,4),vy:rnd(-8,-2),life:irnd(20,40),max:40,r:rnd(3,7),col:`hsl(${irnd(10,40)} 100% 55%)`,kind:"spark"}); }

// 🦅 Kush Eagle companion — flapping bald eagle smoking a joint, drawn in WORLD space
function drawEagle(x,y,flap){
  const dir = (player.facing>0?1:-1);          // face the way we travel
  ctx.save(); ctx.translate(x,y); ctx.scale(dir,1);   // mirror for left-facing
  ctx.fillStyle="rgba(0,0,0,.14)"; ctx.beginPath(); ctx.ellipse(0,26,16,4,0,0,6.28); ctx.fill();
  // wings (behind body) — flapping
  ctx.fillStyle="#6b4a2a"; ctx.strokeStyle="#3f2c18"; ctx.lineWidth=1;
  for(const s of [-1,1]){ ctx.save(); ctx.translate(0,-2); ctx.rotate(s*flap*0.5);
    ctx.beginPath(); ctx.moveTo(0,0);
    ctx.quadraticCurveTo(s*-22,-16,s*-34,-2); ctx.quadraticCurveTo(s*-24,2,s*-30,10);
    ctx.quadraticCurveTo(s*-16,4,s*-10,12); ctx.quadraticCurveTo(s*-6,4,0,6);
    ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore(); }
  // tail
  ctx.fillStyle="#fff"; ctx.beginPath(); ctx.moveTo(-6,6); ctx.lineTo(-20,12); ctx.lineTo(-18,16); ctx.lineTo(-4,12); ctx.closePath(); ctx.fill();
  // body
  ctx.fillStyle="#7a5430"; ctx.beginPath(); ctx.ellipse(0,2,12,9,0,0,6.28); ctx.fill();
  ctx.fillStyle="#5e4022"; ctx.beginPath(); ctx.ellipse(-2,5,9,5,0,0,6.28); ctx.fill();
  // white head + eye
  ctx.fillStyle="#f4f4ee"; ctx.beginPath(); ctx.arc(9,-5,8,0,6.28); ctx.fill();
  ctx.fillStyle="#111"; ctx.beginPath(); ctx.arc(12,-6,1.8,0,6.28); ctx.fill();
  // hooked yellow beak
  ctx.fillStyle="#ffb31a"; ctx.beginPath(); ctx.moveTo(15,-6); ctx.lineTo(24,-3); ctx.quadraticCurveTo(26,-1,23,1); ctx.lineTo(15,-1); ctx.closePath(); ctx.fill();
  // the JOINT near the beak (white stick + glowing ember) — matches the smoke from updatePet
  ctx.save(); ctx.translate(24,-1); ctx.rotate(0.15);
  ctx.fillStyle="#f7f3e8"; ctx.fillRect(0,-1.4,9,2.8);
  ctx.fillStyle=(frameCount%20<10)?"#ff7a2a":"#ffae33"; ctx.beginPath(); ctx.arc(9.5,0,1.8,0,6.28); ctx.fill();
  ctx.fillStyle="rgba(255,140,40,.35)"; ctx.beginPath(); ctx.arc(9.5,0,3.2,0,6.28); ctx.fill();
  ctx.restore();
  ctx.restore();
}
function updatePet(){
  // eagle trails the player (eased follow to above-and-behind) + bob, smokes a joint (puff on cooldown)
  const dir = (player.facing>0?1:-1);
  const tx = player.x + player.w/2 - dir*64;                 // behind = opposite of facing
  const ty = player.y - 64 + Math.sin(frameCount*0.05)*6;    // gentle hover bob baked into target
  petX += (tx-petX)*0.10;                                    // smooth, laggy follow
  petY += (ty-petY)*0.10;
  petFlap = Math.sin(frameCount*0.30);                       // wing-flap phase for drawEagle
  if (--petPuffCd <= 0){
    petPuffCd = irnd(12,18);
    const bx = petX + dir*16, by = petY - 4;                 // joint tip near the beak (faces travel dir)
    for(let i=0;i<2;i++) particles.push({
      x:bx+rnd(-1,1), y:by+rnd(-1,1),
      vx:rnd(-.3,.3)+dir*0.2, vy:rnd(-.9,-.3),
      life:irnd(22,34), max:34, r:rnd(2,4),
      col:"rgba(225,235,225,.7)", kind:"smoke"
    });
  }
}

function bankAndSubmit(){
  DB.bank = DB.bank + score;             // bank this run's kush for the shop
  if (score>DB.best) DB.best=score;
  if (distance>DB.bestDist) DB.bestDist=distance;
  const nm = Profile.key(DB.name) || "PLAYER";
  Board.submit({ name:nm, score:Math.floor(score), dist:Math.floor(distance), hidden:Math.floor(hidden), ts:Date.now() });
  Profile.save();                        // push bank/best/bestDist (+owned/skin/pet) to the cloud account
}
function gameOver(){ G.scene="over"; bankAndSubmit(); }
// in-game "back to menu": bank + submit the run (nothing lost), then to the title
function quitToMenu(){
  if (G.scene==="play"||G.scene==="paused"){ bankAndSubmit(); }
  G.scene="title"; G.paused=false; Board.refresh();
}

// particles + shake
let shake=0;
function screenShakeAdd(v){ shake=Math.min(22, shake+v); }
function updateParticles(){
  for (const p of particles){
    p.x+=p.vx; p.y+=p.vy;
    if (p.kind==="smoke"){ p.vy-=0.04; p.vx*=0.97; } else { p.vy+=0.18; }
    p.life--;
  }
  particles=particles.filter(p=>p.life>0);
  if (particles.length>460) particles.splice(0, particles.length-460);
}
function puff(x,y,n,col,big=false){
  for(let i=0;i<n;i++) particles.push({x,y,vx:rnd(-2.4,2.4),vy:rnd(-3.2,.4),life:irnd(16,26),max:24,r:big?rnd(4,9):rnd(2,5),col,kind:Math.random()<.5?"smoke":"spark"});
}

// ======================================================================
//  RENDER
// ======================================================================
function render(){
  if (shake>0.2){ shake*=0.86; } else shake=0;
  const sm = slowmo>0?0.4:1;
  const shX = shake? rnd(-shake,shake)*0.6 : 0;
  const shY = shake? rnd(-shake,shake)*0.6 : 0;

  ctx.save();
  ctx.translate(shX,shY);

  const th = curTheme();
  drawBackground(th);

  ctx.save();
  const _Z=viewZoom(); if(_Z!==1) ctx.scale(_Z,_Z);
  ctx.translate(-Math.round(cam.x), -Math.round(cam.y));
  drawGroundAndHazards(th);
  drawPlatforms(th);
  drawPickups();
  drawCannonPickups();
  drawEnemies();
  drawProjectiles();
  drawBossShots();
  drawParticles();
  if (!hanging) drawPlayer();
  if (DB.pet && !hanging && (G.scene==="play"||G.scene==="paused")) drawEagle(petX, petY, petFlap);   // 🦅 only when world is live
  drawChaseCar(th);
  if (hanging) drawHanging();
  ctx.restore();

  drawWeather(th);
  if (G.scene==="play"||G.scene==="paused"){ drawInsanity(); drawHUD(); }
  drawBanners();
  if (levelFlash>0){ ctx.fillStyle=`rgba(255,255,255,${levelFlash/120})`; ctx.fillRect(0,0,VW,VH); }
  if (flash>0){ ctx.fillStyle=`rgba(255,255,255,${flash/30})`; ctx.fillRect(0,0,VW,VH); }
  drawVignette(th);
  ctx.restore();

  uiButtons=[];
  if (G.scene==="intro") drawIntro();
  else if (G.scene==="title") drawTitle();
  else if (G.scene==="shop") drawShop();
  else if (G.scene==="over") drawGameOver();
  else if (G.scene==="paused") drawPaused();
  if (G.scene==="play") drawMenuButton();

  syncNameInput();
}

// ----- backgrounds -----
function drawBackground(th){
  const inv=starTimer>0;
  const g=ctx.createLinearGradient(0,0,0,VH);
  if (inv){ const h=(frameCount*4)%360; g.addColorStop(0,`hsl(${h} 70% 70%)`); g.addColorStop(1,`hsl(${(h+60)%360} 70% 55%)`); }
  else { g.addColorStop(0,th.sky[0]); g.addColorStop(.55,th.sky[1]); g.addColorStop(1,th.sky[2]); }
  ctx.fillStyle=g; ctx.fillRect(0,0,VW,VH);

  // sun / moon
  if (th.night){
    ctx.fillStyle="rgba(255,250,230,.92)"; ctx.beginPath(); ctx.arc(VW*0.8,VH*0.22-cam.y*0.05,38,0,6.28); ctx.fill();
    // stars
    ctx.fillStyle="rgba(255,255,255,.8)";
    for(let i=0;i<40;i++){ const x=((i*137.5 - cam.x*0.05)%VW+VW)%VW; const y=(i*53)%Math.floor(VH*0.5); if((i*frameCount)%97<60) ctx.fillRect(x,y-cam.y*0.05,2,2); }
  } else {
    ctx.fillStyle="rgba(255,247,214,.9)"; ctx.beginPath(); ctx.arc(VW*0.78,VH*0.24-cam.y*0.05,46,0,6.28); ctx.fill();
  }

  if (th.id==="city")   drawCityBg(false);
  else if (th.id==="night") drawCityBg(true);
  else if (th.id==="desert") drawDesertBg();
  else if (th.id==="lava") drawLavaBg();

  drawClouds(th);
}

// Kuala Lumpur skyline (Petronas + KL Tower) — tiled parallax
function drawCityBg(night){
  const par=0.26, panelW=1100, baseY=GROUND_TOP+6-cam.y*0.10;
  const off=((cam.x*par)%panelW+panelW)%panelW;
  for(let p=-1;p<=Math.ceil(VW/panelW)+1;p++) klPanel(p*panelW-off, baseY, night);
  if (night){ // neon glow strip
    ctx.fillStyle="rgba(66,232,255,.06)"; ctx.fillRect(0,baseY-60,VW,80);
  }
}
function klPanel(ox, baseY, night){
  const col = night?"#2a2350":"#6f86c6", colD=night?"#1d1840":"#5f74b0";
  const win = night?"rgba(120,230,255,.55)":"rgba(255,243,200,.5)";
  const blds=[[20,150,90],[120,210,70],[200,120,110],[330,260,80],[430,170,95],[540,300,70],[620,140,120],[760,230,85],[860,180,75],[950,120,120],[1030,200,60]];
  ctx.fillStyle=colD;
  for(const [x,h,w] of blds){
    ctx.fillRect(ox+x,baseY-h,w,h);
    ctx.fillStyle=win;
    for(let yy=baseY-h+10;yy<baseY-8;yy+=16) for(let xx=ox+x+6;xx<ox+x+w-6;xx+=14){ if(!night||((xx+yy)|0)%3) ctx.fillRect(xx,yy,6,8); }
    ctx.fillStyle=colD;
  }
  klTower(ox+265,baseY,col,night);
  petronas(ox+650,baseY,night?"#3a3170":"#8fa3d8",night);
  petronas(ox+740,baseY,night?"#3a3170":"#8fa3d8",night);
  ctx.fillStyle=night?"#5a4ea0":"#aebbe6"; ctx.fillRect(ox+650+27,baseY-300,(740-650)+18,7);
}
function petronas(x,baseY,color,night){
  const h=360,w=46,segs=5; ctx.fillStyle=color;
  for(let i=0;i<segs;i++){ const sw=w-i*5,sh=h/segs,sx=x+(w-sw)/2; ctx.fillRect(sx,baseY-h+i*sh,sw,sh+1);
    ctx.fillStyle="rgba(255,255,255,.22)"; ctx.fillRect(sx,baseY-h+i*sh,sw,3); ctx.fillStyle=color; }
  const tx=x+w/2; ctx.beginPath(); ctx.moveTo(tx-6,baseY-h); ctx.lineTo(tx,baseY-h-34); ctx.lineTo(tx+6,baseY-h); ctx.closePath(); ctx.fill();
  ctx.fillRect(tx-1,baseY-h-58,2,26);
  ctx.fillStyle=night?"rgba(120,230,255,.5)":"rgba(255,243,200,.5)";
  for(let yy=baseY-h+20;yy<baseY-10;yy+=18) for(let xx=x+8;xx<x+w-8;xx+=10) ctx.fillRect(xx,yy,4,8);
}
function klTower(x,baseY,color,night){
  const h=300; ctx.fillStyle=color; ctx.fillRect(x,baseY-h,16,h);
  ctx.beginPath(); ctx.ellipse(x+8,baseY-h+8,26,18,0,0,6.28); ctx.fill();
  ctx.fillStyle=night?"#5a4ea0":"#cdd8f4"; ctx.beginPath(); ctx.ellipse(x+8,baseY-h+8,26,8,0,0,6.28); ctx.fill();
  ctx.fillStyle=color; ctx.fillRect(x+7,baseY-h-44,2,44);
  ctx.fillStyle=(frameCount%40<20)?"#ff6b6b":"#7a2020"; ctx.fillRect(x+6,baseY-h-46,4,4);
}
function drawDesertBg(){
  const baseY=GROUND_TOP+6-cam.y*0.1;
  // pyramids
  ctx.fillStyle="#caa24a";
  for(let p=-1;p<=4;p++){ const ox=((p*520 - cam.x*0.2)%(VW+600)); pyramid(ox+120, baseY, 150); pyramid(ox+330, baseY, 90); }
  // dunes
  ctx.fillStyle="#e0b65a";
  ctx.beginPath(); ctx.moveTo(0,baseY);
  for(let x=0;x<=VW;x+=40) ctx.lineTo(x, baseY-30-Math.sin((x+cam.x*0.3)*0.01)*22);
  ctx.lineTo(VW,baseY+200); ctx.lineTo(0,baseY+200); ctx.fill();
}
function pyramid(x,baseY,s){ ctx.beginPath(); ctx.moveTo(x,baseY); ctx.lineTo(x+s/2,baseY-s*0.8); ctx.lineTo(x+s,baseY); ctx.closePath(); ctx.fill();
  ctx.fillStyle="rgba(0,0,0,.08)"; ctx.beginPath(); ctx.moveTo(x+s/2,baseY-s*0.8); ctx.lineTo(x+s,baseY); ctx.lineTo(x+s/2,baseY); ctx.closePath(); ctx.fill(); ctx.fillStyle="#caa24a"; }
function drawLavaBg(){
  const baseY=GROUND_TOP+6-cam.y*0.1;
  ctx.fillStyle="#2a1116";
  for(let p=-1;p<=5;p++){ const ox=((p*360 - cam.x*0.22)%(VW+420)); volcano(ox+120,baseY,160); }
  // glowing horizon
  const g=ctx.createLinearGradient(0,baseY-40,0,baseY+40); g.addColorStop(0,"rgba(255,90,20,0)"); g.addColorStop(1,"rgba(255,120,30,.5)");
  ctx.fillStyle=g; ctx.fillRect(0,baseY-40,VW,80);
}
function volcano(x,baseY,s){ ctx.beginPath(); ctx.moveTo(x,baseY); ctx.lineTo(x+s*0.35,baseY-s*0.7); ctx.lineTo(x+s*0.5,baseY-s*0.62); ctx.lineTo(x+s*0.65,baseY-s*0.7); ctx.lineTo(x+s,baseY); ctx.closePath(); ctx.fill();
  ctx.fillStyle=(frameCount%30<15)?"#ff7a2a":"#ff5a1a"; ctx.fillRect(x+s*0.42,baseY-s*0.7,s*0.16,8); ctx.fillStyle="#2a1116"; }

let cloudSeed=[]; for(let i=0;i<12;i++) cloudSeed.push({x:rnd(0,4000),y:rnd(20,200),s:rnd(.6,1.4),spd:rnd(.1,.35)});
function drawClouds(th){
  ctx.fillStyle= th.night?"rgba(180,180,210,.35)":"rgba(255,255,255,.85)";
  for(const c of cloudSeed){ const x=((c.x-cam.x*0.15-frameCount*c.spd)%(VW+400)); const px=x<-200?x+VW+400:x; cloud(px, c.y-cam.y*0.08, c.s); }
}
function cloud(x,y,s){ ctx.beginPath(); ctx.arc(x,y,18*s,0,6.28); ctx.arc(x+20*s,y+4*s,22*s,0,6.28); ctx.arc(x+44*s,y,16*s,0,6.28); ctx.arc(x+22*s,y-8*s,16*s,0,6.28); ctx.fill(); }

// ----- ground / hazards (world space) -----
function drawGroundAndHazards(th){
  // every PIT renders as a clearly visible dark chasm with warning edges
  for(const p of pits){
    if (p.x+p.w<cam.x-60 || p.x>camRightX()) continue;
    const ly=GROUND_TOP+2;
    const g=ctx.createLinearGradient(0,ly,0,ly+220);
    g.addColorStop(0,"rgba(6,8,14,.92)"); g.addColorStop(1,"rgba(2,3,6,1)");
    ctx.fillStyle=g; ctx.fillRect(p.x-2, ly, p.w+4, 260);
    // crumbly cliff faces on each side
    ctx.fillStyle=th.soil;
    ctx.beginPath(); ctx.moveTo(p.x-2,ly); ctx.lineTo(p.x-2,ly+26); ctx.lineTo(p.x+11,ly+12); ctx.lineTo(p.x+7,ly); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(p.x+p.w+2,ly); ctx.lineTo(p.x+p.w+2,ly+26); ctx.lineTo(p.x+p.w-11,ly+12); ctx.lineTo(p.x+p.w-7,ly); ctx.closePath(); ctx.fill();
    // bright hazard markers at the lips
    ctx.fillStyle=th.accent; ctx.fillRect(p.x-4,ly-5,7,5); ctx.fillRect(p.x+p.w-3,ly-5,7,5);
    ctx.fillStyle="rgba(0,0,0,.45)"; ctx.fillRect(p.x-2,ly,3,30); ctx.fillRect(p.x+p.w-1,ly,3,30);
  }
  // glowing lava on top of the chasm (lava theme)
  if (th.lava){
    for(const p of pits){
      if (p.x+p.w<cam.x-60 || p.x>camRightX()) continue;
      const ly=GROUND_TOP+8;
      const g=ctx.createLinearGradient(0,ly,0,ly+120); g.addColorStop(0,"#ffd24a"); g.addColorStop(.4,"#ff6a1a"); g.addColorStop(1,"#8a1a08");
      ctx.fillStyle=g;
      ctx.beginPath(); ctx.moveTo(p.x,ly);
      for(let x=p.x;x<=p.x+p.w;x+=12) ctx.lineTo(x, ly+Math.sin((x+frameCount*3)*0.05)*4);
      ctx.lineTo(p.x+p.w,ly+200); ctx.lineTo(p.x,ly+200); ctx.fill();
      if (frameCount%6===0) particles.push({x:p.x+rnd(0,p.w),y:ly,vx:rnd(-1,1),vy:rnd(-3,-1),life:irnd(20,40),max:40,r:rnd(2,4),col:`hsl(${irnd(15,40)} 100% 55%)`,kind:"smoke"});
    }
  }
}

function drawPlatforms(th){
  for(const p of platforms){
    if (p.x+p.w<cam.x-60 || p.x>camRightX()) continue;
    if (p.ground) drawGround(p,th);
    else if (p.castleGate) drawCastleGate(p);
    else if (p.tower) drawTowerColumn(p,th);
    else if (p.skybridge) drawSkybridge(p);
    else if (p.tramp) drawTramp(p);
    else if (p.cloud) drawCloudPlat(p);
    else if (p.block||p.step) drawBlock(p);
    else drawBrick(p);
  }
}
function drawGround(p,th){
  ctx.fillStyle=th.grass; ctx.fillRect(p.x,p.y,p.w,16);
  ctx.fillStyle=th.grassDk; ctx.fillRect(p.x,p.y+12,p.w,6);
  ctx.fillStyle=th.soil; ctx.fillRect(p.x,p.y+16,p.w,p.h-16);
  ctx.strokeStyle=th.soilLine; ctx.lineWidth=2;
  for(let yy=p.y+18;yy<p.y+Math.min(p.h,160);yy+=20){ ctx.beginPath(); ctx.moveTo(p.x,yy); ctx.lineTo(p.x+p.w,yy); ctx.stroke(); }
  if (th.id==="city"||th.id==="night"){ ctx.fillStyle=th.grassDk; for(let xx=p.x+6;xx<p.x+p.w;xx+=22){ ctx.fillRect(xx,p.y-4,3,6); ctx.fillRect(xx+5,p.y-6,3,8);} }
  if (th.id==="desert"){ ctx.fillStyle="#cf9a3a"; for(let xx=p.x+10;xx<p.x+p.w;xx+=60){ ctx.fillRect(xx,p.y-8,4,10); ctx.fillRect(xx-4,p.y-3,12,3);} }
}
function drawBrick(p){
  ctx.fillStyle="#c8782e"; ctx.fillRect(p.x,p.y,p.w,p.h);
  ctx.fillStyle="#a85e1d"; ctx.fillRect(p.x,p.y+p.h-5,p.w,5);
  ctx.fillStyle="#e89a52"; ctx.fillRect(p.x,p.y,p.w,4);
  ctx.strokeStyle="rgba(60,30,0,.5)"; ctx.lineWidth=1.5;
  for(let xx=p.x+12;xx<p.x+p.w;xx+=24){ ctx.beginPath(); ctx.moveTo(xx,p.y); ctx.lineTo(xx,p.y+p.h); ctx.stroke(); }
  ctx.beginPath(); ctx.moveTo(p.x,p.y+p.h/2); ctx.lineTo(p.x+p.w,p.y+p.h/2); ctx.stroke();
}
function drawTowerColumn(p,th){
  const x=p.x,y=p.y,w=p.w,h=p.h, gy=GROUND_TOP, night=th&&th.night;
  // body (silver-teal, Petronas glass)
  const g=ctx.createLinearGradient(x,0,x+w,0); g.addColorStop(0,"#6f8596"); g.addColorStop(.5,"#d2e3ee"); g.addColorStop(1,"#6f8596");
  ctx.fillStyle=g; ctx.fillRect(x,y,w,h);
  // vertical mullions
  ctx.fillStyle="rgba(40,60,80,.30)"; for(let xx=x+4;xx<x+w;xx+=6) ctx.fillRect(xx,y,1.4,h);
  // tier setback rings
  ctx.fillStyle="#a9c0cf"; for(let yy=y+24;yy<y+h;yy+=30){ ctx.fillRect(x-3,yy,w+6,5); }
  // windows (some lit, more at night)
  for(let yy=y+8;yy<y+h-6;yy+=12) for(let xx=x+5;xx<x+w-4;xx+=8){
    const lit=(Math.floor((xx*3+yy*5)/11 + frameCount*0.01)%(night?3:6)===0);
    ctx.fillStyle= lit?"#ffe9a6":"rgba(150,190,215,.55)"; ctx.fillRect(xx,yy,4,7); }
  // spire + pinnacle
  ctx.fillStyle="#c9dce8"; ctx.fillRect(x+w/2-2,y-30,4,30);
  ctx.beginPath(); ctx.arc(x+w/2,y-32,3.2,0,6.28); ctx.fill();
  // podium legs + archway down to the ground (passable)
  ctx.fillStyle="#7f97a6"; ctx.fillRect(x, y+h, 8, gy-(y+h)); ctx.fillRect(x+w-8, y+h, 8, gy-(y+h));
  ctx.fillStyle="#90a8b6"; ctx.fillRect(x-3, y+h, w+6, 6);
  ctx.fillStyle="rgba(10,16,22,.6)"; ctx.fillRect(x+8, y+h+6, w-16, gy-(y+h)-6);
  ctx.fillStyle="#b9d2e2"; ctx.fillRect(x+w/2-1, y+h+8, 2, gy-(y+h)-8);  // door divider
}
function drawSkybridge(p){
  ctx.fillStyle="#c2d8e6"; ctx.fillRect(p.x,p.y,p.w,p.h);
  ctx.fillStyle="#8fb0c6"; ctx.fillRect(p.x,p.y+p.h-3,p.w,3); ctx.fillStyle="#eaf4fb"; ctx.fillRect(p.x,p.y,p.w,2);
  ctx.strokeStyle="#8fb0c6"; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(p.x+p.w*0.42,p.y+p.h); ctx.lineTo(p.x+p.w*0.5,p.y+20); ctx.moveTo(p.x+p.w*0.58,p.y+p.h); ctx.lineTo(p.x+p.w*0.5,p.y+20); ctx.stroke();
}
function drawBlock(p){
  ctx.fillStyle="#d99a3a"; ctx.fillRect(p.x,p.y,p.w,p.h);
  ctx.fillStyle="#b87a1d"; ctx.fillRect(p.x,p.y+p.h-4,p.w,4); ctx.fillRect(p.x,p.y,4,p.h);
  ctx.fillStyle="#f0c060"; ctx.fillRect(p.x+2,p.y+2,p.w-4,3);
  ctx.fillStyle="#7a4a10"; for(const [dx,dy] of [[6,6],[p.w-12,6],[6,p.h-12],[p.w-12,p.h-12]]) ctx.fillRect(p.x+dx,p.y+dy,4,4);
}
function drawCloudPlat(p){
  ctx.fillStyle="rgba(255,255,255,.95)";
  for(let xx=p.x;xx<p.x+p.w;xx+=18){ ctx.beginPath(); ctx.arc(xx+9,p.y+10,13,0,6.28); ctx.fill(); }
  ctx.fillRect(p.x,p.y+8,p.w,12);
}
function drawTramp(p){
  const sq=p.squish||0; if(p.squish>0)p.squish--;
  ctx.fillStyle="#222"; ctx.fillRect(p.x+2,p.y+8,6,16); ctx.fillRect(p.x+p.w-8,p.y+8,6,16);
  // springy mat
  ctx.fillStyle="#ff3a6a"; const dip=sq;
  ctx.beginPath(); ctx.moveTo(p.x,p.y+dip); ctx.quadraticCurveTo(p.x+p.w/2,p.y+dip+14,p.x+p.w,p.y+dip); ctx.lineTo(p.x+p.w,p.y+8+dip); ctx.quadraticCurveTo(p.x+p.w/2,p.y+18+dip,p.x,p.y+8+dip); ctx.closePath(); ctx.fill();
  ctx.fillStyle="#ffd24a"; ctx.fillRect(p.x+p.w/2-3,p.y+dip,6,6);
}

// ----- pickups -----
function drawPickups(){
  for(const arr of [weeds,floatPickups]) for(const o of arr){ if(o.taken)continue; if(o.x<cam.x-40||o.x>camRightX())continue; drawWeed(o.x,o.y+Math.sin(o.bob)*4); }
  for(const b of bongs){ if(b.taken)continue; if(b.x<cam.x-40||b.x>camRightX())continue; drawBong(b.x,b.y+Math.sin(b.bob)*4); }
  for(const s of stars){ if(s.taken)continue; if(s.x<cam.x-40||s.x>camRightX())continue; drawCaliStar(s.x,s.y+Math.sin(s.bob)*5,s.t); }
  for(const wg of wings){ if(wg.taken)continue; if(wg.x<cam.x-40||wg.x>camRightX())continue; drawWingsPickup(wg.x,wg.y+Math.sin(wg.bob)*5); }
  for(const hd of hiddens){ if(hd.taken)continue; if(hd.x<cam.x-40||hd.x>camRightX())continue; drawHiddenPickup(hd.x,hd.y+Math.sin(hd.bob)*5,hd.t); }
}
function drawHiddenPickup(x,y,t){
  // subtle shimmering violet gem — easy to overlook
  ctx.save(); ctx.translate(x+10,y+10); ctx.rotate(t*0.6);
  const a=0.35+0.35*Math.sin(t*1.4);
  ctx.globalAlpha=a; ctx.shadowColor="#c79bff"; ctx.shadowBlur=10;
  ctx.fillStyle="#b98cff"; ctx.beginPath(); ctx.moveTo(0,-8); ctx.lineTo(6,0); ctx.lineTo(0,8); ctx.lineTo(-6,0); ctx.closePath(); ctx.fill();
  ctx.shadowBlur=0; ctx.globalAlpha=Math.min(1,a+0.3); ctx.fillStyle="#fff"; ctx.fillRect(-1,-2,2,2);
  ctx.globalAlpha=1; ctx.restore();
}
function drawWingsPickup(x,y){
  ctx.save(); ctx.translate(x+21,y+15);
  const flap=Math.sin(frameCount*0.25)*0.5;
  ctx.shadowColor="rgba(190,230,255,.8)"; ctx.shadowBlur=14;
  for(const s of [-1,1]){ ctx.save(); ctx.scale(s,1); ctx.rotate(-flap*s*0+ (s<0?0:0));
    ctx.fillStyle="#eaf6ff";
    ctx.beginPath(); ctx.moveTo(0,-2);
    ctx.quadraticCurveTo(14,-14+flap*6,22,-2); ctx.quadraticCurveTo(16,0,20,6);
    ctx.quadraticCurveTo(12,2,14,9); ctx.quadraticCurveTo(8,4,8,11);
    ctx.quadraticCurveTo(3,5,0,8); ctx.closePath(); ctx.fill();
    ctx.strokeStyle="rgba(150,200,235,.8)"; ctx.lineWidth=1; ctx.stroke();
    ctx.restore(); }
  ctx.shadowBlur=0; ctx.fillStyle="#ffd54a"; ctx.beginPath(); ctx.arc(0,0,3.5,0,6.28); ctx.fill();
  ctx.restore();
}
function drawCannonPickups(){ for(const c of cannons){ if(c.taken)continue; if(c.x<cam.x-40||c.x>camRightX())continue; drawCannon(c.x,c.y+Math.sin(c.bob)*4); } }

function drawWeed(x,y){
  ctx.save(); ctx.translate(x+12,y+18);
  ctx.shadowColor="rgba(80,255,80,.4)"; ctx.shadowBlur=6;
  ctx.fillStyle="#2f7d32";
  for(let i=-3;i<=3;i++){ const a=i*0.42,len=14-Math.abs(i)*1.6; ctx.save(); ctx.rotate(a);
    ctx.beginPath(); ctx.moveTo(0,2); ctx.quadraticCurveTo(-3,-len*.6,0,-len); ctx.quadraticCurveTo(3,-len*.6,0,2); ctx.fill();
    ctx.strokeStyle="#1f5a22"; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(0,2); ctx.lineTo(0,-len+2); ctx.stroke(); ctx.restore(); }
  ctx.shadowBlur=0; ctx.strokeStyle="#5a3a1a"; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(0,2); ctx.lineTo(0,12); ctx.stroke();
  ctx.restore();
}
function drawBong(x,y){
  ctx.save(); ctx.translate(x,y);
  ctx.fillStyle="rgba(120,200,255,.85)";
  ctx.beginPath(); ctx.moveTo(6,2); ctx.lineTo(20,2); ctx.lineTo(16,16); ctx.lineTo(20,40); ctx.lineTo(6,40); ctx.lineTo(10,16); ctx.closePath(); ctx.fill();
  ctx.strokeStyle="rgba(40,120,180,.9)"; ctx.lineWidth=1.5; ctx.stroke();
  ctx.fillStyle="rgba(80,200,90,.7)"; ctx.fillRect(7,30,12,9);
  ctx.strokeStyle="rgba(40,120,180,.9)"; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(18,26); ctx.lineTo(28,32); ctx.stroke();
  ctx.fillStyle="rgba(255,255,255,.5)"; for(let i=0;i<3;i++){ ctx.beginPath(); ctx.arc(13,-4-i*7+Math.sin(frameCount*0.1+i)*2,3+i,0,6.28); ctx.fill(); }
  ctx.restore();
}
function drawCannon(x,y){
  ctx.save(); ctx.translate(x,y);
  ctx.fillStyle="#3a3a3a"; roundRect(2,8,30,16,6); ctx.fill();             // barrel
  ctx.fillStyle="#7CFC6A"; roundRect(0,12,12,10,4); ctx.fill();            // grip/tank
  ctx.fillStyle="#222"; ctx.fillRect(30,12,8,8);                           // muzzle
  ctx.fillStyle="#fff"; ctx.fillRect(34,13,8,3); ctx.fillStyle="#ff7a2a"; ctx.fillRect(42,13,2,3); // loaded joint
  ctx.fillStyle="rgba(255,255,255,.5)"; ctx.beginPath(); ctx.arc(46,12-Math.sin(frameCount*0.1)*2,3,0,6.28); ctx.fill();
  ctx.restore();
}
function drawCaliStar(x,y,t){
  ctx.save(); ctx.translate(x+16,y+16); ctx.rotate(Math.sin(t)*0.2);
  const h=(frameCount*6)%360; ctx.shadowColor=`hsl(${h} 90% 60%)`; ctx.shadowBlur=18;
  ctx.fillStyle=`hsl(${h} 90% 60%)`; ctx.beginPath();
  for(let i=0;i<10;i++){ const r=i%2?6:17,a=i*Math.PI/5-Math.PI/2; ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r); } ctx.closePath(); ctx.fill();
  ctx.shadowBlur=0; ctx.fillStyle="#2f7d32"; ctx.beginPath(); ctx.arc(0,0,7,0,6.28); ctx.fill();
  ctx.fillStyle="#7CFC6A"; ctx.beginPath(); ctx.arc(-2,-2,3,0,6.28); ctx.fill();
  ctx.strokeStyle="#ff9b3d"; ctx.lineWidth=1; for(let i=0;i<5;i++){ const a=i*1.25; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(Math.cos(a)*7,Math.sin(a)*7); ctx.stroke(); }
  ctx.restore();
}

// ----- projectiles -----
function drawProjectiles(){
  for(const j of projectiles){
    const dir=j.vx>0?1:-1;
    if(frameCount%2===0) particles.push({x:j.x-dir*9,y:j.y-2,vx:rnd(-.4,.4),vy:rnd(-.7,-.1),life:16,max:16,r:rnd(2,4),col:"rgba(225,225,225,.7)",kind:"smoke"});
    ctx.save(); ctx.translate(j.x,j.y); ctx.scale(dir,1);
    // fat tapered joint (thin crutch at back → fat at the burning tip)
    ctx.fillStyle="#f6f1e2";
    ctx.beginPath(); ctx.moveTo(-10,-1.8); ctx.lineTo(7,-3.6); ctx.lineTo(7,3.6); ctx.lineTo(-10,1.8); ctx.closePath(); ctx.fill();
    ctx.fillStyle="#e6d9bc"; ctx.fillRect(-10,-1.8,3,3.6);                 // crutch/filter
    ctx.strokeStyle="rgba(170,150,110,.55)"; ctx.lineWidth=0.8; ctx.beginPath(); ctx.moveTo(-6,-0.9); ctx.lineTo(6,-2.4); ctx.stroke();
    // twisted burning tip + ember glow
    ctx.fillStyle="#3a2a1a"; ctx.beginPath(); ctx.moveTo(7,-3.6); ctx.lineTo(11,0); ctx.lineTo(7,3.6); ctx.closePath(); ctx.fill();
    ctx.shadowColor="#ff7a2a"; ctx.shadowBlur=8; ctx.fillStyle= frameCount%6<3?"#ff9b2a":"#ff5a1a";
    ctx.beginPath(); ctx.arc(8.5,0,2.6,0,6.28); ctx.fill(); ctx.shadowBlur=0;
    ctx.restore();
  }
}
function drawBossShots(){
  for(const b of bossShots){
    if (b.x<cam.x-30||b.x>camRightX()) continue;
    ctx.save(); ctx.translate(b.x,b.y);
    ctx.shadowColor="#ff5a2a"; ctx.shadowBlur=9;
    ctx.fillStyle="#ffe08a"; ctx.beginPath(); ctx.arc(0,0,3.6,0,6.28); ctx.fill();
    ctx.fillStyle="#ff5a2a"; ctx.beginPath(); ctx.arc(0,0,1.9,0,6.28); ctx.fill();
    ctx.shadowBlur=0; ctx.restore();
  }
}

// ----- enemies -----
function drawEnemies(){
  for(const e of enemies){ if(e.x<cam.x-80||e.x>camRightX())continue; if(e.boss) drawBoss(e); else drawCop(e); }
}
function drawCop(e){
  const x=e.x,y=e.y,w=e.w,h=e.h;
  const dead=e.dead;
  ctx.save();
  if(dead){ const sq=clamp(e.squish/10,0,1); ctx.translate(0,h*sq*0.5); ctx.translate(x+w/2,y+h); ctx.scale(1,1-sq*0.7); ctx.translate(-(x+w/2),-(y+h)); }
  // shadow
  ctx.fillStyle="rgba(0,0,0,.18)"; ctx.beginPath(); ctx.ellipse(x+w/2,y+h+2,w*.5,5,0,0,6.28); ctx.fill();
  const isDealer=e.type==="dealer";
  if (isDealer){
    ctx.fillStyle="#3a3140"; ctx.fillRect(x+4,y+16,w-8,h-16);
    ctx.fillStyle="#2b2430"; ctx.fillRect(x+4,y+16,(w-8)/2,h-16);
    ctx.fillStyle="#caa07a"; ctx.beginPath(); ctx.arc(x+w/2,y+12,11,0,6.28); ctx.fill();
    ctx.fillStyle="#7a1f1f"; ctx.beginPath(); ctx.arc(x+w/2,y+9,11,Math.PI,0); ctx.fill(); ctx.fillRect(x+w/2-11,y+8,22,4);
    ctx.fillStyle="#111"; ctx.fillRect(x+w/2-9,y+10,18,5);
  } else {
    // police: navy uniform, badge, cap
    const aggro=e.type==="cop_aggro", big=e.type==="cop_big";
    ctx.fillStyle= aggro?"#15294f":"#1d3a6e"; ctx.fillRect(x+4,y+16,w-8,h-16);
    ctx.fillStyle="rgba(255,255,255,.12)"; ctx.fillRect(x+4,y+16,(w-8)/2,h-16);
    // belt
    ctx.fillStyle="#0a0a0a"; ctx.fillRect(x+4,y+h-16,w-8,5);
    // badge
    ctx.fillStyle="#ffd54a"; ctx.fillRect(x+8,y+22,5,5);
    // head
    ctx.fillStyle="#d3a984"; ctx.beginPath(); ctx.arc(x+w/2,y+12,10,0,6.28); ctx.fill();
    // cap
    ctx.fillStyle= aggro?"#0c1a36":"#14305c"; ctx.beginPath(); ctx.arc(x+w/2,y+8,11,Math.PI,0); ctx.fill(); ctx.fillRect(x+w/2-12,y+7,24,4);
    ctx.fillStyle="#ffd54a"; ctx.fillRect(x+w/2-4,y+4,8,2);
    // shades / angry
    ctx.fillStyle="#111"; ctx.fillRect(x+w/2-8,y+10,16,4);
    if (big){ ctx.strokeStyle="rgba(255,255,255,.5)"; ctx.lineWidth=2; ctx.strokeRect(x+5,y+18,w-10,h-22); } // riot armor
    if (aggro){ ctx.fillStyle="#ff5a5a"; ctx.fillRect(x+w/2-8,y+9,3,2); ctx.fillRect(x+w/2+5,y+9,3,2); } // angry brows
    // arms
    ctx.fillStyle= aggro?"#15294f":"#1d3a6e"; ctx.fillRect(x+(e.vx>0?w-7:1),y+18,6,15);
  }
  if (dead){ ctx.strokeStyle="#fff"; ctx.lineWidth=2; const cxp=x+w/2;
    ctx.beginPath(); ctx.moveTo(cxp-6,y+8); ctx.lineTo(cxp-2,y+12); ctx.moveTo(cxp-2,y+8); ctx.lineTo(cxp-6,y+12); ctx.stroke(); }
  ctx.restore();
  if (e.hp>1 && !dead){ ctx.fillStyle="#000"; ctx.fillRect(x,y-8,w,4); ctx.fillStyle="#ff5a5a"; ctx.fillRect(x,y-8,w*(e.hp/2),4); }
}
function drawBoss(e){
  const x=e.x,y=e.y,w=e.w,h=e.h, dead=e.dead;
  ctx.save();
  if(dead){ const sq=clamp(e.squish/10,0,1); ctx.translate(x+w/2,y+h); ctx.scale(1,1-sq*0.6); ctx.translate(-(x+w/2),-(y+h)); }
  ctx.fillStyle="rgba(0,0,0,.22)"; ctx.beginPath(); ctx.ellipse(x+w/2,y+h+2,w*.5,6,0,0,6.28); ctx.fill();
  // white suit
  ctx.fillStyle="#f0ece2"; ctx.fillRect(x+6,y+22,w-12,h-22);
  ctx.fillStyle="#d8d2c4"; ctx.fillRect(x+6,y+22,(w-12)/2,h-22);
  // gold chains
  ctx.strokeStyle="#ffd54a"; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(x+w/2,y+28,10,0.1,Math.PI-0.1); ctx.stroke();
  ctx.fillStyle="#ffd54a"; ctx.fillRect(x+w/2-3,y+36,6,6);
  // head + big hat
  ctx.fillStyle="#caa07a"; ctx.beginPath(); ctx.arc(x+w/2,y+16,13,0,6.28); ctx.fill();
  ctx.fillStyle="#2a1d12"; ctx.fillRect(x+w/2-20,y+6,40,5); ctx.fillRect(x+w/2-12,y-2,24,9);
  ctx.fillStyle="#7a1f1f"; ctx.fillRect(x+w/2-20,y+5,40,2);
  // shades + cigar
  ctx.fillStyle="#111"; ctx.fillRect(x+w/2-10,y+13,20,5);
  ctx.fillStyle="#7a4a22"; ctx.fillRect(x+w/2+6,y+22,12,3); ctx.fillStyle="#ff7a2a"; ctx.fillRect(x+w/2+18,y+22,3,3);
  if(!dead){ ctx.fillStyle="rgba(255,255,255,.5)"; ctx.beginPath(); ctx.arc(x+w/2+24,y+18-Math.sin(frameCount*0.12)*3,3,0,6.28); ctx.fill(); }
  // pistol + muzzle flash when shooting
  if(!dead){ const gy0=y+h*0.42, gx0=x-2; ctx.fillStyle="#222"; ctx.fillRect(gx0-8,gy0-2,10,5);
    if(e.muzzle>0){ ctx.fillStyle="#ffd24a"; ctx.beginPath(); ctx.moveTo(gx0-8,gy0); ctx.lineTo(gx0-18,gy0-4); ctx.lineTo(gx0-14,gy0); ctx.lineTo(gx0-18,gy0+4); ctx.closePath(); ctx.fill(); } }
  ctx.restore();
  // hp bar + crown label
  if(!dead){ const mh=e.maxHp||6; ctx.fillStyle="#000"; ctx.fillRect(x-4,y-12,w+8,5); ctx.fillStyle="#ff4d4d"; ctx.fillRect(x-4,y-12,(w+8)*clamp(e.hp/mh,0,1),5);
    ctx.fillStyle="#ffd54a"; ctx.font="bold 10px 'Trebuchet MS'"; ctx.textAlign="center"; ctx.fillText("NARCO BOSS",x+w/2,y-16); ctx.textAlign="left"; }
}

// ----- player (skins + animation) -----
function drawPlayer(){
  const p=player;
  if (hitTimer>0 && Math.floor(frameCount/4)%2===0 && starTimer<=0) return;
  const inv=starTimer>0, boosted=speedTimer>0, flying=flyTimer>0;
  const sk=curSkin();
  let body=sk.body, dark=sk.dark, belly=sk.belly;
  if (inv){ const h=(frameCount*14)%360; body=`hsl(${h} 75% 50%)`; dark=`hsl(${h} 75% 38%)`; belly=`hsl(${(h+40)%360} 80% 75%)`; }
  else if (isChromatic(sk)){
    // metallic base tints so the silhouette still reads where the gradient doesn't cover
    const h=(frameCount*1.6)%360;
    body=`hsl(${h} 60% 60%)`; dark=`hsl(${h} 55% 38%)`; belly=`hsl(${(h+40)%360} 50% 86%)`;
  }
  else if (sk.id==="rainbow"){ const h=(frameCount*5)%360; body=`hsl(${h} 85% 60%)`; dark=`hsl(${h} 85% 45%)`; belly=`hsl(${(h+50)%360} 90% 80%)`; }

  ctx.fillStyle="rgba(0,0,0,.2)"; ctx.beginPath(); ctx.ellipse(p.x+p.w/2,p.y+p.h+2,p.w*.45,6,0,0,6.28); ctx.fill();

  // 🪽 flight wings (drawn behind the body)
  if (flying){
    const flap=Math.sin(frameCount*0.4)*0.6;
    const fade = (flyTimer<70 && Math.floor(frameCount/6)%2===0) ? 0.5 : 1;
    ctx.save(); ctx.globalAlpha=fade; ctx.translate(p.x+p.w/2, p.y+p.h*0.5);
    ctx.shadowColor="rgba(200,235,255,.7)"; ctx.shadowBlur=10; ctx.fillStyle="#eaf6ff"; ctx.strokeStyle="rgba(150,200,235,.8)"; ctx.lineWidth=1;
    for(const s of [-1,1]){ ctx.save(); ctx.scale(s,1); ctx.rotate(flap*0.3);
      ctx.beginPath(); ctx.moveTo(2,-4);
      ctx.quadraticCurveTo(22,-22+flap*10,34,-4); ctx.quadraticCurveTo(24,-2,30,8);
      ctx.quadraticCurveTo(18,2,20,14); ctx.quadraticCurveTo(10,4,2,8); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.restore(); }
    ctx.shadowBlur=0; ctx.restore();
  }

  // squash & stretch
  const st = p.squash>0 ? 0.86 : p.stretch;
  const sw = 1/Math.sqrt(st), sh = st;
  ctx.save();
  ctx.translate(p.x+p.w/2, p.y+p.h);
  ctx.scale(p.facing*sw, sh);
  ctx.translate(-p.w/2, -p.h);

  const w=p.w,h=p.h;
  const breath=Math.sin(frameCount*0.08)*0.6;
  const legA=p.onGround?Math.sin(p.runPhase)*7:6, legB=p.onGround?Math.sin(p.runPhase+Math.PI)*7:6;
  const run=p.onGround?Math.sin(p.runPhase)*1:0;

  // tail
  ctx.fillStyle=body; ctx.beginPath(); ctx.moveTo(2,h-22); ctx.quadraticCurveTo(-16,h-18,-20,h-30+run*2); ctx.quadraticCurveTo(-10,h-24,6,h-16); ctx.closePath(); ctx.fill();
  // legs
  ctx.fillStyle=dark; ctx.fillRect(w*0.32-4,h-16,9,16+legA);
  ctx.fillStyle=body; ctx.fillRect(w*0.55-4,h-16,9,16+legB);
  ctx.fillStyle=dark; ctx.fillRect(w*0.30-6,h-2+legA,14,5); ctx.fillRect(w*0.53-6,h-2+legB,14,5);
  // body
  if (isChromatic(sk)){ ctx.fillStyle=chromaFill(2,14+breath, w-4,h-12+breath, frameCount*0.05); } else ctx.fillStyle=body;
  roundRect(2,14+breath,w-6,h-26,10); ctx.fill();
  ctx.fillStyle=belly; roundRect(8,22+breath,w-20,h-34,8); ctx.fill();
  ctx.fillStyle=dark; for(let yy=26;yy<h-16;yy+=8) ctx.fillRect(11,yy+breath,w-26,1.5);
  // tiny arm
  ctx.fillStyle=dark; ctx.fillRect(w-16,26,9,5); ctx.fillRect(w-9,28,4,6);
  // head
  ctx.fillStyle = isChromatic(sk) ? chromaFill(w-26,0+breath, w+4,24+breath, frameCount*0.05+1.0) : body;
  roundRect(w-26,0+breath,30,24,9); ctx.fill();
  ctx.fillRect(w-4,8+breath,12,12);
  ctx.fillStyle=dark; ctx.fillRect(w+4,12+breath,4,2);
  ctx.fillStyle="#fff"; for(let i=0;i<4;i++) ctx.fillRect(w-2+i*3,19+breath,2,3);
  ctx.fillStyle="#fff"; ctx.beginPath(); ctx.arc(w-8,9+breath,5,0,6.28); ctx.fill();
  ctx.fillStyle="#111"; if(p.blink>210) ctx.fillRect(w-12,9+breath,8,1.6); else { ctx.beginPath(); ctx.arc(w-6,9+breath,2.4,0,6.28); ctx.fill(); }
  // back spikes
  ctx.fillStyle=dark; for(let i=0;i<3;i++){ const sx=10+i*9; ctx.beginPath(); ctx.moveTo(sx,14+breath); ctx.lineTo(sx+5,6+breath); ctx.lineTo(sx+10,14+breath); ctx.fill(); }
  // accessory (skin)
  drawAccessory(sk.acc, w, breath);
  if (isChromatic(sk)){                       // moving highlight streak + sparkle twinkle
    ctx.save(); ctx.globalAlpha=0.55; ctx.globalCompositeOperation="lighter";
    const gx=2 + ((Math.sin(frameCount*0.05)*0.5+0.5))*(w-10);
    ctx.fillStyle="rgba(255,255,255,0.9)";
    ctx.fillRect(gx, 16+breath, 3, h-30);
    if (frameCount%18<9){ ctx.fillRect(w-12,20+breath,2,2); ctx.fillRect(w-20,30+breath,2,2); }
    ctx.restore();
  }
  ctx.restore();

  if (boosted){ ctx.strokeStyle=`rgba(124,252,106,${0.4+0.3*Math.sin(frameCount*0.4)})`; ctx.lineWidth=3; ctx.beginPath(); ctx.ellipse(p.x+p.w/2,p.y+p.h/2,p.w*0.8,p.h*0.7,0,0,6.28); ctx.stroke(); }
  if (ammo>0){ // cannon strapped on back
    ctx.fillStyle="#3a3a3a"; ctx.save(); ctx.translate(p.x+(p.facing>0?6:p.w-22),p.y+22); ctx.fillRect(0,0,18,7); ctx.restore(); }
}
function drawAccessory(acc,w,breath){
  const yb=breath;
  if (acc==="rasta"){ ctx.fillStyle="#d33"; ctx.fillRect(w-26,1+yb,30,4); ctx.fillStyle="#fc3"; ctx.fillRect(w-26,5+yb,30,3); ctx.fillStyle="#2c2"; ctx.fillRect(w-26,8+yb,30,2); }
  else if (acc==="crown"){ ctx.fillStyle="#ffd54a"; ctx.beginPath(); ctx.moveTo(w-24,2+yb); ctx.lineTo(w-22,-6+yb); ctx.lineTo(w-16,1+yb); ctx.lineTo(w-10,-7+yb); ctx.lineTo(w-4,1+yb); ctx.lineTo(w-2,-5+yb); ctx.lineTo(w-1,3+yb); ctx.lineTo(w-25,3+yb); ctx.closePath(); ctx.fill(); ctx.fillStyle="#ff5a5a"; ctx.fillRect(w-12,-4+yb,3,3); }
  else if (acc==="halo"){ ctx.strokeStyle="#fff05a"; ctx.lineWidth=3; ctx.beginPath(); ctx.ellipse(w-11,-6+yb,11,4,0,0,6.28); ctx.stroke(); }
  else if (acc==="shades"){ ctx.fillStyle="#111"; ctx.fillRect(w-16,7+yb,16,5); ctx.fillStyle="#42e8ff"; ctx.fillRect(w-15,8+yb,5,3); }
  else if (acc==="cyber"){ ctx.fillStyle="#0ff"; ctx.shadowColor="#0ff"; ctx.shadowBlur=8; ctx.fillRect(w-18,6+yb,18,4); ctx.shadowBlur=0; ctx.fillStyle="#fff"; ctx.fillRect(w-6,3+yb,2,18); }
  else if (acc==="horns"){ ctx.fillStyle="#c0341d"; ctx.beginPath(); ctx.moveTo(w-22,2+yb); ctx.lineTo(w-26,-7+yb); ctx.lineTo(w-18,1+yb); ctx.fill(); ctx.beginPath(); ctx.moveTo(w-8,2+yb); ctx.lineTo(w-4,-7+yb); ctx.lineTo(w-12,1+yb); ctx.fill(); }
  else if (acc==="brain"){ ctx.fillStyle="#ff9ec2"; for(const dx of [-22,-15,-8]){ ctx.beginPath(); ctx.arc(w+dx+2,-1+yb,4,0,6.28); ctx.fill(); } ctx.strokeStyle="#c75d86"; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(w-22,-1+yb); ctx.quadraticCurveTo(w-15,-5+yb,w-8,-1+yb); ctx.stroke(); ctx.fillStyle="#cfd8a0"; ctx.fillRect(w+2,9+yb,3,4); /* bolt */ ctx.fillStyle="#888"; ctx.fillRect(w+6,10+yb,4,2); }
  else if (acc==="ice"){ ctx.fillStyle="#dff4ff"; for(const dx of [-22,-15,-8,-1]){ ctx.beginPath(); ctx.moveTo(w+dx,2+yb); ctx.lineTo(w+dx+3,-9+yb); ctx.lineTo(w+dx+6,2+yb); ctx.fill(); } ctx.fillStyle="#7fd4ff"; ctx.fillRect(w-24,2+yb,26,2); }
  else if (acc==="galaxy"){ const h=(frameCount*3)%360; for(let i=0;i<4;i++){ const a=frameCount*0.06+i*1.57; ctx.fillStyle=`hsl(${(h+i*60)%360} 90% 70%)`; ctx.beginPath(); ctx.arc(w-12+Math.cos(a)*13, -4+yb+Math.sin(a)*6, 1.8,0,6.28); ctx.fill(); } ctx.fillStyle="#fff"; ctx.fillRect(w-13,-5+yb,2,2); }
  else if (acc==="diamond"){ ctx.save(); ctx.translate(w-11,-4+yb); ctx.fillStyle="#bff7ff"; ctx.beginPath(); ctx.moveTo(0,-7); ctx.lineTo(5,-1); ctx.lineTo(0,7); ctx.lineTo(-5,-1); ctx.closePath(); ctx.fill(); ctx.fillStyle="#fff"; if(frameCount%40<20){ctx.fillRect(-1,-3,2,2);} ctx.restore(); }
  else if (acc==="devil"){ ctx.fillStyle="#e23a2a"; ctx.beginPath(); ctx.moveTo(w-22,1+yb); ctx.quadraticCurveTo(w-30,-12+yb,w-20,-12+yb); ctx.quadraticCurveTo(w-22,-6+yb,w-16,0+yb); ctx.fill(); ctx.beginPath(); ctx.moveTo(w-6,1+yb); ctx.quadraticCurveTo(w+2,-12+yb,w-8,-12+yb); ctx.quadraticCurveTo(w-6,-6+yb,w-12,0+yb); ctx.fill(); ctx.fillStyle="#ffae33"; if(frameCount%30<15){ ctx.beginPath(); ctx.arc(w-15,-13+yb,2,0,6.28); ctx.arc(w-1,-13+yb,2,0,6.28); ctx.fill(); } }
  else if (acc==="trippy"){ const h=(frameCount*9)%360; ctx.fillStyle=`hsl(${h} 90% 60%)`; ctx.fillRect(w-26,1+yb,30,3); ctx.fillStyle=`hsl(${(h+120)%360} 90% 60%)`; ctx.fillRect(w-26,4+yb,30,3); ctx.fillStyle=`hsl(${(h+240)%360} 90% 60%)`; ctx.fillRect(w-26,7+yb,30,2); ctx.strokeStyle=`hsl(${(h+60)%360} 90% 70%)`; ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(w-11,-5+yb,4+Math.sin(frameCount*0.2)*1.5,0,6.28); ctx.stroke(); }
}

// ----- hanging cinematic (long + proper; skinned victim; two cops shooting) -----
function drawHanging(){
  const x=hangX, gy=GROUND_TOP, t=hangTimer;
  const grow=clamp(t/46,0,1);
  const cy=gy-210*grow;                       // canopy height
  const bx=x+54, by=HANG_BODY_Y;              // body anchor
  ctx.save();

  // weed TREE
  ctx.fillStyle="#5a3a1a"; ctx.fillRect(x-9, cy, 18, gy-cy);
  ctx.fillStyle="#4a2f15"; ctx.fillRect(x-9, cy, 5, gy-cy);
  for(let i=0;i<12;i++){ const a=i/12*6.28, r=52*grow; ctx.save(); ctx.translate(x+Math.cos(a)*r*0.62, cy+Math.sin(a)*r*0.5); ctx.scale(grow,grow);
    ctx.fillStyle= i%2?"#2f7d32":"#3aa53a"; bigLeaf(); ctx.restore(); }
  ctx.fillStyle="#256025"; ctx.beginPath(); ctx.arc(x,cy,44*grow,0,6.28); ctx.fill();

  if (grow>=1){
    // branch
    ctx.strokeStyle="#5a3a1a"; ctx.lineWidth=9; ctx.lineCap="round"; ctx.beginPath(); ctx.moveTo(x,cy+8); ctx.lineTo(bx,cy-2); ctx.stroke(); ctx.lineCap="butt";

    const settle=clamp((t-46)/40,0,1);
    const alive = t<300, fading = t>=300 && t<450, limp = t>=450;
    const sway = alive? Math.sin(t*0.18)*0.16 : limp? Math.sin(t*0.05)*0.07 : Math.sin(t*0.10)*0.10;
    const bodyY = (cy-2) + (by-(cy-2))*settle;
    const swayX = Math.sin(sway)*18;

    // rope branch → neck
    ctx.strokeStyle="#c9a86a"; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(bx,cy-2); ctx.lineTo(bx+swayX, bodyY-30); ctx.stroke();

    // dangling SKINNED character
    ctx.save(); ctx.translate(bx+swayX, bodyY); ctx.rotate(sway);
    const sk=curSkin();
    let body=sk.body, dark=sk.dark, belly=sk.belly;
    if (sk.id==="rainbow"){ const h=(t*5)%360; body=`hsl(${h} 85% 60%)`; dark=`hsl(${h} 85% 45%)`; belly=`hsl(${(h+50)%360} 90% 80%)`; }
    // tail
    ctx.fillStyle=body; ctx.beginPath(); ctx.moveTo(-14,-6); ctx.quadraticCurveTo(-30,-2,-34,-12); ctx.quadraticCurveTo(-22,-8,-10,2); ctx.fill();
    // legs (kick → twitch → dangle)
    const k = alive? Math.sin(t*0.5)*9 : fading? Math.sin(t*0.25)*4 : 1.5;
    ctx.fillStyle=dark; ctx.fillRect(-12,2,7,18+k); ctx.fillRect(2,2,7,18-k);
    ctx.fillStyle=dark; ctx.fillRect(-13,18+k,11,5); ctx.fillRect(1,18-k,11,5);
    // body + belly
    ctx.fillStyle=body; roundRect(-16,-30,30,34,9); ctx.fill();
    ctx.fillStyle=belly; roundRect(-12,-22,18,26,7); ctx.fill();
    // little arms (flail when alive)
    const arm = Math.sin(t*0.6)*10;
    ctx.fillStyle=dark; ctx.fillRect(-19,-18,6,5+(alive?Math.max(0,arm):0)); ctx.fillRect(13,-18,6,5+(alive?Math.max(0,-arm):0));
    // head
    ctx.fillStyle=body; roundRect(2,-46,28,22,8); ctx.fill();
    if (alive){
      ctx.fillStyle="#fff"; ctx.beginPath(); ctx.arc(20,-37,4,0,6.28); ctx.fill(); ctx.fillStyle="#111"; ctx.beginPath(); ctx.arc(21,-37,2,0,6.28); ctx.fill();
      if (t%16<8){ ctx.fillStyle="rgba(180,220,255,.85)"; ctx.beginPath(); ctx.arc(8,-44,3,0,6.28); ctx.fill(); }
    } else {
      ctx.strokeStyle="#111"; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(16,-40); ctx.lineTo(22,-34); ctx.moveTo(22,-40); ctx.lineTo(16,-34); ctx.stroke();
      ctx.fillStyle="#ff5a8a"; ctx.fillRect(24,-32,4,9);
    }
    // skin accessory on the head
    ctx.save(); ctx.translate(0,-46); drawAccessory(sk.acc, 30, 0); ctx.restore();
    // noose loop
    ctx.strokeStyle="#c9a86a"; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(16,-48,7,0,6.28); ctx.stroke();
    // spirit leaving (limp)
    if (limp && t%24<12){ ctx.fillStyle="rgba(200,235,255,.7)"; ctx.beginPath(); ctx.arc(24,-58-(t%48),4,0,6.28); ctx.fill(); }
    ctx.restore();

    // 👮👮 two cops shooting up at the body
    const firing = (t>=HANG_FIRE_FROM && t<=HANG_FIRE_TO && (t-HANG_FIRE_FROM)%HANG_FIRE_EVERY < 4);
    drawHangCop(x-30, gy, bx+swayX, bodyY-4, firing, 1);
    drawHangCop(x+134, gy, bx+swayX, bodyY-4, firing, -1);
  }
  ctx.restore();
}
function drawHangCop(cx, gy, aimWX, aimWY, firing, facing){

  ctx.restore();

  ctx.restore();
}
function bigLeaf(){ ctx.beginPath(); for(let i=-3;i<=3;i++){ const a=i*0.4,len=18-Math.abs(i)*2; ctx.save?0:0; }
  // simple leaf cluster
  for(let i=-3;i<=3;i++){ const a=i*0.4,len=18-Math.abs(i)*2; ctx.save(); ctx.rotate(a); ctx.beginPath(); ctx.moveTo(0,2); ctx.quadraticCurveTo(-3,-len*.6,0,-len); ctx.quadraticCurveTo(3,-len*.6,0,2); ctx.fill(); ctx.restore(); } }

// ----- particles -----
function drawParticles(){
  for(const p of particles){ const a=clamp(p.life/p.max,0,1); ctx.globalAlpha=a; ctx.fillStyle=p.col;
    if(p.kind==="smoke"){ ctx.beginPath(); ctx.arc(p.x,p.y,p.r*(1.4-a*0.4),0,6.28); ctx.fill(); } else ctx.fillRect(p.x-p.r/2,p.y-p.r/2,p.r,p.r); }
  ctx.globalAlpha=1;
}

// ----- weather / ambiance (screen space) -----
function drawWeather(th){
  if (th.id==="lava"){ // embers
    ctx.fillStyle="rgba(255,140,40,.8)";
    for(let i=0;i<24;i++){ const x=((i*167 - frameCount*1.3)%VW+VW)%VW; const y=(VH - ((i*91 + frameCount*1.6)%VH)); ctx.fillRect(x,y,2,2); }
  }
  if (th.id==="desert"){ // sand haze sweep
    ctx.fillStyle="rgba(255,210,120,.05)"; ctx.fillRect(0,0,VW,VH);
  }
  if (th.id==="night"){ // light rain
    ctx.strokeStyle="rgba(150,200,255,.18)"; ctx.lineWidth=1;
    for(let i=0;i<40;i++){ const x=((i*97 - frameCount*6)%VW+VW)%VW; const y=((i*123 + frameCount*9)%VH); ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x-3,y+10); ctx.stroke(); }
  }
}
function drawVignette(th){
  const g=ctx.createRadialGradient(VW/2,VH/2,VH*0.45,VW/2,VH/2,VH*0.85);

// ----- escalating insanity (each level crazier) -----
function drawInsanity(){
  if (level<1) return;
  const lv=level, n=Math.min(64, lv*9);
  for(let i=0;i<n;i++){ const x=((i*131 + frameCount*(1+lv*0.25))%(VW+40))-20; const y=(((i*71 - frameCount*0.7)%VH)+VH)%VH;
    ctx.fillStyle=`hsla(${(i*37+frameCount*3)%360},90%,66%,0.5)`; ctx.fillRect(x,y,2,2); }
  if (lv>=3){ ctx.globalAlpha=0.04+0.03*Math.sin(frameCount*0.06); ctx.fillStyle=`hsl(${(frameCount*4)%360} 80% 50%)`; ctx.fillRect(0,0,VW,VH); ctx.globalAlpha=1; }
  if (lv>=5){ ctx.globalAlpha=0.05; for(let i=0;i<3;i++){ ctx.fillStyle=`hsl(${(frameCount*6+i*120)%360} 90% 60%)`; ctx.fillRect(0,(frameCount*4+i*180)%VH,VW,2);} ctx.globalAlpha=1; }
}
// ----- KUSH CASTLE (level transition) -----
function drawKushCastle(cx, baseY){
  ctx.save(); ctx.translate(cx, baseY);
  const W=300, wallH=148;
  const towers=[[-W/2-6, wallH+34, 46],[W/2-40, wallH+34, 46],[-24, wallH+78, 48]];
  for(const [tx,th,tw] of towers){
    ctx.fillStyle="#2a702c"; ctx.fillRect(tx,-th,tw,th);
    ctx.fillStyle="#256025"; for(let b=tx;b<tx+tw;b+=16) ctx.fillRect(b,-th-12,10,12);
    ctx.fillStyle="#e8c43a"; ctx.beginPath(); ctx.moveTo(tx-5,-th-12); ctx.lineTo(tx+tw/2,-th-46); ctx.lineTo(tx+tw+5,-th-12); ctx.closePath(); ctx.fill();
    ctx.strokeStyle="#cfd6dd"; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(tx+tw/2,-th-46); ctx.lineTo(tx+tw/2,-th-70); ctx.stroke();
    ctx.save(); ctx.translate(tx+tw/2,-th-64); ctx.scale(0.7,0.7); drawLeaf7(); ctx.restore();
    ctx.fillStyle="#11240f"; ctx.fillRect(tx+tw/2-5,-th+18,10,16);
  }
  ctx.fillStyle="#2f7d32"; ctx.fillRect(-W/2,-wallH,W,wallH);
  ctx.fillStyle="#256025"; ctx.fillRect(-W/2,-wallH,W,8);
  ctx.strokeStyle="rgba(0,0,0,.16)"; ctx.lineWidth=1; for(let yy=-wallH+16;yy<0;yy+=16){ ctx.beginPath(); ctx.moveTo(-W/2,yy); ctx.lineTo(W/2,yy); ctx.stroke(); }
  ctx.fillStyle="#2f7d32"; for(let b=-W/2;b<W/2;b+=30) ctx.fillRect(b,-wallH-14,18,14);
  const gx=-32, gw=64;
  ctx.fillStyle="#0e1f0c"; ctx.beginPath(); ctx.moveTo(gx,0); ctx.lineTo(gx,-46); ctx.quadraticCurveTo(0,-74,gx+gw,-46); ctx.lineTo(gx+gw,0); ctx.closePath(); ctx.fill();
  const glow=0.5+0.5*Math.sin(frameCount*0.2);
  ctx.fillStyle=`rgba(124,252,106,${0.2+0.4*glow})`; ctx.beginPath(); ctx.moveTo(gx+7,0); ctx.lineTo(gx+7,-42); ctx.quadraticCurveTo(0,-66,gx+gw-7,-42); ctx.lineTo(gx+gw-7,0); ctx.closePath(); ctx.fill();
  ctx.fillStyle="#ffd54a"; ctx.font="bold 20px 'Trebuchet MS'"; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText("KUSH",0,-wallH+24);
  ctx.textAlign="left"; ctx.textBaseline="alphabetic";
  ctx.restore();
}
// in-world castle gate (drawn in the world; player/enemies render on top, so nothing is hidden)
function drawCastleGate(p){ drawKushCastle(p.x+p.w/2, GROUND_TOP); }

function powerBar(x,y,label,frac,col){

function miniTrex(x,y){

}

// ----- chase mini-map (bottom-center): police vs you + nearby enemies -----
function drawMiniMap(){
  const bw=400, bh=30, bx=VW/2-bw/2, by=VH-44;
  const x0=chaseX-70, x1=player.x+560, span=Math.max(1,x1-x0);
  const toX=(wx)=> bx+clamp((wx-x0)/span,0,1)*bw;
  ctx.fillStyle="rgba(8,12,24,.62)"; roundRect(bx-8,by-8,bw+16,bh+16,10); ctx.fill();
  // track line
  ctx.fillStyle="rgba(255,255,255,.10)"; roundRect(bx,by+bh/2-3,bw,6,3); ctx.fill();
  // red danger zone trailing the police
  const pX=toX(chaseX), meX=toX(player.x);
  const dg=ctx.createLinearGradient(bx,0,Math.max(pX,bx+1),0);
  dg.addColorStop(0,"rgba(255,40,40,.55)"); dg.addColorStop(1,"rgba(255,40,40,0)");
  ctx.fillStyle=dg; ctx.fillRect(bx,by,Math.max(0,pX-bx),bh);
  // nearby enemies / boss as dots
  for(const e of enemies){ if(e.dead) continue; if(e.x<x0||e.x>x1) continue;
    const ex=toX(e.x); ctx.fillStyle=e.boss?"#ffd54a":"#ff8a8a"; const r=e.boss?5:3;
    ctx.beginPath(); ctx.arc(ex,by+bh/2,r,0,6.28); ctx.fill();
    if(e.boss){ ctx.font="11px serif"; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText("👑",ex,by+bh/2-9); }
  }
  // pickups hint (stars) so you can see goals coming
  for(const s of stars){ if(s.taken) continue; if(s.x<x0||s.x>x1) continue; const sxp=toX(s.x);
    ctx.fillStyle="#ff7bd0"; ctx.beginPath(); ctx.arc(sxp,by+bh/2,2.5,0,6.28); ctx.fill(); }
  // markers
  ctx.font="17px serif"; ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.fillText("🚓", pX, by+bh/2);
  ctx.fillText("🦖", meX, by+bh/2);
  // labels
  ctx.textBaseline="alphabetic"; ctx.font="bold 10px 'Trebuchet MS'";
  ctx.textAlign="left"; ctx.fillStyle="#ff7a7a"; ctx.fillText("CHASE", bx, by-11);
  const gapM=Math.max(0,Math.floor((player.x-chaseX)/10));
  ctx.textAlign="right"; ctx.fillStyle= gapM<8?"#ff3a3a":(gapM<24?"#ffd54a":"#9fe89f");
  ctx.fillText(gapM+" m ahead", bx+bw, by-11); ctx.textAlign="left";
}
