// ===================== KUSH RUSH logo (Kuala Lumpur style) =====================
function drawLeaf7(){                 // 7-leaflet cannabis leaf, pointing up, ~46px tall
  ctx.fillStyle="#33a83f";
  for(let i=-3;i<=3;i++){ const a=i*0.34, len=22-Math.abs(i)*4.4; ctx.save(); ctx.rotate(a);
    ctx.beginPath(); ctx.moveTo(0,3); ctx.quadraticCurveTo(-2.6,-len*0.55,0,-len); ctx.quadraticCurveTo(2.6,-len*0.55,0,3); ctx.fill(); ctx.restore(); }
  ctx.strokeStyle="#1d6b27"; ctx.lineWidth=0.9;
  for(let i=-3;i<=3;i++){ const a=i*0.34,len=22-Math.abs(i)*4.4; ctx.save(); ctx.rotate(a); ctx.beginPath(); ctx.moveTo(0,3); ctx.lineTo(0,-len+3); ctx.stroke(); ctx.restore(); }
}
function drawTowerSil(x, baseY, h, col, lit){
  ctx.fillStyle=col; let y=baseY, w=h*0.18;
  for(let i=0;i<5;i++){ const seg=h/5; ctx.fillRect(x-w/2, y-seg, w, seg+0.6);
    if(lit){ ctx.fillStyle="rgba(255,235,160,.7)"; for(let r=0;r<3;r++) ctx.fillRect(x-w/2+2+r*(w-4)/3, y-seg+2, 1.4, seg-4); ctx.fillStyle=col; }
    y-=seg; w*=0.8; }
  ctx.fillStyle=lit?"#ffe9a6":col; ctx.fillRect(x-1.4, y-h*0.16, 2.8, h*0.16);
  ctx.beginPath(); ctx.arc(x, y-h*0.045, 2.6, 0, 6.28); ctx.fill();
}
function drawKLSkyline(lit){          // twin towers + skybridge, centered at origin (bases ~y 92)
  const baseY=92, h=148, tx=42;
  drawTowerSil(-tx, baseY, h, "#8fb0c6", lit); drawTowerSil(tx, baseY, h, "#8fb0c6", lit);
  const sb=baseY-h*0.46;             // skybridge deck
  ctx.fillStyle="#b9d2e2"; ctx.fillRect(-tx, sb, tx*2, 4);
  ctx.strokeStyle="#b9d2e2"; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(-tx+4,baseY-2); ctx.lineTo(-6,sb); ctx.moveTo(tx-4,baseY-2); ctx.lineTo(6,sb); ctx.stroke();
}
function drawLogo(cx, cy, s, t){
  ctx.save(); ctx.translate(cx, cy); ctx.scale(s, s);
  // skyline backdrop
  ctx.save(); ctx.globalAlpha=0.55; ctx.translate(0, 6); drawKLSkyline(true); ctx.restore();
  ctx.textAlign="center"; ctx.textBaseline="middle";
  // "THE"
  ctx.fillStyle="#ffd54a"; ctx.font="bold 22px 'Trebuchet MS'"; ctx.fillText("T H E", 0, -96);
  const glow=14+Math.sin(t*0.13)*7;
  // KUSH — green/gold
  const g1=ctx.createLinearGradient(0,-86,0,-18); g1.addColorStop(0,"#d6ff8a"); g1.addColorStop(.55,"#7CFC6A"); g1.addColorStop(1,"#239b3e");
  ctx.shadowColor="rgba(124,252,106,.75)"; ctx.shadowBlur=glow; ctx.fillStyle=g1; ctx.font="bold 92px 'Trebuchet MS'";
  ctx.fillText("KUSH", -4, -50);
  // RUSH — gold/red
  const g2=ctx.createLinearGradient(0,4,0,76); g2.addColorStop(0,"#ffe680"); g2.addColorStop(.5,"#ffac33"); g2.addColorStop(1,"#ff4f2a");
  ctx.shadowColor="rgba(255,150,40,.8)"; ctx.fillStyle=g2; ctx.fillText("RUSH", 4, 46);
  ctx.shadowBlur=0;
  ctx.lineWidth=2.4; ctx.strokeStyle="rgba(8,20,10,.5)"; ctx.strokeText("KUSH",-4,-50); ctx.strokeText("RUSH",4,46);
  // spinning leaf badge in the middle
  ctx.save(); ctx.translate(118,-2); ctx.rotate(Math.sin(t*0.06)*0.4); ctx.scale(1.5,1.5); drawLeaf7(); ctx.restore();
  ctx.save(); ctx.translate(-118,-2); ctx.rotate(-Math.sin(t*0.06)*0.4); ctx.scale(1.5,1.5); drawLeaf7(); ctx.restore();
  ctx.restore();
}

// ===================== intro splash =====================
let introT = 0;
const easeOutBack=(x)=>{ const c=2.2; return 1+ (c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2); };
function drawIntro(){
  const g=ctx.createLinearGradient(0,0,0,VH); g.addColorStop(0,"#0a2114"); g.addColorStop(.6,"#06120b"); g.addColorStop(1,"#030704");
  ctx.fillStyle=g; ctx.fillRect(0,0,VW,VH);
  // searchlights
  ctx.save(); ctx.globalAlpha=0.12;
  for(let i=0;i<3;i++){ const a=Math.sin(introT*0.02+i*2)*0.5; ctx.fillStyle=i?"#7CFC6A":"#ffd54a";
    ctx.beginPath(); ctx.moveTo(VW/2,VH+40); ctx.lineTo(VW/2+Math.cos(a-1.6)*900, -40); ctx.lineTo(VW/2+Math.cos(a-1.4)*900,-40); ctx.closePath(); ctx.fill(); }
  ctx.restore();
  // falling kush leaves
  for(let i=0;i<22;i++){ const x=((i*149 + introT*1.2)%(VW+60))-30; const y=((i*83 + introT*2.4)%(VH+60))-30;
    ctx.save(); ctx.translate(x,y); ctx.rotate(introT*0.03+i); ctx.globalAlpha=0.5; ctx.scale(0.5,0.5); drawLeaf7(); ctx.restore(); }
  // logo slam-in (scaled to fit the screen width)
  const appear=clamp(introT/34,0,1);
  const sc=Math.min(1, VW/620)*easeOutBack(appear);
  const a=clamp(introT/16,0,1);
  ctx.save(); ctx.globalAlpha=a; drawLogo(VW/2, VH/2-26, Math.max(0.05,sc), introT); ctx.restore();
  if (introT>40){ ctx.globalAlpha=clamp((introT-40)/24,0,1); ctx.textAlign="center";
    ctx.fillStyle="#cfe0ff"; ctx.font="bold 18px 'Trebuchet MS'"; ctx.fillText("KUALA LUMPUR · MOST WANTED", VW/2, VH/2+118); ctx.globalAlpha=1; }
  if (introT>78){ ctx.globalAlpha=0.55+0.45*Math.sin(introT*0.16); ctx.textAlign="center";
    ctx.fillStyle="#fff"; ctx.font="bold 16px 'Trebuchet MS'"; ctx.fillText("tap / press ENTER", VW/2, VH-46); ctx.globalAlpha=1; ctx.textAlign="left"; }
  if (introT>250) G.scene="title";
}

// shared high-score list renderer (title + game over)
function drawBoardRows(x, y, w, count, hiName){
  const rows = Board.cache.slice(0, count);
  if (!rows.length){
    ctx.textAlign="center"; ctx.fillStyle="#8fa6c8"; ctx.font="14px 'Trebuchet MS'";
    ctx.fillText(Board.status==="loading"?"Loading scores…":"No scores yet — be the first! 🌿", x+w/2, y+16);
    ctx.textAlign="left"; return;
  }
  const rh=22, sm=w<320;
  const distW=sm?36:52, kushW=sm?44:58;   // right-side columns (from the right edge): dist, kush, then TOTAL
  for (let i=0;i<rows.length;i++){
    const r=rows[i], ry=y+i*rh+13, me=hiName&&r.name===hiName;
    if (me){ ctx.fillStyle="rgba(124,252,106,.20)"; roundRect(x-8,ry-15,w+16,20,6); ctx.fill(); }
    ctx.textAlign="left";
    ctx.fillStyle = i===0?"#ffd54a":i===1?"#cfd8e8":i===2?"#e0a878":"#9fb4d6";
    ctx.font="bold "+(sm?12:15)+"px 'Trebuchet MS'"; ctx.fillText((i+1)+".", x, ry);
    ctx.fillStyle = me?"#eaffea":"#fff"; ctx.font=(sm?12:15)+"px 'Trebuchet MS'"; ctx.fillText((r.name||"???").slice(0,10), x+(sm?20:26), ry);
    ctx.textAlign="right";
    ctx.fillStyle="#8fa6c8"; ctx.font=(sm?10:12)+"px 'Trebuchet MS'"; ctx.fillText((r.dist||0)+"m", x+w, ry);                                  // distance
    ctx.fillStyle="#9fe89f"; ctx.font="bold "+(sm?11:13)+"px 'Trebuchet MS'"; ctx.fillText(r.score+"🌿", x+w-distW, ry);                       // kush
    ctx.fillStyle="#ffd54a"; ctx.font="bold "+(sm?13:16)+"px 'Trebuchet MS'"; ctx.fillText(String(Math.round(Board.rankVal(r))), x+w-distW-kushW, ry); // TOTAL points (yellow)
    ctx.textAlign="left";
  }
}

function drawTitle(){
  ctx.fillStyle="rgba(6,10,20,.55)"; ctx.fillRect(0,0,VW,VH);
  const wide = VW>=600;
  const pad=18, w=Math.min(wide?920:460, VW-2*pad), x0=(VW-w)/2, cx=VW/2;
  panel(x0, 12, w, VH-24);
  drawLogo(cx, wide?78:60, Math.min(wide?0.5:0.42, w/(wide?1060:560)), frameCount);
  ctx.textAlign="center"; ctx.fillStyle="#dfe9ff"; ctx.font=(wide?"12px":"10px")+" 'Trebuchet MS'";
  ctx.fillText("🌿 kush · 🏃 outrun cops · 💵 bribe@100 · 🪽 wings · 🏰 Kush Castles", cx, wide?150:130);
  const empty=!(DB.name&&DB.name.trim());
  const nameCol = (empty&&(needName>0||Math.floor(frameCount/24)%2===0)) ? "#ff6b6b" : "#7CFC6A";

  if (wide){
    const colW=(w-3*pad)/2, Lx=x0+pad, Rx=x0+pad+colW+pad, Lcx=Lx+colW/2, Rcx=Rx+colW/2;
    ctx.strokeStyle="rgba(255,255,255,.10)"; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(cx,172); ctx.lineTo(cx,VH-40); ctx.stroke();
    ctx.fillStyle=nameCol; ctx.font="bold 14px 'Trebuchet MS'"; ctx.textAlign="center"; ctx.fillText(empty?"ENTER YOUR NAME ↓":"YOUR NAME", Lcx, 198);
    const sk=curSkin(); ctx.fillStyle="#9fb4d6"; ctx.font="12px 'Trebuchet MS'"; ctx.fillText("Skin: "+sk.name+" · Best: "+DB.best+"🌿", Lcx, 300);
    ctx.textAlign="left";
    button(Lx, 320, colW, 50, "▶  PLAY", ()=>startGame());
    button(Lx, 380, colW, 40, "🛍  KUSH SHOP", ()=>openShop(), "rgba(255,213,74,.18)");
    ctx.textAlign="center"; ctx.fillStyle="#8298ba"; ctx.font="11px 'Trebuchet MS'"; ctx.fillText("← → run · SPACE jump · F shoot", Lcx, 440);
    ctx.fillStyle="#ffd54a"; ctx.font="bold 18px 'Trebuchet MS'"; ctx.fillText("🏆 HIGH SCORES", Rcx, 192);
    ctx.fillStyle="#8fa6c8"; ctx.font="11px 'Trebuchet MS'"; ctx.fillText(Board.statusLine(), Rcx, 208);
    ctx.fillStyle="#7CFC6A"; ctx.font="bold 11px 'Trebuchet MS'"; ctx.fillText("⏳ season resets in "+fmtCountdown(seasonEndMs()), Rcx, 222);
    drawBoardRows(Rx+8, 240, colW-16, 9, null);
  } else {
    const ix=x0+pad, iw=w-2*pad;
    ctx.fillStyle=nameCol; ctx.font="bold 13px 'Trebuchet MS'"; ctx.textAlign="center"; ctx.fillText(empty?"ENTER YOUR NAME ↓":"YOUR NAME", cx, 166);
    ctx.textAlign="left";
    button(ix, 228, iw, 44, "▶  PLAY", ()=>startGame());
    button(ix, 278, iw, 38, "🛍  KUSH SHOP", ()=>openShop(), "rgba(255,213,74,.18)");
    ctx.textAlign="center"; ctx.fillStyle="#ffd54a"; ctx.font="bold 15px 'Trebuchet MS'"; ctx.fillText("🏆 HIGH SCORES", cx, 340);
    ctx.fillStyle="#8fa6c8"; ctx.font="10px 'Trebuchet MS'"; ctx.fillText(Board.statusLine(), cx, 356);
    ctx.fillStyle="#7CFC6A"; ctx.font="bold 10px 'Trebuchet MS'"; ctx.fillText("⏳ season resets in "+fmtCountdown(seasonEndMs()), cx, 370);
    drawBoardRows(ix+4, 378, iw-8, 5, null);
  }
  ctx.fillStyle="#fff"; ctx.globalAlpha=0.6+0.4*Math.sin(frameCount*0.12); ctx.font="bold 14px 'Trebuchet MS'"; ctx.textAlign="center";
  ctx.fillText(empty?"enter a name, then tap to start":"tap / ENTER to start", cx, VH-14); ctx.globalAlpha=1; ctx.textAlign="left";
}

let shopPage=0;
function drawShop(){
  ctx.fillStyle="rgba(6,10,20,.82)"; ctx.fillRect(0,0,VW,VH);
  const w=Math.min(VW-16, 900), x0=VW/2-w/2, cx=VW/2;
  panel(x0,16,w,VH-32,"rgba(255,213,74,.5)");
  ctx.textAlign="center"; ctx.fillStyle="#ffd54a"; ctx.font="bold 24px 'Trebuchet MS'"; ctx.fillText("🛍  KUSH SHOP",cx,42);
  ctx.textAlign="left";
  const owned=DB.owned, sel=DB.skin;
  const gap=14, inner=w-32;
  const cols=Math.max(2, Math.min(4, Math.floor((inner+gap)/(170+gap))));
  const cw=Math.floor((inner-(cols-1)*gap)/cols), ch=112;
  const startX=x0+16, startY=104, bottomY=VH-48;
  const rowsFit=Math.max(1, Math.floor((bottomY-startY+gap)/(ch+gap)));
  const perPage=cols*rowsFit, pages=Math.ceil(SKINS.length/perPage);
  shopPage=clamp(shopPage,0,pages-1);
  ctx.textAlign="center"; ctx.fillStyle="#fff"; ctx.font="13px 'Trebuchet MS'";
  ctx.fillText("Bank: "+DB.bank+" 🌿"+(pages>1?("   ·   page "+(shopPage+1)+"/"+pages):""),cx,62); ctx.textAlign="left";
  // ----- 🦅 Kush Eagle PET (synthetic shop item, shown on every page, above the skin grid) -----
  {
    const pet={ id:"pet_eagle", name:"Kush Eagle", cost:100000 };
    const ph=24, py=72, px=x0+16, pw=inner, ownedPet=DB.pet;
    ctx.fillStyle= ownedPet?"rgba(124,252,106,.18)":"rgba(255,213,74,.10)"; roundRect(px,py,pw,ph,8); ctx.fill();
    ctx.strokeStyle= ownedPet?"#7CFC6A":"rgba(255,213,74,.5)"; ctx.lineWidth=1.5; roundRect(px,py,pw,ph,8); ctx.stroke();
    ctx.textAlign="left"; ctx.fillStyle="#fff"; ctx.font="bold 13px 'Trebuchet MS'";
    ctx.fillText(pw>320? "🦅 Kush Eagle — flies beside you, smoking a joint" : "🦅 Kush Eagle pet", px+10, py+16);
    let plabel,pc;
    if (ownedPet){ plabel="✔ EQUIPPED"; pc="#7CFC6A"; }
    else { plabel=(DB.bank>=pet.cost?"BUY · ":"NEED ")+pet.cost+" 🌿"; pc=DB.bank>=pet.cost?"#ffd54a":"#ff8a8a"; }
    ctx.textAlign="right"; ctx.fillStyle=pc; ctx.font="bold 13px 'Trebuchet MS'";
    ctx.fillText(plabel,px+pw-10,py+16); ctx.textAlign="left";
    uiButtons.push({x:px,y:py,w:pw,h:ph,action:()=>buyPet(pet)});
  }
  const startIdx=shopPage*perPage;
  for (let idx=0; idx<perPage; idx++){
    const i=startIdx+idx; if(i>=SKINS.length) break;
    const s=SKINS[i], col=idx%cols, row=Math.floor(idx/cols);
    const cxp=startX+col*(cw+gap), cyp=startY+row*(ch+gap);
    const isOwned=owned.includes(s.id), isSel=sel===s.id;
    ctx.fillStyle= isSel?"rgba(124,252,106,.22)":"rgba(255,255,255,.06)"; roundRect(cxp,cyp,cw,ch,12); ctx.fill();
    ctx.strokeStyle= isSel?"#7CFC6A": isOwned?"rgba(255,255,255,.5)":"rgba(255,213,74,.5)"; ctx.lineWidth=2; roundRect(cxp,cyp,cw,ch,12); ctx.stroke();
    drawSkinPreview(s, cxp+cw/2, cyp+52);
    ctx.textAlign="center"; ctx.fillStyle="#fff"; ctx.font="bold 15px 'Trebuchet MS'"; ctx.fillText(s.name,cxp+cw/2,cyp+84);
    let label,c2;
    if (isSel){ label="EQUIPPED"; c2="#7CFC6A"; }
    else if (isOwned){ label="EQUIP"; c2="#cfe0ff"; }
    else { label=(DB.bank>=s.cost?"BUY · ":"NEED ")+s.cost+" 🌿"; c2=DB.bank>=s.cost?"#ffd54a":"#ff8a8a"; }
    ctx.fillStyle=c2; ctx.font="bold 13px 'Trebuchet MS'"; ctx.fillText(label,cxp+cw/2,cyp+103);
    ctx.textAlign="left";
    uiButtons.push({x:cxp,y:cyp,w:cw,h:ch,action:()=>buyOrEquip(s)});
  }
  const by=VH-40;
  if (pages>1){
    button(x0+16,by,52,30,"◀",()=>{shopPage=clamp(shopPage-1,0,pages-1);},"rgba(255,255,255,.14)");
    button(x0+w-68,by,52,30,"▶",()=>{shopPage=clamp(shopPage+1,0,pages-1);},"rgba(255,255,255,.14)");
  }
  button(cx-44,by,88,30,"BACK",()=>{G.scene="title";},"rgba(255,255,255,.14)");
}
function drawSkinPreview(s,cx,cy){
  ctx.save(); ctx.translate(cx-18,cy-26); const w=40,h=44;
  let body=s.body, dark=s.dark, belly=s.belly;
  if (isChromatic(s)){ const h2=(frameCount*1.6)%360; body=`hsl(${h2} 60% 60%)`; dark=`hsl(${h2} 55% 38%)`; belly=`hsl(${(h2+40)%360} 50% 86%)`; }
  ctx.fillStyle = isChromatic(s) ? chromaFill(8,12, w-2,h-6, frameCount*0.05) : body;
  roundRect(8,12,w-10,h-18,8); ctx.fill();
  ctx.fillStyle=belly; roundRect(12,18,w-22,h-26,6); ctx.fill();
  ctx.fillStyle = isChromatic(s) ? chromaFill(w-20,2, w+4,20, frameCount*0.05+1.0) : body;
  roundRect(w-20,2,24,18,7); ctx.fill();
  ctx.fillStyle="#fff"; ctx.beginPath(); ctx.arc(w-4,9,4,0,6.28); ctx.fill();
  ctx.fillStyle="#111"; ctx.beginPath(); ctx.arc(w-2,9,2,0,6.28); ctx.fill();
  ctx.fillStyle=dark; ctx.fillRect(12,h-6,7,8); ctx.fillRect(24,h-6,7,8);
  drawAccessory(s.acc, w+ (s.acc==="rasta"?0:0), 0);
  ctx.restore();
}
function buyOrEquip(s){
  const owned=DB.owned;
  if (owned.includes(s.id)){ DB.skin=s.id; sfx.collect(); Profile.save(); return; }
  if (DB.bank>=s.cost){ DB.bank=DB.bank-s.cost; owned.push(s.id); DB.owned=owned; DB.skin=s.id; sfx.star(); Profile.save(); }
  else { sfx.hurt(); flash=6; }
}
function buyPet(pet){
  if (DB.pet){ sfx.collect(); return; }                 // already owned → always equipped
  if (DB.bank>=pet.cost){ DB.bank=DB.bank-pet.cost; DB.pet=true; sfx.star(); Profile.save(); }
  else { sfx.hurt(); flash=6; }
}

function drawGameOver(){
  ctx.fillStyle="rgba(6,10,20,.66)"; ctx.fillRect(0,0,VW,VH);
  const w=Math.min(600,VW-16), x0=VW/2-w/2, cx=VW/2;
  panel(x0,52,w,VH-72);
  ctx.textAlign="center";
  const hanged=overReason==="hanged";
  ctx.fillStyle="#ff7b7b"; ctx.font="bold 36px 'Trebuchet MS'";
  ctx.fillText(hanged?"HANGED!":(overReason==="lava"?"BURNED!":(overReason==="fell"?"WIPEOUT!":"BUSTED!")),cx,104);
  // run summary: kush · distance · TOTAL points (yellow), auto-shrunk to fit
  {
    const total=Math.round(Board.rankVal({score:score,dist:distance,hidden:hidden}));
    const a=`${score}🌿   ${distance}m   `, b=`${total} pts`;
    let fs=22; ctx.font="bold "+fs+"px 'Trebuchet MS'";
    while ((ctx.measureText(a).width+ctx.measureText(b).width)>w-28 && fs>12){ fs--; ctx.font="bold "+fs+"px 'Trebuchet MS'"; }
    const wa=ctx.measureText(a).width, wb=ctx.measureText(b).width, xs=cx-(wa+wb)/2;
    ctx.textAlign="left";
    ctx.fillStyle="#fff"; ctx.fillText(a, xs, 140);
    ctx.fillStyle="#ffd54a"; ctx.fillText(b, xs+wa, 140);
    ctx.textAlign="center";
  }
  ctx.fillStyle="#9fe89f"; ctx.font="13px 'Trebuchet MS'"; ctx.fillText(`+${score}🌿 banked · Bank ${DB.bank}`,cx,164);
  const nb=(score>=DB.best&&score>0)?"NEW BEST! ":"";
  ctx.fillStyle="#ffd54a"; ctx.font="13px 'Trebuchet MS'"; ctx.fillText(`${nb}Best ${DB.best}🌿 · ${DB.bestDist} m`,cx,184);
  const rank=Board.rankOf(Board.lastName);
  ctx.fillStyle="#ffd54a"; ctx.font="bold 17px 'Trebuchet MS'"; ctx.fillText("🏆 HIGH SCORES"+(rank>=0?" · #"+(rank+1):""),cx,214);
  ctx.fillStyle="#8fa6c8"; ctx.font="11px 'Trebuchet MS'"; ctx.fillText(Board.statusLine(),cx,231);
  drawBoardRows(x0+22,252,w-44,6,Board.lastName);
  ctx.textAlign="left";
  const bw=(w-3*16)/2, bx=x0+16;
  button(bx, 396, bw, 44, "↻  RUN AGAIN", ()=>startGame());
  button(bx+bw+16, 396, bw, 44, "🛍  SHOP", ()=>openShop(), "rgba(255,213,74,.18)");
  ctx.textAlign="center"; ctx.fillStyle="#fff"; ctx.globalAlpha=0.6+0.4*Math.sin(frameCount*0.12); ctx.font="bold 14px 'Trebuchet MS'";
  ctx.fillText("tap / ENTER to run again",cx,VH-30); ctx.globalAlpha=1; ctx.textAlign="left";
}
// small in-game button (top, clear of the controls) → back to the main menu
function drawMenuButton(){
  if (VW<720) button(VW-58, 14+safeTop, 50, 22, "≡", quitToMenu, "rgba(8,12,24,.66)");
  else button(VW/2+76, 8, 104, 28, "≡ MENU", quitToMenu, "rgba(8,12,24,.62)");
}
function drawPaused(){
  ctx.fillStyle="rgba(6,10,20,.62)"; ctx.fillRect(0,0,VW,VH);
  const cx=VW/2;
  ctx.textAlign="center"; ctx.fillStyle="#fff"; ctx.font="bold 36px 'Trebuchet MS'"; ctx.fillText("PAUSED",cx,VH/2-64); ctx.textAlign="left";
  if (VW>=520){
    button(cx-220,VH/2-8,200,50,"▶  RESUME",()=>togglePause());
    button(cx+20,VH/2-8,200,50,"≡  MAIN MENU",()=>quitToMenu(),"rgba(255,255,255,.14)");
  } else {
    const bw=Math.min(280,VW-40), bx=cx-bw/2;
    button(bx,VH/2-22,bw,46,"▶  RESUME",()=>togglePause());
    button(bx,VH/2+34,bw,46,"≡  MAIN MENU",()=>quitToMenu(),"rgba(255,255,255,.14)");
  }
  ctx.textAlign="center"; ctx.font="13px 'Trebuchet MS'"; ctx.fillStyle="#9fb4d6"; ctx.fillText("P to resume",cx,VH-30); ctx.textAlign="left";
}

// ======================================================================
//  MAIN LOOP
// ======================================================================
let last=performance.now(), accT=0;
function loop(now){
  accT+=now-last; last=now; if(accT>250)accT=250;
  while (accT>=FIXED_DT){
    if (G.scene==="play") update(); else { frameCount++; if (G.scene==="intro") introT++; if (needName>0) needName--; }
    accT-=FIXED_DT;
  }
  // keep the global board fresh on menus so new high scores show up for everyone
  if (G.scene!=="play" && Board.global() && frameCount%240===0) Board.refresh();
  render();
  requestAnimationFrame(loop);
}
Board.init();
if (DB.name && DB.name.trim()) Profile.load(DB.name);   // adopt cloud account for the saved name
resetWorld(true);
requestAnimationFrame(loop);
</script>
<script>
/* register service worker so the game works offline / installs like an app */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
/* one-time iOS hint: Add to Home Screen = true fullscreen (Safari blocks the in-tab fullscreen API) */
(function(){
  var el=document.getElementById("iosHint"); if(!el) return;
  var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1);
  var standalone = (navigator.standalone===true) || (window.matchMedia && (matchMedia("(display-mode: standalone)").matches || matchMedia("(display-mode: fullscreen)").matches));
  var seen=false; try{ seen=!!localStorage.getItem("maria_ios_hint"); }catch(e){}
  if (isIOS && !standalone && !seen){
    el.style.display="block";
    var dismiss=function(){ el.style.display="none"; try{ localStorage.setItem("maria_ios_hint","1"); }catch(e){} };
    el.addEventListener("click", dismiss);
    setTimeout(dismiss, 9000);
  }
})();
</script>
