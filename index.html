<script>
"use strict";
/* =====================================================================
   THE KUSH RUSH — Kuala Lumpur Most Wanted
   Super-Mario x Sonic x cinematic. Single file, no dependencies.
   A T-Rex collects kush (1pt each) while OUTRUNNING the Malaysian police.
   • Bribe the cops ONCE for 100 kush — or get hanged from a weed tree
   • Each level you enter the KUSH CASTLE; it gets crazier every time
   • KL Petronas Towers obstacle · 🪽 wings power-up at the sky-top
   • BONG = speed · CALI BUD = invincible star · BLOW CANNON = joints
   • Trampolines fling you sky-high · GLOBAL high-score leaderboard
   • 4 environments: Kuala Lumpur / Desert / Volcano / Neon Night
   ===================================================================== */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
// Fixed virtual HEIGHT, virtual WIDTH follows the screen aspect → fills portrait & landscape,
// no letterbox, no distortion (canvas aspect always matches the screen).
const VH = 540;
let VW = 960;
let safeTop = 0;                      // status-bar / notch inset in canvas px (keeps the HUD visible)
function fitCanvas(){
  const w = window.innerWidth || 960, h = window.innerHeight || 540;
  VW = Math.max(280, Math.round(VH * (w / h)));
  canvas.width = VW; canvas.height = VH;
  ctx.imageSmoothingEnabled = false;
  const probe=document.getElementById("safeTopProbe");
  safeTop = probe ? Math.round(probe.getBoundingClientRect().height * (VH / h)) : 0;
}
fitCanvas();
addEventListener("resize", fitCanvas);
addEventListener("orientationchange", fitCanvas);
// zoom the world OUT on narrow/portrait screens so you can see more of the surroundings (1 = no zoom)
function viewZoom(){ return clamp(VW/560, 0.56, 1); }
// right edge of the VISIBLE world (accounts for zoom-out) — used so off-screen-right objects aren't
// culled while still inside the zoomed-out view (which caused things to "pop in" late on portrait).
function camRightX(){ return cam.x + VW/viewZoom() + 120; }

// ---------------- constants ----------------
const GROUND_TOP = VH - 84;
const GRAVITY = 0.72, JUMP_V = 14.4, JUMP_CUT = 6.0;
const MOVE_SPD = 4.5, BOOST_SPD = 8.6, MAX_FALL = 18;
const ACCEL = 0.75, FRICTION = 0.80, COYOTE = 7, BUFFER = 7;
const SEG_W = 360, FIXED_DT = 1000/60;
const TRAMP_BOUNCE = 43.0, STOMP_BOUNCE = 9.2;   // trampolines fling you WAY up (uncut launch)
const DEATH_Y = GROUND_TOP + 280;
const LEVEL_LEN = 1180;            // metres per environment (more distance between levels)
const SKY_TOP = GROUND_TOP - 760;  // how high the world goes (reach the wings up here)
const MAX_LIVES = 3;               // hard cap — only three lives
const AMMO_CAP = 25;               // most joints you can carry/shoot at once

// ---------------- persistence ----------------
const DB = {
  get bank(){ return Number(localStorage.getItem("maria_bank")||0); },
  set bank(v){ localStorage.setItem("maria_bank", Math.max(0,Math.floor(v))); },
  get best(){ return Number(localStorage.getItem("maria_best")||0); },
  set best(v){ localStorage.setItem("maria_best", Math.floor(v)); },
  get bestDist(){ return Number(localStorage.getItem("maria_bestdist")||0); },
  set bestDist(v){ localStorage.setItem("maria_bestdist", Math.floor(v)); },
  get owned(){ return (localStorage.getItem("maria_skins")||"classic").split(",").filter(Boolean); },
  set owned(arr){ localStorage.setItem("maria_skins", arr.join(",")); },
  get skin(){ return localStorage.getItem("maria_skin")||"classic"; },
  set skin(v){ localStorage.setItem("maria_skin", v); },
  get name(){ return localStorage.getItem("maria_name")||""; },
  set name(v){ localStorage.setItem("maria_name", (v||"").toString().toUpperCase().replace(/[^A-Z0-9 _-]/g,"").slice(0,10)); },
  get pet(){ return localStorage.getItem("maria_pet")==="1"; },
  set pet(v){ localStorage.setItem("maria_pet", v?"1":"0"); },
};

const SKINS = [
  {id:"classic", name:"Rasta Rex",   cost:0,    body:"#2faa4a", dark:"#1f7a34", belly:"#c4f7a6", acc:"rasta"},
  {id:"gold",    name:"Golden Rex",  cost:150,  body:"#e8c43a", dark:"#b8901c", belly:"#fff0b0", acc:"crown"},
  {id:"pink",    name:"Diva Rex",    cost:300,  body:"#ff7bd0", dark:"#d23ea0", belly:"#ffd4ee", acc:"halo"},
  {id:"shadow",  name:"Shadow Rex",  cost:500,  body:"#6a5a92", dark:"#3c2e5c", belly:"#c2aef0", acc:"shades"},
  {id:"neon",    name:"Cyber Rex",   cost:750,  body:"#23d6c2", dark:"#11968a", belly:"#b6fbf2", acc:"cyber"},
  {id:"lava",    name:"Magma Rex",   cost:1000, body:"#ff5a2a", dark:"#bf331b", belly:"#ffc472", acc:"horns"},
  {id:"zombie",  name:"Zombie Rex",  cost:1350, body:"#86ad55", dark:"#516b2c", belly:"#cfe09a", acc:"brain"},
  {id:"ice",     name:"Frost Rex",   cost:1700, body:"#7fd4ff", dark:"#3a8fc4", belly:"#e6f7ff", acc:"ice"},
  {id:"galaxy",  name:"Galaxy Rex",  cost:2200, body:"#3b2a6e", dark:"#22164a", belly:"#b9a6ff", acc:"galaxy"},
  {id:"diamond", name:"Diamond Rex", cost:2900, body:"#9ff0ea", dark:"#52b8b2", belly:"#e9fffd", acc:"diamond"},
  {id:"demon",   name:"Demon Rex",   cost:3800, body:"#b01030", dark:"#6a0a1c", belly:"#ff7a7a", acc:"devil"},
  {id:"rainbow", name:"Trippy Rex",  cost:5000, body:"#ff66cc", dark:"#9933ff", belly:"#ffffcc", acc:"trippy"},
  {id:"chrome",  name:"Chrome Rex",  cost:6500, body:"#b9c2cc", dark:"#5a6470", belly:"#e9eef3", acc:"shades"},
  {id:"prism",   name:"Prism Rex",   cost:8000, body:"#cfe9ff", dark:"#6aa0d0", belly:"#ffffff", acc:"diamond"},
  {id:"aurora",  name:"Aurora Rex",  cost:9500, body:"#7af0c0", dark:"#2f9fb0", belly:"#dffff4", acc:"galaxy"},
];
const skinById = (id)=> SKINS.find(s=>s.id===id) || SKINS[0];
// ---- top-tier "chromatic" skins: metallic base + animated shimmer band (distinct from flat 'rainbow') ----
const CHROMATIC = new Set(["diamond","galaxy","prism","aurora","chrome"]);  // ids that get the shimmer treatment
const isChromatic = (sk)=> sk && CHROMATIC.has(sk.id);
// a shimmering metallic fill for a band [x0,y0..x1,y1]; phase animates the light sweep
function chromaFill(x0,y0,x1,y1,phase,sat=70,lite=58){
  const g=ctx.createLinearGradient(x0,y0,x1,y1);
  const s=(Math.sin(phase)*0.5+0.5);            // 0..1 sweep position of the bright band
  for(let i=0;i<=6;i++){
    const t=i/6;
    const d=Math.abs(t-s);                       // distance from the moving light band
    const l=clamp(lite + (1-Math.min(d*3.2,1))*34, 18, 94);   // bright crest, darker flanks
    const hue=( (frameCount*1.6) + t*120 )%360;   // slow rainbow drift across the band
    g.addColorStop(t, `hsl(${hue} ${sat}% ${l}%)`);
  }
  return g;
}

// ---------------- leaderboard ----------------
// Works per-device out of the box. To make the list GLOBAL (shared by everyone
// who opens the link): get a free Pantry ID at getpantry.cloud (email only, no
// password), then set provider:"pantry" + paste the id below and re-deploy.
const BOARD = {
  provider: "pantry",                // GLOBAL leaderboard, shared by everyone with the link
  pantryId: "1ac0a8d5-7776-42ae-8f87-c375c3d33c30",
  basket:   "maria_trex_scores",
  max:      100,
};
// ---------------- 3-day competitive season ----------------
// SEASON_ORIGIN is a fixed UTC anchor; currentSeason() increments every 3 days identically for
// every client. The first client to touch the board after a rollover wipes scores + stamps the
// new season number (see Board.unwrap / Board.submit).
const SEASON_LEN_MS = 3*864e5;                       // 3 days
const SEASON_ORIGIN = Date.UTC(2026, 5, 5, 0, 0, 0); // 2026-06-05T00:00:00Z (month 5 = June; fixed, never change)
function currentSeason(){ return Math.floor((Date.now() - SEASON_ORIGIN) / SEASON_LEN_MS); }
function seasonEndMs(){
  const end=SEASON_ORIGIN + (currentSeason()+1)*SEASON_LEN_MS;
  return Math.max(0, end - Date.now());              // ms remaining for the menu countdown
}
function fmtCountdown(ms){
  if (ms<0) ms=0;
  const totMin=Math.floor(ms/60000), d=Math.floor(totMin/1440), h=Math.floor((totMin%1440)/60), m=totMin%60;
  return d+"d "+h+"h "+m+"m";
}
const Board = {
  cache: [], status: "local", lastName: "",
  global(){ return BOARD.provider==="pantry" && BOARD.pantryId.length>10; },
  url(){ return "https://getpantry.cloud/apiv1/pantry/"+BOARD.pantryId+"/basket/"+BOARD.basket; },
  localAll(){ try{ return JSON.parse(localStorage.getItem("maria_scores")||"[]"); }catch(e){ return []; } },
  localSet(a){ try{ localStorage.setItem("maria_scores", JSON.stringify(a)); }catch(e){} },
  // local scores filtered to the CURRENT season (stale-season locals never re-pollute a fresh board)
  localCurrent(){ const cur=currentSeason(); return this.localAll().filter(e=> (Number(e.season)||0) >= cur); },
  // unwrap remote payload into {scores, season}; apply rollover (stale season → wipe).
  unwrap(d){
    let scores=[], season=0;
    if (Array.isArray(d)) scores=d;                                   // legacy bare array → season 0
    else if (d && typeof d==="object"){ scores=Array.isArray(d.scores)?d.scores:[]; season=Number(d.season)||0; }
    const cur=currentSeason();
    if (season < cur){ scores=[]; season=cur; }                       // ROLLOVER: first reader wipes
    return { scores, season };
  },
  // rank = 66% kush + 33% distance + a HIDDEN secret-collectible bonus (never shown)
  rankVal(e){ return 0.66*(e.score||0) + 0.33*(e.dist||0) + 5*(e.hidden||0); },
  // collapse to one best entry per name (by rank), sort by rank, trim
  normalize(arr){
    const best=Object.create(null);
    for (const e of (arr||[])){
      if (!e || typeof e.score!=="number" || !isFinite(e.score)) continue;
      const name=(e.name||"???").toString().toUpperCase().slice(0,10) || "???";
      const ent={ name, score:Math.max(0,Math.floor(e.score)), dist:Math.max(0,Math.floor(e.dist||0)), hidden:Math.max(0,Math.floor(e.hidden||0)), ts:e.ts||0 };
      const cur=best[name];
      if (!cur || this.rankVal(ent)>this.rankVal(cur)) best[name]=ent;
    }
    return Object.values(best).sort((a,b)=> this.rankVal(b)-this.rankVal(a)).slice(0, BOARD.max);
  },
  statusLine(){
    if (!this.global()) return "📱 saved on this device";
    if (this.status==="loading") return "🌐 syncing…";
    if (this.status==="offline") return "🌐 offline · showing saved";
    return "🌐 shared with everyone";
  },
  rankOf(name){ if(!name) return -1; return this.cache.findIndex(r=>r.name===name); },
  init(){
    this.cache=this.normalize(this.localCurrent());
    if (this.global()){ this.status="loading"; this.refresh(); }
  },
  async refresh(){
    if (!this.global()) return;
    try{
      const res=await fetch(this.url(),{cache:"no-store"});
      let payload={scores:[],season:currentSeason()};
      if(res.ok){ payload=this.unwrap(await res.json()); }
      this.cache=this.normalize(payload.scores.concat(this.localCurrent()));
      this.status="online";
    }catch(e){ this.status="offline"; this.cache=this.normalize(this.localCurrent()); }
  },
  same(a,b){ if(a.length!==b.length) return false; for(let i=0;i<a.length;i++){ const x=a[i],y=b[i]; if(x.name!==y.name||x.score!==y.score||x.dist!==y.dist||(x.hidden||0)!==(y.hidden||0)) return false; } return true; },
  async readRemote(){ try{ const r=await fetch(this.url(),{cache:"no-store"}); if(r.ok){ const d=await r.json(); return this.unwrap(d); } }catch(e){} return null; },
  async submit(entry){
    const cur=currentSeason();
    entry.season=cur;                                                  // stamp the run's season
    let local=this.localAll(); local.push(entry);
    local=local.filter(e=> (Number(e.season)||0) >= cur);             // drop last-season locals
    this.localSet(local);                                             // instant + offline-proof
    this.cache=this.normalize(local);
    this.lastName=entry.name;
    if (!this.global()) return;
    this.status="loading";
    try{
      // reconcile loop: read → merge (keeps the HIGHEST per name) → write → re-read; repeat until
      // the server already contains our merged set, so a concurrent write can never drop a high score.
      let merged=this.normalize(local), ok=false;
      for (let pass=0; pass<3; pass++){
        const rr=await this.readRemote();                             // {scores,season} (rolled) or null
        const remote=rr ? rr.scores : null;
        const writeSeason=Math.max(cur, rr ? (Number(rr.season)||0) : 0); // never roll the server's season backward
        const combined=this.normalize((remote||[]).concat(merged));
        if (remote!==null && this.same(this.normalize(remote), combined)){ merged=combined; ok=true; break; }   // already in sync
        merged=combined;
        try{ const w=await fetch(this.url(),{ method:"POST", headers:{"Content-Type":"application/json"},
              body:JSON.stringify({scores:merged, season:writeSeason}) }); ok=ok||w.ok; }catch(e){}
      }
      this.cache=merged; this.status= ok?"online":"offline";
    }catch(e){ this.status="offline"; }
  },
};

// ---------------- per-name account sync (Pantry profiles basket) ----------------
// Every player NAME owns a cloud profile {bank,owned,skin,pet,best,bestDist}. Loading a name
// adopts that profile into DB; saving reconciles via read-modify-write so two devices (or two
// names) never clobber each other. Profile is the SINGLE SOURCE for bank/owned/skin/pet.
const PROFILES = { pantryId: BOARD.pantryId, basket: "maria_trex_profiles" };
const Profile = {
  status: "local",          // "local" | "loading" | "synced" | "offline"
  loadedName: "",           // name whose profile is currently adopted in DB
  saving: false, dirty: false, syncedBank: 0,
  key(name){ return (name||"").toString().toUpperCase().replace(/[^A-Z0-9 _-]/g,"").slice(0,10).trim(); },
  global(){ return PROFILES.pantryId && PROFILES.pantryId.length>10; },
  url(){ return "https://getpantry.cloud/apiv1/pantry/"+PROFILES.pantryId+"/basket/"+PROFILES.basket; },
  statusLine(){
    if (!this.global()) return "📱 device only";
    if (this.status==="loading") return "☁️ loading account…";
    if (this.status==="offline") return "☁️ offline · local account";
    if (this.status==="synced")  return "☁️ account synced";
    return "☁️ account ready";
  },
  // merge two profile records: owned=union, best/bestDist=max, bank/skin/pet=`over` wins (last-write).
  mergeInto(base, over){
    base=base||{}; over=over||{};
    const ownA=Array.isArray(base.owned)?base.owned:[], ownB=Array.isArray(over.owned)?over.owned:[];
    const owned=Array.from(new Set(["classic", ...ownA, ...ownB].filter(Boolean)));
    return {
      bank:    Math.max(0, Math.floor(Number(over.bank!=null?over.bank:base.bank)||0)),
      owned,
      skin:    (over.skin||base.skin||"classic"),
      pet:     (over.pet!=null ? !!over.pet : !!base.pet),
      best:    Math.max(Math.floor(Number(base.best)||0),     Math.floor(Number(over.best)||0)),
      bestDist:Math.max(Math.floor(Number(base.bestDist)||0), Math.floor(Number(over.bestDist)||0)),
    };
  },
  fromDB(){ return { bank:DB.bank, owned:DB.owned, skin:DB.skin, pet:DB.pet, best:DB.best, bestDist:DB.bestDist }; },
  applyToDB(p){
    if (!p) return;
    if (Array.isArray(p.owned)) DB.owned = Array.from(new Set(["classic", ...p.owned].filter(Boolean)));
    const _localSkin = DB.skin;
    if (p.skin)        DB.skin = p.skin;
    if (_localSkin && DB.owned.indexOf(_localSkin)>=0) DB.skin = _localSkin;  // keep player's equipped choice if still owned
    if (p.pet!=null)   DB.pet  = !!p.pet;
    if (p.bank!=null){ DB.bank = Math.max(0, Math.floor(Number(p.bank)||0)); Profile.syncedBank = DB.bank; }  // cloud value last reconciled (delta anchor)
    if (p.best!=null     && Number(p.best)>DB.best)         DB.best     = Math.floor(Number(p.best));
    if (p.bestDist!=null && Number(p.bestDist)>DB.bestDist) DB.bestDist = Math.floor(Number(p.bestDist));
    if (DB.owned.indexOf(DB.skin)<0) DB.skin = DB.owned[DB.owned.length-1] || "classic"; // keep equipped valid
  },
  async readBasket(){
    try{ const r=await fetch(this.url(),{cache:"no-store"}); if(r.ok){ const d=await r.json(); return (d&&typeof d==="object")?d:{}; } }catch(e){}
    return null;   // null = couldn't read (offline / 400 on first-ever basket)
  },
  // ADOPT the remote profile for `name` into DB (local as base, remote as override → no progress lost).
  async load(name){
    const k=this.key(name); if(!k) return;
    this.loadedName=k;
    if (!this.global()){ this.status="local"; return; }
    this.status="loading";
    const basket=await this.readBasket();
    if (basket===null){ this.status="offline"; return; }   // keep local DB as-is
    const profiles=(basket.profiles && typeof basket.profiles==="object")?basket.profiles:{};
    const remote=profiles[k]||null;
    this.applyToDB(this.mergeInto(this.fromDB(), remote||{}));
    this.status="synced";
  },
  // SAVE current DB into profiles[name]; preserves every OTHER name (read fresh each pass).
  async save(){
    if (!this.global()){ this.status="local"; return; }
    const k=this.key(DB.name); if(!k) return;
    if (k!==this.loadedName){ return; }                     // name changed but its profile not yet adopted → refuse stale save
    if (this.saving){ this.dirty=true; return; }            // a save is in-flight → coalesce
    this.saving=true; this.status="loading";
    try{
      for (let pass=0; pass<3; pass++){
        const mineNow=this.fromDB();                        // re-snapshot each pass (latest local truth)
        const basket=await this.readBasket();
        const profiles=(basket && basket.profiles && typeof basket.profiles==="object")?basket.profiles:{};
        const cloudBank=Math.max(0, Math.floor(Number((profiles[k]||{}).bank)||0));
        const delta=Math.floor(DB.bank) - Math.floor(this.syncedBank||0);   // this session's net earn/spend
        const merged=this.mergeInto(profiles[k]||{}, mineNow);
        merged.bank=Math.max(0, cloudBank + delta);             // apply delta to FRESH cloud, never clobber another device's earnings
        profiles[k]=merged;
        DB.bank=merged.bank; this.syncedBank=merged.bank;       // re-anchor to what we just persisted
        const body=Object.assign({}, basket||{}, {profiles});   // preserve any sibling top-level keys
        let ok=false;
        try{ const w=await fetch(this.url(),{ method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body) }); ok=w.ok; }catch(e){}
        if (ok){
          const after=await this.readBasket();              // verify our slot landed; if raced, retry fresh
          const got=after && after.profiles && after.profiles[k];
          const wantOwned=profiles[k].owned||[], gotOwned=new Set((got&&got.owned)||[]);
          const ownedOK=wantOwned.every(id=>gotOwned.has(id));
          if (got && Number(got.bank)>=Number(profiles[k].bank) && ownedOK){ this.status="synced"; break; }
          continue;
        } else { this.status="offline"; break; }
      }
    } finally {
      this.saving=false;
      if (this.dirty){ this.dirty=false; this.save(); }     // a save requested mid-flight → run once more
    }
  },
};

// ===== zone-based touch controls: big invisible hit areas (extended up/down), slide to steer =====
// Each control has a generous invisible zone around its (same-size) button. The left/right pad is
// one wide zone split at the middle, so sliding your thumb left↔right switches direction. Anywhere
// that isn't a control zone (and isn't the ≡ MENU button) is a JUMP — a huge forgiving target.
const PAD_UP=80, PAD_DN=40, PAD_X=8;              // ≤ flex gap (10px) so the fire zone can't leak into the jump button
function zoneRect(el, padX, padUp, padDn){ const r=el.getBoundingClientRect(); return {l:r.left-padX, r:r.right+padX, t:r.top-padUp, b:r.bottom+padDn, w:r.width}; }
function ctlZone(cx, cy){
  const L=btnEls.left, R=btnEls.right, F=btnEls.fire;
  if (L && R){
    const lr=L.getBoundingClientRect(), rr=R.getBoundingClientRect();
    const dl=Math.min(lr.left,rr.left)-PAD_X, dr=Math.max(lr.right,rr.right)+PAD_X;
    const dt=Math.min(lr.top,rr.top)-PAD_UP, db=Math.max(lr.bottom,rr.bottom)+PAD_DN;
    if (cx>=dl && cx<=dr && cy>=dt && cy<=db){ return cx < (Math.min(lr.left,rr.left)+Math.max(lr.right,rr.right))/2 ? "left" : "right"; }
  }
  if (F){ const z=zoneRect(F,PAD_X,PAD_UP,PAD_DN); if(cx>=z.l&&cx<=z.r&&cy>=z.t&&cy<=z.b) return "fire"; }
  return "jump";
}
function onScreenButton(cx, cy){ const r=canvas.getBoundingClientRect(); const px=(cx-r.left)*(VW/r.width), py=(cy-r.top)*(VH/r.height);
  for(const b of uiButtons){ if(px>=b.x&&px<=b.x+b.w&&py>=b.y&&py<=b.y+b.h) return true; } return false; }
const touchCtl=new Map();   // touch identifier -> "left"|"right"|"fire"|"jump"
function refreshKeys(){
  let l=false,r=false,f=false,j=false;
  for (const z of touchCtl.values()){ if(z==="left")l=true; else if(z==="right")r=true; else if(z==="fire")f=true; else if(z==="jump")j=true; }
  keys.left=l; keys.right=r; keys.fire=f; keys.jump=j;
  if(btnEls.left) btnEls.left.classList.toggle("on",l);
  if(btnEls.right) btnEls.right.classList.toggle("on",r);
  if(btnEls.fire) btnEls.fire.classList.toggle("on",f);
  if(btnEls.jump) btnEls.jump.classList.toggle("on",j);
}
function tStart(e){
  Music.start();
  if (G.scene!=="play") return;                                  // menus: canvas handler navigates
  for (const t of e.changedTouches){
    if (onScreenButton(t.clientX,t.clientY)) continue;           // leave the ≡ MENU tap to handleClick
    touchCtl.set(t.identifier, ctlZone(t.clientX,t.clientY));
  }
  refreshKeys();
  if (e.cancelable) e.preventDefault();
}
function tMove(e){
  if (G.scene!=="play" || !touchCtl.size) return;
  let changed=false;
  for (const t of e.changedTouches){ if(touchCtl.has(t.identifier)){ const z=ctlZone(t.clientX,t.clientY); if(touchCtl.get(t.identifier)!==z){ touchCtl.set(t.identifier,z); changed=true; } } }
  if (changed) refreshKeys();
  if (e.cancelable) e.preventDefault();
}
function tEnd(e){ for (const t of e.changedTouches) touchCtl.delete(t.identifier); refreshKeys(); }
addEventListener("touchstart", tStart, {passive:false});

function ac(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ actx=null; } } return actx; }
function tone(freq, dur=0.08, type="square", vol=0.12, slideTo=null, delay=0){
  if (muted) return; const a=ac(); if(!a) return;
  const t=a.currentTime+delay;
  const o=a.createOscillator(), g=a.createGain();
  o.type=type; o.frequency.setValueAtTime(freq,t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(1,slideTo), t+dur);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+dur+0.03);
}

// ---------------- background music (chiptune loop, theme-aware) ----------------
const midi=(n)=>440*Math.pow(2,(n-69)/12);
const Music = {
  on:true, step:0, bar:0, nextTime:0, timer:null, root:0, tempo:82, tense:false,
  // REGGAE one-drop, 16 steps/bar (4 steps per beat). null = rest.
  bass:[0,null,null,0,  null,null,7,null,  5,null,null,5,  3,null,0,null],   // deep syncopated reggae bass
  lead:[null,null,null,null, null,null,12,null, null,null,null,null, null,null,15,14], // sparse skanky lead licks
  prog:[0,0,5,5, 7,5,0,0],     // chord roots per bar (I-IV-V vibe)
  start(){
    if (this.timer) return;
    const a=ac(); if(!a) return;
    if (a.state==="suspended") a.resume();
    this.nextTime=a.currentTime+0.08;
    this.timer=setInterval(()=>this.sched(),25);
  },
  stop(){ if(this.timer){ clearInterval(this.timer); this.timer=null; } },
  setTheme(i){ const T=[{r:0,t:82},{r:5,t:86},{r:-2,t:74},{r:3,t:90}][i%4]; this.root=T.r; this.tempo=T.t; },
  note(freq,t,dur,type,vol){ const a=ac(); if(!a)return; const o=a.createOscillator(),g=a.createGain();
    o.type=type; o.frequency.setValueAtTime(freq,t); g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(vol,t+0.012); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+dur+0.03); },
  hat(t,vol){ const a=ac(); if(!a)return; const o=a.createOscillator(),g=a.createGain();
    o.type="square"; o.frequency.setValueAtTime(8200,t); g.gain.setValueAtTime(vol||0.016,t);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.03); o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+0.05); },
  skank(t, chord){ // offbeat organ chord stab — the reggae "skank"
    for(const iv of [0,3,7]) this.note(midi(48+this.root+chord+iv), t, 0.11, "square", 0.028);
    this.note(midi(60+this.root+chord), t, 0.10, "triangle", 0.018);
  },
  rim(t){ const a=ac(); if(!a)return; const o=a.createOscillator(),g=a.createGain();
    o.type="square"; o.frequency.setValueAtTime(2100,t); o.frequency.exponentialRampToValueAtTime(420,t+0.05);
    g.gain.setValueAtTime(0.06,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.06);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+0.08); },
  sched(){
    const a=ac(); if(!a){ this.stop(); return; }
    const tempo=this.tempo*(this.tense?1.12:1);
    const spb=60/tempo/4; let guard=0;
    while (this.nextTime < a.currentTime+0.12 && guard++<40){
      if (!muted && this.on){
        const s=this.step, t=this.nextTime, chord=this.prog[this.bar % this.prog.length];
        const b=this.bass[s]; if(b!=null) this.note(midi(28+this.root+chord+b), t, spb*2.2, "triangle", 0.11);
        const l=this.lead[s]; if(l!=null) this.note(midi(60+this.root+chord+l), t, spb*1.4, "square", this.tense?0.05:0.04);
        if (s%4===2){ this.skank(t, chord); this.hat(t, 0.014); }   // skank + hat on the OFFBEAT
        else if (s%4===0) this.hat(t, 0.008);
        if (s===8){ this.note(midi(21+this.root), t, 0.18, "sine", 0.13); this.rim(t); }  // ONE-DROP: kick+rim on beat 3
        if (s===0) this.note(midi(21+this.root), t, 0.10, "sine", 0.05);
      }
      this.step=(this.step+1)%16; if(this.step===0) this.bar++; this.nextTime+=spb;
    }
  },
};

const irnd=(a,b)=>Math.floor(rnd(a,b+1));
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const aabb=(a,b)=> a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y;
function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
