function drawTramp(p){
  const sq=p.squish||0; if(p.squish>0)p.squish--;
  ctx.fillStyle="#222"; ctx.fillRect(p.x+2,p.y+8,6,16); ctx.fillRect(p.x+p.w-8,p.y+8,6,16);
  // springy mat
  ctx.fillStyle="#ff3a6a"; const dip=sq;
  ctx.beginPath(); ctx.moveTo(p.x,p.y+dip); ctx.quadraticCurveTo(p.x+p.w/2,p.y+dip+14,p.x+p.w,p.y+dip); ctx.lineTo(p.x+p.w,p.y+8+dip); ctx.quadraticCurveTo(p.x+p.w/2,p.y+18+dip,p.x,p.y+8+dip); ctx.closePath(); ctx.fill();
  ctx.fillStyle="#ffd24a"; ctx.fillRect(p.x+p.w/2-3,p.y+dip,6,6);
}

// ----- pickups -----
function drawPickups(){
  for(const arr of [weeds,floatPickups]) for(const o of arr){ if(o.taken)continue; if(o.x<cam.x-40||o.x>camRightX())continue; drawWeed(o.x,o.y+Math.sin(o.bob)*4); }
  for(const b of bongs){ if(b.taken)continue; if(b.x<cam.x-40||b.x>camRightX())continue; drawBong(b.x,b.y+Math.sin(b.bob)*4); }
  for(const s of stars){ if(s.taken)continue; if(s.x<cam.x-40||s.x>camRightX())continue; drawCaliStar(s.x,s.y+Math.sin(s.bob)*5,s.t); }
  for(const wg of wings){ if(wg.taken)continue; if(wg.x<cam.x-40||wg.x>camRightX())continue; drawWingsPickup(wg.x,wg.y+Math.sin(wg.bob)*5); }
  for(const hd of hiddens){ if(hd.taken)continue; if(hd.x<cam.x-40||hd.x>camRightX())continue; drawHiddenPickup(hd.x,hd.y+Math.sin(hd.bob)*5,hd.t); }
}
function drawHiddenPickup(x,y,t){
  // subtle shimmering violet gem — easy to overlook
  ctx.save(); ctx.translate(x+10,y+10); ctx.rotate(t*0.6);
  const a=0.35+0.35*Math.sin(t*1.4);
  ctx.globalAlpha=a; ctx.shadowColor="#c79bff"; ctx.shadowBlur=10;
  ctx.fillStyle="#b98cff"; ctx.beginPath(); ctx.moveTo(0,-8); ctx.lineTo(6,0); ctx.lineTo(0,8); ctx.lineTo(-6,0); ctx.closePath(); ctx.fill();
  ctx.shadowBlur=0; ctx.globalAlpha=Math.min(1,a+0.3); ctx.fillStyle="#fff"; ctx.fillRect(-1,-2,2,2);
  ctx.globalAlpha=1; ctx.restore();
}
// wings: the flap is a tiny control-point wiggle — cache one sprite per flap bucket (9 total)
const _wingSpr={};
function wingSprite(fb){
  return _wingSpr[fb] || (_wingSpr[fb]=makeSprite(84,64,c=>{
    c.translate(42,36);
    const flap=-0.5+fb*0.125;
    c.shadowColor="rgba(190,230,255,.8)"; c.shadowBlur=14;
    for(const s of [-1,1]){ c.save(); c.scale(s,1);
      c.fillStyle="#eaf6ff";
      c.beginPath(); c.moveTo(0,-2);
      c.quadraticCurveTo(14,-14+flap*6,22,-2); c.quadraticCurveTo(16,0,20,6);
      c.quadraticCurveTo(12,2,14,9); c.quadraticCurveTo(8,4,8,11);
      c.quadraticCurveTo(3,5,0,8); c.closePath(); c.fill();
      c.strokeStyle="rgba(150,200,235,.8)"; c.lineWidth=1; c.stroke();
      c.restore(); }
    c.shadowBlur=0; c.fillStyle="#ffd54a"; c.beginPath(); c.arc(0,0,3.5,0,6.28); c.fill();
  }));
}
function drawWingsPickup(x,y){
  const fb=clamp(Math.round((Math.sin(frameCount*0.25)*0.5+0.5)*8),0,8);
  ctx.drawImage(wingSprite(fb), x+21-42, y+15-36);
}
function drawCannonPickups(){ for(const c of cannons){ if(c.taken)continue; if(c.x<cam.x-40||c.x>camRightX())continue; drawCannon(c.x,c.y+Math.sin(c.bob)*4); } }

// The little kush plant is the most numerous pickup on screen; its 7 shadow-blurred leaf paths
// per plant per frame were a top frame cost — render it ONCE into a sprite, then blit.
let _weedSpr=null;
function weedSprite(){
  return _weedSpr || (_weedSpr=makeSprite(52,56,c=>{
    c.translate(26,30);
    c.shadowColor="rgba(80,255,80,.4)"; c.shadowBlur=6;
    c.fillStyle="#2f7d32";
    for(let i=-3;i<=3;i++){ const a=i*0.42,len=14-Math.abs(i)*1.6; c.save(); c.rotate(a);
      c.beginPath(); c.moveTo(0,2); c.quadraticCurveTo(-3,-len*.6,0,-len); c.quadraticCurveTo(3,-len*.6,0,2); c.fill();
      c.strokeStyle="#1f5a22"; c.lineWidth=1; c.beginPath(); c.moveTo(0,2); c.lineTo(0,-len+2); c.stroke(); c.restore(); }
    c.shadowBlur=0; c.strokeStyle="#5a3a1a"; c.lineWidth=2; c.beginPath(); c.moveTo(0,2); c.lineTo(0,12); c.stroke();
  }));
}
function drawWeed(x,y){ ctx.drawImage(weedSprite(), x-14, y-12); }
// bong / cannon: static body cached as a sprite; only the wisp of smoke is drawn live
let _bongSpr=null;
function bongSprite(){
  return _bongSpr || (_bongSpr=makeSprite(36,46,c=>{
    c.translate(3,3);
    c.fillStyle="rgba(120,200,255,.85)";
    c.beginPath(); c.moveTo(6,2); c.lineTo(20,2); c.lineTo(16,16); c.lineTo(20,40); c.lineTo(6,40); c.lineTo(10,16); c.closePath(); c.fill();
    c.strokeStyle="rgba(40,120,180,.9)"; c.lineWidth=1.5; c.stroke();
    c.fillStyle="rgba(80,200,90,.7)"; c.fillRect(7,30,12,9);
    c.strokeStyle="rgba(40,120,180,.9)"; c.lineWidth=3; c.beginPath(); c.moveTo(18,26); c.lineTo(28,32); c.stroke();
  }));
}
function drawBong(x,y){
  ctx.drawImage(bongSprite(), x-3, y-3);
  ctx.fillStyle="rgba(255,255,255,.5)"; for(let i=0;i<3;i++){ ctx.beginPath(); ctx.arc(x+13,y-4-i*7+Math.sin(frameCount*0.1+i)*2,3+i,0,6.28); ctx.fill(); }
}
let _cannonSpr=null;
function cannonSprite(){
  return _cannonSpr || (_cannonSpr=makeSprite(48,30,c=>{
    c.translate(1,2);
    c.fillStyle="#3a3a3a"; roundRect(2,8,30,16,6,c); c.fill();             // barrel
    c.fillStyle="#7CFC6A"; roundRect(0,12,12,10,4,c); c.fill();            // grip/tank
    c.fillStyle="#222"; c.fillRect(30,12,8,8);                             // muzzle
    c.fillStyle="#fff"; c.fillRect(34,13,8,3); c.fillStyle="#ff7a2a"; c.fillRect(42,13,2,3); // loaded joint
  }));
}
function drawCannon(x,y){
  ctx.drawImage(cannonSprite(), x-1, y-2);
  ctx.fillStyle="rgba(255,255,255,.5)"; ctx.beginPath(); ctx.arc(x+46,y+12-Math.sin(frameCount*0.1)*2,3,0,6.28); ctx.fill();
}
// cali star: hue cycles — cache one sprite per 15° hue bucket (24 total, built lazily); the
// 18px shadow-blurred 10-point poly per frame was very expensive. Rotation stays live.
const _starSpr={};
function starSprite(h){
  return _starSpr[h] || (_starSpr[h]=makeSprite(76,76,c=>{
    c.translate(38,38);
    c.shadowColor=`hsl(${h} 90% 60%)`; c.shadowBlur=18;
    c.fillStyle=`hsl(${h} 90% 60%)`; c.beginPath();
    for(let i=0;i<10;i++){ const r=i%2?6:17,a=i*Math.PI/5-Math.PI/2; c.lineTo(Math.cos(a)*r,Math.sin(a)*r); } c.closePath(); c.fill();
    c.shadowBlur=0; c.fillStyle="#2f7d32"; c.beginPath(); c.arc(0,0,7,0,6.28); c.fill();
    c.fillStyle="#7CFC6A"; c.beginPath(); c.arc(-2,-2,3,0,6.28); c.fill();
    c.strokeStyle="#ff9b3d"; c.lineWidth=1; for(let i=0;i<5;i++){ const a=i*1.25; c.beginPath(); c.moveTo(0,0); c.lineTo(Math.cos(a)*7,Math.sin(a)*7); c.stroke(); }
  }));
}
function drawCaliStar(x,y,t){
  const h=(Math.floor(((frameCount*6)%360)/15)*15)%360;
  ctx.save(); ctx.translate(x+16,y+16); ctx.rotate(Math.sin(t)*0.2);
  ctx.drawImage(starSprite(h),-38,-38);
  ctx.restore();
}

// ----- projectiles -----
function drawProjectiles(){
  for(const j of projectiles){
    const dir=j.vx>0?1:-1;
    if(frameCount%2===0) particles.push({x:j.x-dir*9,y:j.y-2,vx:rnd(-.4,.4),vy:rnd(-.7,-.1),life:16,max:16,r:rnd(2,4),col:"rgba(225,225,225,.7)",kind:"smoke"});
    ctx.save(); ctx.translate(j.x,j.y); ctx.scale(dir,1);
    // fat tapered joint (thin crutch at back → fat at the burning tip)
    ctx.fillStyle="#f6f1e2";
    ctx.beginPath(); ctx.moveTo(-10,-1.8); ctx.lineTo(7,-3.6); ctx.lineTo(7,3.6); ctx.lineTo(-10,1.8); ctx.closePath(); ctx.fill();
    ctx.fillStyle="#e6d9bc"; ctx.fillRect(-10,-1.8,3,3.6);                 // crutch/filter
    ctx.strokeStyle="rgba(170,150,110,.55)"; ctx.lineWidth=0.8; ctx.beginPath(); ctx.moveTo(-6,-0.9); ctx.lineTo(6,-2.4); ctx.stroke();
    // twisted burning tip + ember glow
    ctx.fillStyle="#3a2a1a"; ctx.beginPath(); ctx.moveTo(7,-3.6); ctx.lineTo(11,0); ctx.lineTo(7,3.6); ctx.closePath(); ctx.fill();
    ctx.shadowColor="#ff7a2a"; ctx.shadowBlur=8; ctx.fillStyle= frameCount%6<3?"#ff9b2a":"#ff5a1a";
    ctx.beginPath(); ctx.arc(8.5,0,2.6,0,6.28); ctx.fill(); ctx.shadowBlur=0;
    ctx.restore();
  }
}
function drawBossShots(){
  for(const b of bossShots){
    if (b.x<cam.x-30||b.x>camRightX()) continue;
    ctx.save(); ctx.translate(b.x,b.y);
    ctx.shadowColor="#ff5a2a"; ctx.shadowBlur=9;
    ctx.fillStyle="#ffe08a"; ctx.beginPath(); ctx.arc(0,0,3.6,0,6.28); ctx.fill();
    ctx.fillStyle="#ff5a2a"; ctx.beginPath(); ctx.arc(0,0,1.9,0,6.28); ctx.fill();
    ctx.shadowBlur=0; ctx.restore();
  }
}

// ----- enemies -----
function drawEnemies(){
  for(const e of enemies){ if(e.x<cam.x-80||e.x>camRightX())continue; if(e.boss) drawBoss(e); else drawCop(e); }
}
function drawCop(e){
  const x=e.x,y=e.y,w=e.w,h=e.h;
  const dead=e.dead;
  ctx.save();
  if(dead){ const sq=clamp(e.squish/10,0,1); ctx.translate(0,h*sq*0.5); ctx.translate(x+w/2,y+h); ctx.scale(1,1-sq*0.7); ctx.translate(-(x+w/2),-(y+h)); }
  // shadow
  ctx.fillStyle="rgba(0,0,0,.18)"; ctx.beginPath(); ctx.ellipse(x+w/2,y+h+2,w*.5,5,0,0,6.28); ctx.fill();
  const isDealer=e.type==="dealer";
  if (isDealer){
    ctx.fillStyle="#3a3140"; ctx.fillRect(x+4,y+16,w-8,h-16);
    ctx.fillStyle="#2b2430"; ctx.fillRect(x+4,y+16,(w-8)/2,h-16);
    ctx.fillStyle="#caa07a"; ctx.beginPath(); ctx.arc(x+w/2,y+12,11,0,6.28); ctx.fill();
    ctx.fillStyle="#7a1f1f"; ctx.beginPath(); ctx.arc(x+w/2,y+9,11,Math.PI,0); ctx.fill(); ctx.fillRect(x+w/2-11,y+8,22,4);
    ctx.fillStyle="#111"; ctx.fillRect(x+w/2-9,y+10,18,5);
  } else {
    // police: navy uniform, badge, cap
    const aggro=e.type==="cop_aggro", big=e.type==="cop_big";
    ctx.fillStyle= aggro?"#15294f":"#1d3a6e"; ctx.fillRect(x+4,y+16,w-8,h-16);
    ctx.fillStyle="rgba(255,255,255,.12)"; ctx.fillRect(x+4,y+16,(w-8)/2,h-16);
    // belt
    ctx.fillStyle="#0a0a0a"; ctx.fillRect(x+4,y+h-16,w-8,5);
    // badge
    ctx.fillStyle="#ffd54a"; ctx.fillRect(x+8,y+22,5,5);
    // head
    ctx.fillStyle="#d3a984"; ctx.beginPath(); ctx.arc(x+w/2,y+12,10,0,6.28); ctx.fill();
    // cap
    ctx.fillStyle= aggro?"#0c1a36":"#14305c"; ctx.beginPath(); ctx.arc(x+w/2,y+8,11,Math.PI,0); ctx.fill(); ctx.fillRect(x+w/2-12,y+7,24,4);
    ctx.fillStyle="#ffd54a"; ctx.fillRect(x+w/2-4,y+4,8,2);
    // shades / angry
    ctx.fillStyle="#111"; ctx.fillRect(x+w/2-8,y+10,16,4);
    if (big){ ctx.strokeStyle="rgba(255,255,255,.5)"; ctx.lineWidth=2; ctx.strokeRect(x+5,y+18,w-10,h-22); } // riot armor
    if (aggro){ ctx.fillStyle="#ff5a5a"; ctx.fillRect(x+w/2-8,y+9,3,2); ctx.fillRect(x+w/2+5,y+9,3,2); } // angry brows
    // arms
    ctx.fillStyle= aggro?"#15294f":"#1d3a6e"; ctx.fillRect(x+(e.vx>0?w-7:1),y+18,6,15);
  }
  if (dead){ ctx.strokeStyle="#fff"; ctx.lineWidth=2; const cxp=x+w/2;
    ctx.beginPath(); ctx.moveTo(cxp-6,y+8); ctx.lineTo(cxp-2,y+12); ctx.moveTo(cxp-2,y+8); ctx.lineTo(cxp-6,y+12); ctx.stroke(); }
  ctx.restore();
  if (e.hp>1 && !dead){ ctx.fillStyle="#000"; ctx.fillRect(x,y-8,w,4); ctx.fillStyle="#ff5a5a"; ctx.fillRect(x,y-8,w*(e.hp/2),4); }
}
function drawBoss(e){
  const x=e.x,y=e.y,w=e.w,h=e.h, dead=e.dead;
  ctx.save();
  if(dead){ const sq=clamp(e.squish/10,0,1); ctx.translate(x+w/2,y+h); ctx.scale(1,1-sq*0.6); ctx.translate(-(x+w/2),-(y+h)); }
  ctx.fillStyle="rgba(0,0,0,.22)"; ctx.beginPath(); ctx.ellipse(x+w/2,y+h+2,w*.5,6,0,0,6.28); ctx.fill();
  // white suit
  ctx.fillStyle="#f0ece2"; ctx.fillRect(x+6,y+22,w-12,h-22);
  ctx.fillStyle="#d8d2c4"; ctx.fillRect(x+6,y+22,(w-12)/2,h-22);
  // gold chains
  ctx.strokeStyle="#ffd54a"; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(x+w/2,y+28,10,0.1,Math.PI-0.1); ctx.stroke();
  ctx.fillStyle="#ffd54a"; ctx.fillRect(x+w/2-3,y+36,6,6);
  // head + big hat
  ctx.fillStyle="#caa07a"; ctx.beginPath(); ctx.arc(x+w/2,y+16,13,0,6.28); ctx.fill();
  ctx.fillStyle="#2a1d12"; ctx.fillRect(x+w/2-20,y+6,40,5); ctx.fillRect(x+w/2-12,y-2,24,9);
  ctx.fillStyle="#7a1f1f"; ctx.fillRect(x+w/2-20,y+5,40,2);
  // shades + cigar
  ctx.fillStyle="#111"; ctx.fillRect(x+w/2-10,y+13,20,5);
  ctx.fillStyle="#7a4a22"; ctx.fillRect(x+w/2+6,y+22,12,3); ctx.fillStyle="#ff7a2a"; ctx.fillRect(x+w/2+18,y+22,3,3);
  if(!dead){ ctx.fillStyle="rgba(255,255,255,.5)"; ctx.beginPath(); ctx.arc(x+w/2+24,y+18-Math.sin(frameCount*0.12)*3,3,0,6.28); ctx.fill(); }
  // pistol + muzzle flash when shooting
  if(!dead){ const gy0=y+h*0.42, gx0=x-2; ctx.fillStyle="#222"; ctx.fillRect(gx0-8,gy0-2,10,5);
    if(e.muzzle>0){ ctx.fillStyle="#ffd24a"; ctx.beginPath(); ctx.moveTo(gx0-8,gy0); ctx.lineTo(gx0-18,gy0-4); ctx.lineTo(gx0-14,gy0); ctx.lineTo(gx0-18,gy0+4); ctx.closePath(); ctx.fill(); } }
  ctx.restore();
  // hp bar + crown label
  if(!dead){ const mh=e.maxHp||6; ctx.fillStyle="#000"; ctx.fillRect(x-4,y-12,w+8,5); ctx.fillStyle="#ff4d4d"; ctx.fillRect(x-4,y-12,(w+8)*clamp(e.hp/mh,0,1),5);
    ctx.fillStyle="#ffd54a"; ctx.font="bold 10px 'Trebuchet MS'"; ctx.textAlign="center"; ctx.fillText("NARCO BOSS",x+w/2,y-16); ctx.textAlign="left"; }
}

// ----- player (skins + animation) -----
function drawPlayer(){
  const p=player;
  if (hitTimer>0 && Math.floor(frameCount/4)%2===0 && starTimer<=0) return;
  const inv=starTimer>0, boosted=speedTimer>0, flying=flyTimer>0;
  const sk=curSkin();
  let body=sk.body, dark=sk.dark, belly=sk.belly;
  if (inv){ const h=(frameCount*14)%360; body=`hsl(${h} 75% 50%)`; dark=`hsl(${h} 75% 38%)`; belly=`hsl(${(h+40)%360} 80% 75%)`; }
  else if (isChromatic(sk)){
    // metallic base tints so the silhouette still reads where the gradient doesn't cover
    const h=(frameCount*1.6)%360;
    body=`hsl(${h} 60% 60%)`; dark=`hsl(${h} 55% 38%)`; belly=`hsl(${(h+40)%360} 50% 86%)`;
  }
  else if (sk.id==="rainbow"){ const h=(frameCount*5)%360; body=`hsl(${h} 85% 60%)`; dark=`hsl(${h} 85% 45%)`; belly=`hsl(${(h+50)%360} 90% 80%)`; }

  ctx.fillStyle="rgba(0,0,0,.2)"; ctx.beginPath(); ctx.ellipse(p.x+p.w/2,p.y+p.h+2,p.w*.45,6,0,0,6.28); ctx.fill();

  // 🪽 flight wings (drawn behind the body)
  if (flying){
    const flap=Math.sin(frameCount*0.4)*0.6;
    const fade = (flyTimer<70 && Math.floor(frameCount/6)%2===0) ? 0.5 : 1;
    ctx.save(); ctx.globalAlpha=fade; ctx.translate(p.x+p.w/2, p.y+p.h*0.5);
    ctx.shadowColor="rgba(200,235,255,.7)"; ctx.shadowBlur=10; ctx.fillStyle="#eaf6ff"; ctx.strokeStyle="rgba(150,200,235,.8)"; ctx.lineWidth=1;
    for(const s of [-1,1]){ ctx.save(); ctx.scale(s,1); ctx.rotate(flap*0.3);
      ctx.beginPath(); ctx.moveTo(2,-4);
      ctx.quadraticCurveTo(22,-22+flap*10,34,-4); ctx.quadraticCurveTo(24,-2,30,8);
      ctx.quadraticCurveTo(18,2,20,14); ctx.quadraticCurveTo(10,4,2,8); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.restore(); }
    ctx.shadowBlur=0; ctx.restore();
  }

  // squash & stretch
  const st = p.squash>0 ? 0.86 : p.stretch;
  const sw = 1/Math.sqrt(st), sh = st;
  ctx.save();
  ctx.translate(p.x+p.w/2, p.y+p.h);
  ctx.scale(p.facing*sw, sh);
  ctx.translate(-p.w/2, -p.h);

  const w=p.w,h=p.h;
  const breath=Math.sin(frameCount*0.08)*0.6;
  const legA=p.onGround?Math.sin(p.runPhase)*7:6, legB=p.onGround?Math.sin(p.runPhase+Math.PI)*7:6;
  const run=p.onGround?Math.sin(p.runPhase)*1:0;

  // tail
  ctx.fillStyle=body; ctx.beginPath(); ctx.moveTo(2,h-22); ctx.quadraticCurveTo(-16,h-18,-20,h-30+run*2); ctx.quadraticCurveTo(-10,h-24,6,h-16); ctx.closePath(); ctx.fill();
  // legs
  ctx.fillStyle=dark; ctx.fillRect(w*0.32-4,h-16,9,16+legA);
  ctx.fillStyle=body; ctx.fillRect(w*0.55-4,h-16,9,16+legB);
  ctx.fillStyle=dark; ctx.fillRect(w*0.30-6,h-2+legA,14,5); ctx.fillRect(w*0.53-6,h-2+legB,14,5);
  // body
  if (isChromatic(sk)){ ctx.fillStyle=chromaFill(2,14+breath, w-4,h-12+breath, frameCount*0.05); } else ctx.fillStyle=body;
  roundRect(2,14+breath,w-6,h-26,10); ctx.fill();
  ctx.fillStyle=belly; roundRect(8,22+breath,w-20,h-34,8); ctx.fill();
  ctx.fillStyle=dark; for(let yy=26;yy<h-16;yy+=8) ctx.fillRect(11,yy+breath,w-26,1.5);
  // tiny arm
  ctx.fillStyle=dark; ctx.fillRect(w-16,26,9,5); ctx.fillRect(w-9,28,4,6);
  // head
  ctx.fillStyle = isChromatic(sk) ? chromaFill(w-26,0+breath, w+4,24+breath, frameCount*0.05+1.0) : body;
  roundRect(w-26,0+breath,30,24,9); ctx.fill();
  ctx.fillRect(w-4,8+breath,12,12);
  ctx.fillStyle=dark; ctx.fillRect(w+4,12+breath,4,2);
  ctx.fillStyle="#fff"; for(let i=0;i<4;i++) ctx.fillRect(w-2+i*3,19+breath,2,3);
  ctx.fillStyle="#fff"; ctx.beginPath(); ctx.arc(w-8,9+breath,5,0,6.28); ctx.fill();
  ctx.fillStyle="#111"; if(p.blink>210) ctx.fillRect(w-12,9+breath,8,1.6); else { ctx.beginPath(); ctx.arc(w-6,9+breath,2.4,0,6.28); ctx.fill(); }
  // back spikes
  ctx.fillStyle=dark; for(let i=0;i<3;i++){ const sx=10+i*9; ctx.beginPath(); ctx.moveTo(sx,14+breath); ctx.lineTo(sx+5,6+breath); ctx.lineTo(sx+10,14+breath); ctx.fill(); }
  // accessory (skin)
  drawAccessory(sk.acc, w, breath);
  if (isChromatic(sk)){                       // moving highlight streak + sparkle twinkle
    ctx.save(); ctx.globalAlpha=0.55; ctx.globalCompositeOperation="lighter";
    const gx=2 + ((Math.sin(frameCount*0.05)*0.5+0.5))*(w-10);
    ctx.fillStyle="rgba(255,255,255,0.9)";
    ctx.fillRect(gx, 16+breath, 3, h-30);
    if (frameCount%18<9){ ctx.fillRect(w-12,20+breath,2,2); ctx.fillRect(w-20,30+breath,2,2); }
    ctx.restore();
  }
  ctx.restore();

  if (boosted){ ctx.strokeStyle=`rgba(124,252,106,${0.4+0.3*Math.sin(frameCount*0.4)})`; ctx.lineWidth=3; ctx.beginPath(); ctx.ellipse(p.x+p.w/2,p.y+p.h/2,p.w*0.8,p.h*0.7,0,0,6.28); ctx.stroke(); }
  if (ammo>0){ // cannon strapped on back
    ctx.fillStyle="#3a3a3a"; ctx.save(); ctx.translate(p.x+(p.facing>0?6:p.w-22),p.y+22); ctx.fillRect(0,0,18,7); ctx.restore(); }
}
function drawAccessory(acc,w,breath){
  const yb=breath;
  if (acc==="rasta"){ ctx.fillStyle="#d33"; ctx.fillRect(w-26,1+yb,30,4); ctx.fillStyle="#fc3"; ctx.fillRect(w-26,5+yb,30,3); ctx.fillStyle="#2c2"; ctx.fillRect(w-26,8+yb,30,2); }

// ----- hanging cinematic (long + proper; skinned victim; two cops shooting) -----
function drawHanging(){
  const x=hangX, gy=GROUND_TOP, t=hangTimer;
  const grow=clamp(t/46,0,1);
  const cy=gy-210*grow;                       // canopy height
  const bx=x+54, by=HANG_BODY_Y;              // body anchor
  ctx.save();

  // weed TREE
  ctx.fillStyle="#5a3a1a"; ctx.fillRect(x-9, cy, 18, gy-cy);
  ctx.fillStyle="#4a2f15"; ctx.fillRect(x-9, cy, 5, gy-cy);
  for(let i=0;i<12;i++){ const a=i/12*6.28, r=52*grow; ctx.save(); ctx.translate(x+Math.cos(a)*r*0.62, cy+Math.sin(a)*r*0.5); ctx.scale(grow,grow);
    ctx.fillStyle= i%2?"#2f7d32":"#3aa53a"; bigLeaf(); ctx.restore(); }
  ctx.fillStyle="#256025"; ctx.beginPath(); ctx.arc(x,cy,44*grow,0,6.28); ctx.fill();

  if (grow>=1){
    // branch
    ctx.strokeStyle="#5a3a1a"; ctx.lineWidth=9; ctx.lineCap="round"; ctx.beginPath(); ctx.moveTo(x,cy+8); ctx.lineTo(bx,cy-2); ctx.stroke(); ctx.lineCap="butt";

    const settle=clamp((t-46)/40,0,1);
    const alive = t<300, fading = t>=300 && t<450, limp = t>=450;
    const sway = alive? Math.sin(t*0.18)*0.16 : limp? Math.sin(t*0.05)*0.07 : Math.sin(t*0.10)*0.10;
    const bodyY = (cy-2) + (by-(cy-2))*settle;
    const swayX = Math.sin(sway)*18;

    // rope branch → neck
    ctx.strokeStyle="#c9a86a"; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(bx,cy-2); ctx.lineTo(bx+swayX, bodyY-30); ctx.stroke();

    // dangling SKINNED character
    ctx.save(); ctx.translate(bx+swayX, bodyY); ctx.rotate(sway);
    const sk=curSkin();
    let body=sk.body, dark=sk.dark, belly=sk.belly;
    if (sk.id==="rainbow"){ const h=(t*5)%360; body=`hsl(${h} 85% 60%)`; dark=`hsl(${h} 85% 45%)`; belly=`hsl(${(h+50)%360} 90% 80%)`; }
    // tail
    ctx.fillStyle=body; ctx.beginPath(); ctx.moveTo(-14,-6); ctx.quadraticCurveTo(-30,-2,-34,-12); ctx.quadraticCurveTo(-22,-8,-10,2); ctx.fill();
    // legs (kick → twitch → dangle)
    const k = alive? Math.sin(t*0.5)*9 : fading? Math.sin(t*0.25)*4 : 1.5;
    ctx.fillStyle=dark; ctx.fillRect(-12,2,7,18+k); ctx.fillRect(2,2,7,18-k);
    ctx.fillStyle=dark; ctx.fillRect(-13,18+k,11,5); ctx.fillRect(1,18-k,11,5);
    // body + belly
    ctx.fillStyle=body; roundRect(-16,-30,30,34,9); ctx.fill();
    ctx.fillStyle=belly; roundRect(-12,-22,18,26,7); ctx.fill();
    // little arms (flail when alive)
    const arm = Math.sin(t*0.6)*10;
    ctx.fillStyle=dark; ctx.fillRect(-19,-18,6,5+(alive?Math.max(0,arm):0)); ctx.fillRect(13,-18,6,5+(alive?Math.max(0,-arm):0));
    // head
    ctx.fillStyle=body; roundRect(2,-46,28,22,8); ctx.fill();
    if (alive){
      ctx.fillStyle="#fff"; ctx.beginPath(); ctx.arc(20,-37,4,0,6.28); ctx.fill(); ctx.fillStyle="#111"; ctx.beginPath(); ctx.arc(21,-37,2,0,6.28); ctx.fill();
      if (t%16<8){ ctx.fillStyle="rgba(180,220,255,.85)"; ctx.beginPath(); ctx.arc(8,-44,3,0,6.28); ctx.fill(); }
    } else {
      ctx.strokeStyle="#111"; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(16,-40); ctx.lineTo(22,-34); ctx.moveTo(22,-40); ctx.lineTo(16,-34); ctx.stroke();
      ctx.fillStyle="#ff5a8a"; ctx.fillRect(24,-32,4,9);
    }
    // skin accessory on the head
    ctx.save(); ctx.translate(0,-46); drawAccessory(sk.acc, 30, 0); ctx.restore();
    // noose loop
    ctx.strokeStyle="#c9a86a"; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(16,-48,7,0,6.28); ctx.stroke();
    // spirit leaving (limp)
    if (limp && t%24<12){ ctx.fillStyle="rgba(200,235,255,.7)"; ctx.beginPath(); ctx.arc(24,-58-(t%48),4,0,6.28); ctx.fill(); }
    ctx.restore();

    // 👮👮 two cops shooting up at the body
    const firing = (t>=HANG_FIRE_FROM && t<=HANG_FIRE_TO && (t-HANG_FIRE_FROM)%HANG_FIRE_EVERY < 4);
    drawHangCop(x-30, gy, bx+swayX, bodyY-4, firing, 1);
    drawHangCop(x+134, gy, bx+swayX, bodyY-4, firing, -1);
  }
  ctx.restore();
}
function drawHangCop(cx, gy, aimWX, aimWY, firing, facing){
  ctx.save(); ctx.translate(cx, gy);
  const lx=aimWX-cx, ly=aimWY-gy, h=40, w=26;
  ctx.fillStyle="rgba(0,0,0,.22)"; ctx.beginPath(); ctx.ellipse(0,2,w*0.5,5,0,0,6.28); ctx.fill();

  ctx.fillStyle="#d3a984"; ctx.beginPath(); ctx.arc(0,-h+12,10,0,6.28); ctx.fill();

  ctx.fillStyle="#ffd54a"; ctx.fillRect(-4,-h+4,8,2);
  // gun arm aimed at body
  const px=facing*5, py=-h+18, gang=Math.atan2(ly-py, lx-px);
  ctx.save(); ctx.translate(px,py); ctx.rotate(gang);
  ctx.strokeStyle="#1d3a6e"; ctx.lineWidth=5; ctx.lineCap="round"; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(16,0); ctx.stroke(); ctx.lineCap="butt";
  ctx.fillStyle="#222"; ctx.fillRect(14,-3,11,6); ctx.fillRect(21,0,3,7);
  if (firing){ ctx.fillStyle="#ffd24a"; ctx.beginPath(); ctx.moveTo(25,0); ctx.lineTo(36,-5); ctx.lineTo(31,0); ctx.lineTo(36,5); ctx.closePath(); ctx.fill();
    ctx.fillStyle="rgba(255,220,120,.5)"; ctx.beginPath(); ctx.arc(27,0,6,0,6.28); ctx.fill(); }
  ctx.restore();
  if (firing){ ctx.strokeStyle="rgba(255,230,120,.7)"; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(px+Math.cos(gang)*28, py+Math.sin(gang)*28); ctx.lineTo(lx,ly); ctx.stroke(); }
  ctx.restore();
}
function bigLeaf(){ ctx.beginPath(); for(let i=-3;i<=3;i++){ const a=i*0.4,len=18-Math.abs(i)*2; ctx.save?0:0; }
  // simple leaf cluster
  for(let i=-3;i<=3;i++){ const a=i*0.4,len=18-Math.abs(i)*2; ctx.save(); ctx.rotate(a); ctx.beginPath(); ctx.moveTo(0,2); ctx.quadraticCurveTo(-3,-len*.6,0,-len); ctx.quadraticCurveTo(3,-len*.6,0,2); ctx.fill(); ctx.restore(); } }

  for(const p of particles){ const a=clamp(p.life/p.max,0,1); ctx.globalAlpha=a; ctx.fillStyle=p.col;

}

// ----- chase mini-map (bottom-center): police vs you + nearby enemies -----
function drawMiniMap(){
  const bw=400, bh=30, bx=VW/2-bw/2, by=VH-44;
  const x0=chaseX-70, x1=player.x+560, span=Math.max(1,x1-x0);
  const toX=(wx)=> bx+clamp((wx-x0)/span,0,1)*bw;
  ctx.fillStyle="rgba(8,12,24,.62)"; roundRect(bx-8,by-8,bw+16,bh+16,10); ctx.fill();
  // track line
  ctx.fillStyle="rgba(255,255,255,.10)"; roundRect(bx,by+bh/2-3,bw,6,3); ctx.fill();
  // red danger zone trailing the police
  const pX=toX(chaseX), meX=toX(player.x);
  const dg=ctx.createLinearGradient(bx,0,Math.max(pX,bx+1),0);
  dg.addColorStop(0,"rgba(255,40,40,.55)"); dg.addColorStop(1,"rgba(255,40,40,0)");
  ctx.fillStyle=dg; ctx.fillRect(bx,by,Math.max(0,pX-bx),bh);
  // nearby enemies / boss as dots
  for(const e of enemies){ if(e.dead) continue; if(e.x<x0||e.x>x1) continue;
    const ex=toX(e.x); ctx.fillStyle=e.boss?"#ffd54a":"#ff8a8a"; const r=e.boss?5:3;
    ctx.beginPath(); ctx.arc(ex,by+bh/2,r,0,6.28); ctx.fill();
    if(e.boss){ ctx.font="11px serif"; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText("👑",ex,by+bh/2-9); }
  }
  // pickups hint (stars) so you can see goals coming
  for(const s of stars){ if(s.taken) continue; if(s.x<x0||s.x>x1) continue; const sxp=toX(s.x);
    ctx.fillStyle="#ff7bd0"; ctx.beginPath(); ctx.arc(sxp,by+bh/2,2.5,0,6.28); ctx.fill(); }
  // markers
  ctx.font="17px serif"; ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.fillText("🚓", pX, by+bh/2);
  ctx.fillText("🦖", meX, by+bh/2);
  // labels
  ctx.textBaseline="alphabetic"; ctx.font="bold 10px 'Trebuchet MS'";
  ctx.textAlign="left"; ctx.fillStyle="#ff7a7a"; ctx.fillText("CHASE", bx, by-11);
  const gapM=Math.max(0,Math.floor((player.x-chaseX)/10));
  ctx.textAlign="right"; ctx.fillStyle= gapM<8?"#ff3a3a":(gapM<24?"#ffd54a":"#9fe89f");
  ctx.fillText(gapM+" m ahead", bx+bw, by-11); ctx.textAlign="left";
}

function drawLeaf7(){                 // 7-leaflet cannabis leaf, pointing up, ~46px tall
  ctx.fillStyle="#33a83f";
  for(let i=-3;i<=3;i++){ const a=i*0.34, len=22-Math.abs(i)*4.4; ctx.save(); ctx.rotate(a);
    ctx.beginPath(); ctx.moveTo(0,3); ctx.quadraticCurveTo(-2.6,-len*0.55,0,-len); ctx.quadraticCurveTo(2.6,-len*0.55,0,3); ctx.fill(); ctx.restore(); }
  ctx.strokeStyle="#1d6b27"; ctx.lineWidth=0.9;
  for(let i=-3;i<=3;i++){ const a=i*0.34,len=22-Math.abs(i)*4.4; ctx.save(); ctx.rotate(a); ctx.beginPath(); ctx.moveTo(0,3); ctx.lineTo(0,-len+3); ctx.stroke(); ctx.restore(); }

function drawTowerSil(x, baseY, h, col, lit){
  ctx.fillStyle=col; let y=baseY, w=h*0.18;
  for(let i=0;i<5;i++){ const seg=h/5; ctx.fillRect(x-w/2, y-seg, w, seg+0.6);
    if(lit){ ctx.fillStyle="rgba(255,235,160,.7)"; for(let r=0;r<3;r++) ctx.fillRect(x-w/2+2+r*(w-4)/3, y-seg+2, 1.4, seg-4); ctx.fillStyle=col; }
    y-=seg; w*=0.8; }
  ctx.fillStyle=lit?"#ffe9a6":col; ctx.fillRect(x-1.4, y-h*0.16, 2.8, h*0.16);
  ctx.beginPath(); ctx.arc(x, y-h*0.045, 2.6, 0, 6.28); ctx.fill();
}
function drawKLSkyline(lit){          // twin towers + skybridge, centered at origin (bases ~y 92)
  const baseY=92, h=148, tx=42;
  drawTowerSil(-tx, baseY, h, "#8fb0c6", lit); drawTowerSil(tx, baseY, h, "#8fb0c6", lit);

function drawLogo(cx, cy, s, t){

// ===================== intro splash =====================
let introT = 0;
const easeOutBack=(x)=>{ const c=2.2; return 1+ (c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2); };
let introBurst=[];   // firework particles for the intro
function drawIntro(){
  const T=introT;
  // 1) pulsing, colour-cycling background
  const hueA=(T*1.5)%360;
  const g=ctx.createLinearGradient(0,0,VW,VH);
  g.addColorStop(0,   `hsl(${hueA} 70% 7%)`);
  g.addColorStop(0.5, `hsl(${(hueA+50)%360} 80% 5%)`);
  g.addColorStop(1,   `hsl(${(hueA+120)%360} 70% 6%)`);
  ctx.fillStyle=g; ctx.fillRect(0,0,VW,VH);
  // 2) rotating radial light rays from centre (additive)
  ctx.save(); ctx.translate(VW/2,VH/2); ctx.rotate(T*0.01); ctx.globalAlpha=0.06; ctx.globalCompositeOperation="lighter";
  for(let i=0;i<18;i++){ ctx.rotate(Math.PI*2/18); ctx.fillStyle=i%2?"#7CFC6A":"#ffd54a";
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(960,-72); ctx.lineTo(960,72); ctx.closePath(); ctx.fill(); }
  ctx.restore();
  // 3) sweeping searchlights
  ctx.save(); ctx.globalAlpha=0.10; ctx.globalCompositeOperation="lighter";
  for(let i=0;i<4;i++){ const a=Math.sin(T*0.025+i*1.7)*0.6; ctx.fillStyle=i%2?"#7CFC6A":"#42e8ff";
    ctx.beginPath(); ctx.moveTo(VW/2,VH+60); ctx.lineTo(VW/2+Math.cos(a-1.6)*1000,-60); ctx.lineTo(VW/2+Math.cos(a-1.34)*1000,-60); ctx.closePath(); ctx.fill(); }
  ctx.restore();
  // 4) swirling, pulsing kush leaves
  for(let i=0;i<30;i++){ const x=((i*97 + T*1.6)%(VW+80))-40, y=((i*131 + T*3.0)%(VH+80))-40;
    ctx.save(); ctx.translate(x,y); ctx.rotate(T*0.05+i); ctx.globalAlpha=0.42; const s=0.4+0.2*Math.sin(T*0.12+i); ctx.scale(s,s); drawLeaf7(); ctx.restore(); }
  // 5) neon confetti rain
  ctx.save();
  for(let i=0;i<46;i++){ const x=((i*173 + T*4)%(VW+40))-20, y=((i*61 + T*6.5)%(VH+40))-20;
    ctx.globalAlpha=0.62; ctx.fillStyle=`hsl(${(i*43+T*5)%360} 90% 62%)`;
    ctx.save(); ctx.translate(x,y); ctx.rotate(i+T*0.1); ctx.fillRect(-2,-4,4,8); ctx.restore(); }
  ctx.restore();
  // 6) firework bursts
  if (T>20 && T%24===0 && T<230){ const bx=70+((T*131)%Math.max(40,VW-140)), by=70+((T*71)%Math.max(40,VH*0.5));
    for(let k=0;k<24;k++){ const a=k/24*6.283, sp=2+(k%5)*0.6; introBurst.push({x:bx,y:by,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:34,h:(T*7)%360}); } }
  ctx.save(); ctx.globalCompositeOperation="lighter";
  for(let i=introBurst.length-1;i>=0;i--){ const p=introBurst[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=0.05; p.life--;
    if(p.life<=0){ introBurst.splice(i,1); continue; }
    ctx.globalAlpha=clamp(p.life/34,0,1); ctx.fillStyle=`hsl(${p.h} 90% 64%)`; ctx.beginPath(); ctx.arc(p.x,p.y,2.6,0,6.283); ctx.fill(); }
  ctx.restore(); ctx.globalAlpha=1;
  // 7) logo SLAM with glow + jitter + wobble
  const appear=clamp(T/30,0,1), sc=Math.min(1,VW/600)*easeOutBack(appear);
  if (T===30) screenShakeAdd(20);
  ctx.save();
  const jit=T<42?6:1.2; ctx.translate(VW/2+(Math.random()*2-1)*jit, VH/2-46+(Math.random()*2-1)*jit);
  ctx.rotate(Math.sin(T*0.18)*0.03);
  ctx.shadowColor="#7CFC6A"; ctx.shadowBlur=22+14*Math.sin(T*0.22);
  ctx.globalAlpha=clamp(T/16,0,1);
  drawLogo(0,0, Math.max(0.05,sc), T);
  ctx.restore(); ctx.shadowBlur=0; ctx.globalAlpha=1;
  // 8) ⚡ SEASON N HAS STARTED — slam-in rainbow banner
  if (T>44){ const a=clamp((T-44)/18,0,1), pop=easeOutBack(a);
    ctx.save(); ctx.translate(VW/2, VH/2+46); ctx.scale(pop,pop); ctx.textAlign="center";
    ctx.shadowColor="#000"; ctx.shadowBlur=10; ctx.fillStyle=`hsl(${(T*6)%360} 95% 60%)`; ctx.font="bold 28px 'Trebuchet MS'";
    ctx.fillText("⚡ SEASON "+seasonLabel()+" HAS STARTED ⚡", 0, 0); ctx.restore(); ctx.shadowBlur=0; }
  // 9) 👑 reigning champion — the REAL current #1 on the leaderboard (auto-updates every run)
  const champ=(Board.cache&&Board.cache.length)?Board.cache[0]:null;
  if (T>64 && champ){ const a=clamp((T-64)/18,0,1); ctx.save(); ctx.globalAlpha=a; ctx.textAlign="center"; const yy=VH/2+88;
    ctx.fillStyle="#ffd54a"; ctx.font="bold 16px 'Trebuchet MS'"; ctx.fillText("👑  REIGNING CHAMPION  👑", VW/2, yy);
    ctx.shadowColor="#ffd54a"; ctx.shadowBlur=14+8*Math.sin(T*0.2); ctx.fillStyle="#fff"; ctx.font="bold 30px 'Trebuchet MS'";
    ctx.fillText(champ.name+"  🏆", VW/2, yy+32); ctx.shadowBlur=0;
    ctx.fillStyle="#9fe89f"; ctx.font="13px 'Trebuchet MS'"; ctx.fillText(Math.round(Board.rankVal(champ))+" pts to beat — dethrone them this season!", VW/2, yy+54);
    ctx.restore(); }
  // 10) tap prompt
  if (T>92){ ctx.save(); ctx.globalAlpha=0.55+0.45*Math.sin(T*0.16); ctx.textAlign="center";
    ctx.fillStyle="#fff"; ctx.font="bold 16px 'Trebuchet MS'"; ctx.fillText("tap / press ENTER to play", VW/2, VH-26); ctx.restore(); }
  ctx.textAlign="left"; ctx.globalAlpha=1;
  if (T>330) leaveIntro();
}

// ===== first-launch onboarding: how to get TRUE fullscreen + best rotation =====
const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1);
function isStandalone(){
  return (navigator.standalone===true) ||
    (typeof matchMedia==="function" && (matchMedia("(display-mode: standalone)").matches || matchMedia("(display-mode: fullscreen)").matches));
}
function howtoSeen(){ try{ return !!localStorage.getItem("maria_howto_seen"); }catch(e){ return false; } }
function markHowtoSeen(){ try{ localStorage.setItem("maria_howto_seen","1"); }catch(e){} }
// leaving the intro: first-ever boot drops into the HOW-TO screen, after that straight to the title
function leaveIntro(){ if (howtoSeen()){ G.scene="title"; Board.refresh(); } else { G.scene="howto"; } }
function leaveHowto(){ markHowtoSeen(); G.scene="title"; Board.refresh(); }

// ===== HOW TO PLAY (game guide): cops, points & pick-ups — reachable from the title AND mid-run =====
let guideFrom="title";   // where to return when the guide closes ("title" or "play")
function openGuide(from){
  guideFrom = (from==="play") ? "play" : "title";
  guideScroll = 0;
  touchCtl.clear(); stickId=null; hideJoy(); keys.jump=keys.left=keys.right=keys.fire=false;   // freeze any held input
  G.scene="guide"; G.paused = (guideFrom==="play");   // world stops updating (loop only runs update() while scene==="play")
}
function closeGuide(){
  guideScroll=0;
  if (guideFrom==="play"){
    touchCtl.clear(); stickId=null; hideJoy(); keys.jump=keys.left=keys.right=keys.fire=false;   // resume with no stale input
    G.scene="play"; G.paused=false;
  } else {
    G.scene="title"; Board.refresh();
  }
}
// MENU from inside the guide → fully QUIT the run (bank it first if we paused mid-game) and go to the main menu
function guideToMenu(){
  if (guideFrom==="play") bankAndSubmit();   // nothing lost; mirrors quitToMenu's banking
  guideFrom="title"; guideScroll=0;
  G.scene="title"; G.paused=false; Board.refresh();
}

function drawGuide(){
  // backdrop (green night vibe, like the intro) + a soft dim so the frozen world never bleeds through
  const g=ctx.createLinearGradient(0,0,0,VH); g.addColorStop(0,"#0a2114"); g.addColorStop(.6,"#06120b"); g.addColorStop(1,"#030704");
  ctx.fillStyle=g; ctx.fillRect(0,0,VW,VH);
  ctx.fillStyle="rgba(6,10,20,.5)"; ctx.fillRect(0,0,VW,VH);
  ctx.textBaseline="alphabetic";

  const pad=16, w=Math.min(620, VW-2*pad), x0=(VW-w)/2, cx=VW/2, inner=w-2*pad;
  panel(x0, 10, w, VH-20);

  // header
  ctx.textAlign="center";
  ctx.fillStyle="#7CFC6A"; ctx.font="bold "+fitFontSize("📖  HOW TO PLAY",24,inner,"bold")+"px 'Trebuchet MS'";
  ctx.fillText("📖  HOW TO PLAY", cx, 44);

  // ---- bottom button band (fixed; never scrolls) ----
  const fromPlay = (guideFrom==="play");
  const btnH=44, gap2=10, stack = fromPlay && inner<340;
  const rows = stack?2:1, bandH = rows*btnH + (rows-1)*gap2;
  const bandTop = VH-10-12-bandH;

  // ---- scrollable content region between the header and the buttons ----
  const top=58, bot=bandTop-12;
  const rect={ x:x0+pad, y:top, w:inner, h:Math.max(24, bot-top) };
  guideRect=rect;
  const bodyPx=(inner<430)?12:13;
  const bodyFont=bodyPx+"px 'Trebuchet MS'";
  // wrap conservatively: measureText under-counts emoji width, so leave a right gutter to avoid clipping
  const headH=22, lineH=bodyPx+5, blockGap=12, bodyX=rect.x+6, bodyW=rect.w-20;

  // measure total content height
  const wrapped = GUIDE_BLOCKS.map(b=> b.body.map(t=>wrapLines(t, bodyFont, bodyW)));
  let contentH=0;
  for (let i=0;i<GUIDE_BLOCKS.length;i++){ contentH+=headH; for(const ls of wrapped[i]) contentH+=ls.length*lineH; contentH+=blockGap; }
  guideScrollMax=Math.max(0, contentH-rect.h);
  guideScroll=clamp(guideScroll,0,guideScrollMax);

  // draw, clipped to the box and offset by the scroll position
  ctx.save();
  ctx.beginPath(); ctx.rect(rect.x-8, rect.y-4, rect.w+16, rect.h+8); ctx.clip();
  let y=rect.y+4-guideScroll;
  for (let i=0;i<GUIDE_BLOCKS.length;i++){
    const b=GUIDE_BLOCKS[i];
    ctx.textAlign="left"; ctx.fillStyle=b.c;
    ctx.font="bold "+fitFontSize(b.h,15,rect.w-4,"bold")+"px 'Trebuchet MS'"; ctx.fillText(b.h, rect.x, y+12);
    y+=headH;
    ctx.font=bodyFont; ctx.fillStyle="#cfd8e8";
    for (const ls of wrapped[i]){ for (const ln of ls){ ctx.fillText(ln, bodyX, y+11); y+=lineH; } }
    y+=blockGap;
  }
  ctx.restore();

  // slim scrollbar + a bottom fade hinting there's more to read
  if (guideScrollMax>0){
    const trackX=rect.x+rect.w+2, frac=rect.h/contentH, thumbH=Math.max(20,rect.h*frac), thumbY=rect.y+(guideScroll/guideScrollMax)*(rect.h-thumbH);
    ctx.fillStyle="rgba(255,255,255,.10)"; roundRect(trackX,rect.y,3,rect.h,1.5); ctx.fill();
    ctx.fillStyle="rgba(124,252,106,.6)";  roundRect(trackX,thumbY,3,thumbH,1.5); ctx.fill();
    if (guideScroll < guideScrollMax-1){
      const fg=ctx.createLinearGradient(0,rect.y+rect.h-22,0,rect.y+rect.h); fg.addColorStop(0,"rgba(8,18,11,0)"); fg.addColorStop(1,"rgba(8,18,11,.92)");
      ctx.fillStyle=fg; ctx.fillRect(rect.x-8, rect.y+rect.h-22, rect.w+16, 22);
    }
  }

  // ---- buttons (fixed band) ----
  ctx.textAlign="left";
  if (!fromPlay){
    const bw=Math.min(320,inner), bx=cx-bw/2;
    button(bx, bandTop, bw, btnH, "GOT IT  🌿", ()=>closeGuide());
  } else if (stack){
    button(x0+pad, bandTop, inner, btnH, "▶  RESUME", ()=>closeGuide());
    button(x0+pad, bandTop+btnH+gap2, inner, btnH, "≡  MAIN MENU", ()=>guideToMenu(), "rgba(255,255,255,.14)");
  } else {
    const bw=(inner-gap2)/2;

    button(x0+pad+bw+gap2, bandTop, bw, btnH, "≡  MAIN MENU", ()=>guideToMenu(), "rgba(255,255,255,.14)");
  }
}
// word-wrap a string to fit maxW at the given font; hard-breaks a single word too wide for the column
function wrapLines(text, font, maxW){
  ctx.font=font; maxW=Math.max(1,maxW);
  const words=String(text).split(" "), lines=[]; let line="";
  const flush=()=>{ if(line){ lines.push(line); line=""; } };
  for (let wd of words){
    while (wd.length>1 && ctx.measureText(wd).width>maxW){            // word alone overflows → break by chars
      let i=1; while (i<wd.length && ctx.measureText(wd.slice(0,i+1)).width<=maxW) i++;
      flush(); lines.push(wd.slice(0,i)); wd=wd.slice(i);
    }
    const test=line?line+" "+wd:wd;
    if (line && ctx.measureText(test).width>maxW){ flush(); line=wd; }
    else line=test;
  }
  flush();
  return lines;
}
// tappable text "link" — draws the label and registers a uiButton hotspot around it
function linkText(label, cx, y, action, color){
  ctx.font="bold 12px 'Trebuchet MS'"; ctx.textAlign="center"; ctx.fillStyle=color||"#7CFC6A"; ctx.fillText(label, cx, y);
  const tw=ctx.measureText(label).width; uiButtons.push({x:cx-tw/2-10, y:y-16, w:tw+20, h:22, action});
  ctx.textAlign="left";
}
// largest font size (≤ basePx) at which `text` fits within maxW, in the given weight
function fitFontSize(text, basePx, maxW, weight){
  if (!(maxW>0)) return Math.max(9, basePx);
  ctx.font=(weight?weight+" ":"")+basePx+"px 'Trebuchet MS'";
  const wpx=ctx.measureText(text).width;
  return (wpx>maxW && wpx>0) ? Math.max(9, Math.floor(basePx*maxW/wpx)) : basePx;
}

function drawBoard(x, y, w, h, total, hiName){
  const rows = Board.cache.slice(0, total);
  boardRect = {x, y, w, h};
  if (!rows.length){
    boardScrollMax=0;
    ctx.textAlign="center"; ctx.fillStyle="#8fa6c8"; ctx.font="14px 'Trebuchet MS'";
    ctx.fillText(Board.status==="loading"?"Loading scores…":(Board.status==="offline"?"Offline — showing your saved scores 🌿":"No scores yet — be the first! 🌿"), x+w/2, y+16);
    ctx.textAlign="left"; return;
  }
  const rh=22, contentH=rows.length*rh;
  boardScrollMax = Math.max(0, contentH - h);
  boardScroll = clamp(boardScroll, 0, boardScrollMax);
  const bar = boardScrollMax>0 ? 7 : 0;          // reserve a sliver for the scrollbar when it's needed
  const rw = w - bar, sm = rw<320;
  const distW=sm?36:52, kushW=sm?44:58;          // right-side columns (from the right edge): dist, kush, then TOTAL
  ctx.save();
  ctx.beginPath(); ctx.rect(x-10, y, w+20, h); ctx.clip();   // clip rows to the box (highlight bleeds a little)
  for (let i=0;i<rows.length;i++){
    const ry=y+i*rh+13-boardScroll;
    if (ry < y-rh || ry > y+h+rh) continue;      // cull rows scrolled out of view
    const r=rows[i], me=hiName&&r.name===hiName;
    if (me){ ctx.fillStyle="rgba(124,252,106,.20)"; roundRect(x-8,ry-15,rw+16,20,6); ctx.fill(); }
    ctx.textAlign="left";
    ctx.fillStyle = i===0?"#ffd54a":i===1?"#cfd8e8":i===2?"#e0a878":"#9fb4d6";
    ctx.font="bold "+(sm?12:15)+"px 'Trebuchet MS'"; ctx.fillText((i+1)+".", x, ry);
    if (r.cc) drawFlag(r.cc, x+(sm?20:26), ry-(sm?8:9), sm?13:16, sm?9:11);                  // player's country flag
    ctx.fillStyle = me?"#eaffea":"#fff"; ctx.font=(sm?12:15)+"px 'Trebuchet MS'"; ctx.fillText((r.name||"???").slice(0,10), x+(sm?20:26)+(r.cc?(sm?17:21):0), ry);
    ctx.textAlign="right";
    ctx.fillStyle="#8fa6c8"; ctx.font=(sm?10:12)+"px 'Trebuchet MS'"; ctx.fillText((r.dist||0)+"m", x+rw, ry);                                  // distance
    ctx.fillStyle="#9fe89f"; ctx.font="bold "+(sm?11:13)+"px 'Trebuchet MS'"; ctx.fillText(r.score+"🌿", x+rw-distW, ry);                       // kush
    ctx.fillStyle="#ffd54a"; ctx.font="bold "+(sm?13:16)+"px 'Trebuchet MS'"; ctx.fillText(String(Math.round(Board.rankVal(r))), x+rw-distW-kushW, ry); // TOTAL points (yellow)
    ctx.textAlign="left";
  }
  ctx.restore();
  if (boardScrollMax>0){                          // slim scrollbar on the right edge of the box
    const trackX=x+w-3, frac=h/contentH, thumbH=Math.max(18,h*frac), thumbY=y+(boardScroll/boardScrollMax)*(h-thumbH);
    ctx.fillStyle="rgba(255,255,255,.10)"; roundRect(trackX,y,3,h,1.5); ctx.fill();
    ctx.fillStyle="rgba(124,252,106,.6)";  roundRect(trackX,thumbY,3,thumbH,1.5); ctx.fill();
  }
}

function drawSkinPreview(s,cx,cy){
  ctx.save(); ctx.translate(cx-18,cy-26); const w=40,h=44;
  let body=s.body, dark=s.dark, belly=s.belly;
  if (isChromatic(s)){ const h2=(frameCount*1.6)%360; body=`hsl(${h2} 60% 60%)`; dark=`hsl(${h2} 55% 38%)`; belly=`hsl(${(h2+40)%360} 50% 86%)`; }
  ctx.fillStyle = isChromatic(s) ? chromaFill(8,12, w-2,h-6, frameCount*0.05) : body;
  roundRect(8,12,w-10,h-18,8); ctx.fill();
  ctx.fillStyle=belly; roundRect(12,18,w-22,h-26,6); ctx.fill();
  ctx.fillStyle = isChromatic(s) ? chromaFill(w-20,2, w+4,20, frameCount*0.05+1.0) : body;
  roundRect(w-20,2,24,18,7); ctx.fill();
  ctx.fillStyle="#fff"; ctx.beginPath(); ctx.arc(w-4,9,4,0,6.28); ctx.fill();
  ctx.fillStyle="#111"; ctx.beginPath(); ctx.arc(w-2,9,2,0,6.28); ctx.fill();
  ctx.fillStyle=dark; ctx.fillRect(12,h-6,7,8); ctx.fillRect(24,h-6,7,8);
  drawAccessory(s.acc, w+ (s.acc==="rasta"?0:0), 0);
  ctx.restore();
}
function buyOrEquip(s){
  const owned=DB.owned;
  if (owned.includes(s.id)){ DB.skin=s.id; sfx.collect(); Profile.save(); return; }
  if (s.pass){ sfx.hurt(); flash=6; return; }            // battle-pass exclusive → unlock it by climbing the pass, not buying
  if (DB.bank>=s.cost){ DB.bank=DB.bank-s.cost; owned.push(s.id); DB.owned=owned; DB.skin=s.id; sfx.star(); Profile.save(); }
  else { sfx.hurt(); flash=6; }
}
function buyPet(pet){
  if (DB.pet){ sfx.collect(); return; }                 // already owned → always equipped
  if (DB.bank>=pet.cost){ DB.bank=DB.bank-pet.cost; DB.pet=true; sfx.star(); Profile.save(); }
  else { sfx.hurt(); flash=6; }
}

function fmtAgo(ts){
  if (!ts) return "";
  const s=Math.max(0, Math.floor((Date.now()-ts)/1000));
  if (s<60) return "now";
  const m=Math.floor(s/60); if (m<60) return m+"m";
  const h=Math.floor(m/60); if (h<24) return h+"h";
  return Math.floor(h/24)+"d";
}
// greedy word-wrap for the current ctx.font; breaks unbreakable runs by character
function wrapText(text, maxW){
  const lines=[]; let line="";
  for (const wd of String(text).split(" ")){
    const t=line?line+" "+wd:wd;
    if (ctx.measureText(t).width<=maxW){ line=t; continue; }
    if (line) lines.push(line);
    if (ctx.measureText(wd).width>maxW){
      let cur=""; for(const ch of wd){ if(ctx.measureText(cur+ch).width<=maxW) cur+=ch; else { lines.push(cur); cur=ch; } }
      line=cur;
    } else line=wd;
  }
  if (line) lines.push(line);
  return lines.length?lines:[""];
}
function drawChat(){
  ctx.fillStyle="rgba(6,10,20,.86)"; ctx.fillRect(0,0,VW,VH);
  const w=Math.min(640, VW-16), x0=VW/2-w/2, cx=VW/2;
  panel(x0, 12, w, VH-24, "rgba(88,166,255,.5)");
  drawSoundButton(x0+12, 20, 34, 28);
  ctx.textAlign="center"; ctx.fillStyle="#58a6ff"; ctx.font="bold 22px 'Trebuchet MS'"; ctx.fillText("💬  KUSH CHAT", cx, 42);
  ctx.fillStyle="#8fa6c8"; ctx.font="11px 'Trebuchet MS'"; ctx.fillText(Chat.statusLine(), cx, 59);
  ctx.fillStyle="#ffd54a"; ctx.font="10px 'Trebuchet MS'"; ctx.fillText("💡 turn FEEDBACK ON to suggest changes to the game", cx, 73);
  ctx.textAlign="left";
  Chat.fetch();                                              // self-throttled background poll while the tab is open
  // ----- scrollable message list -----
  const bx=x0+14, bw2=w-28, by=82, bh=(VH-110)-by;
  chatRect={x:bx, y:by, w:bw2, h:bh};
  const lh=15, headH=16, gapM=8, textW=bw2-10;
  ctx.font="12px 'Trebuchet MS'";
  const blocks=[]; let totalH=0;
  for (const m of Chat.cache){ const lines=wrapText(m.text, textW); const hh=headH+lines.length*lh+gapM; blocks.push({m, lines, h:hh}); totalH+=hh; }
  chatScrollMax=Math.max(0, totalH-bh);
  if (chatStick) chatScroll=chatScrollMax;
  chatScroll=clamp(chatScroll, 0, chatScrollMax);
  if (!blocks.length){
    ctx.textAlign="center"; ctx.fillStyle="#8fa6c8"; ctx.font="13px 'Trebuchet MS'";
    ctx.fillText(Chat.status==="loading" ? "Loading chat…" : (Chat.status==="online" ? "No messages yet — say hi! 🌿" : "Chat unreachable — check your connection"), cx, by+40);
    ctx.textAlign="left";
  }
  ctx.save();
  ctx.beginPath(); ctx.rect(bx-6, by, bw2+12, bh); ctx.clip();
  let yy=by+4-chatScroll;
  const meName=Profile.key(DB.name);
  for (const b of blocks){
    if (yy+b.h>=by && yy<=by+bh){
      const m=b.m, me=meName && m.name===meName;
      if (m.fb){ ctx.fillStyle="rgba(255,213,74,.10)"; roundRect(bx-5, yy-2, bw2+10, b.h-4, 6); ctx.fill(); }   // feedback = highlighted
      drawFlag(m.cc, bx, yy+2, 14, 10);
      ctx.fillStyle= me?"#7CFC6A":(m.fb?"#ffd54a":"#58a6ff"); ctx.font="bold 12px 'Trebuchet MS'";
      ctx.fillText((m.fb?"💡 ":"")+m.name, bx+(m.cc?19:0), yy+11);
      ctx.textAlign="right"; ctx.fillStyle="#5d7290"; ctx.font="10px 'Trebuchet MS'"; ctx.fillText(fmtAgo(m.ts), bx+bw2, yy+11); ctx.textAlign="left";
      ctx.fillStyle= m.fb?"#ffe9a8":"#e8f0ff"; ctx.font="12px 'Trebuchet MS'";
      let ty=yy+headH+11;
      for (const ln of b.lines){ ctx.fillText(ln, bx+6, ty); ty+=lh; }
    }
    yy+=b.h;
  }
  ctx.restore();
  if (chatScrollMax>0){                                      // slim scrollbar, same style as the leaderboard
    const trackX=x0+w-9, frac=bh/totalH, thumbH=Math.max(18,bh*frac), thumbY=by+(chatScroll/chatScrollMax)*(bh-thumbH);
    ctx.fillStyle="rgba(255,255,255,.10)"; roundRect(trackX,by,3,bh,1.5); ctx.fill();
    ctx.fillStyle="rgba(88,166,255,.6)";   roundRect(trackX,thumbY,3,thumbH,1.5); ctx.fill();
  }
  // ----- input row (HTML #chatInput is overlaid at chatBoxRect by syncChatInput) + buttons -----
  button(x0+w-14-84, VH-104, 84, 36, Chat.sending?"…":"SEND", ()=>Chat.send(), "rgba(88,166,255,.25)");
  const fbOn=Chat.feedbackMode;
  button(x0+14, VH-60, Math.min(210, w-28-108), 30, "💡 FEEDBACK: "+(fbOn?"ON":"OFF"), ()=>{ Chat.feedbackMode=!Chat.feedbackMode; }, fbOn?"rgba(255,213,74,.28)":"rgba(255,255,255,.10)");
  button(x0+w-14-96, VH-60, 96, 30, "BACK", ()=>{ G.scene="title"; }, "rgba(255,255,255,.14)");
  if (!meName){
    ctx.textAlign="center"; ctx.fillStyle="#ff8a8a"; ctx.font="10px 'Trebuchet MS'";

  }
}

// ======================================================================
//  MAIN LOOP
// ======================================================================
let last=performance.now(), accT=0;
// auto-quality: rolling real frame time with hysteresis — on a struggling device shed the
// cosmetic load (weather, particle cap, boost-trail rate) instead of letting the game chug
let fxAvg=16.7, lowFX=false;
function loop(now){
  const rdt=Math.min(100, now-last);
  fxAvg+=(rdt-fxAvg)*0.04;
  lowFX = lowFX ? (fxAvg>17.5) : (fxAvg>23);     // enter below ~43fps sustained, exit above ~57fps
  accT+=now-last; last=now; if(accT>250)accT=250;
  while (accT>=FIXED_DT){
    if (G.scene==="play") update(); else { frameCount++; if (G.scene==="intro") introT++; if (needName>0) needName--; }
    accT-=FIXED_DT;
  }
  // keep the global board fresh on menus so new high scores show up for everyone
  if (G.scene!=="play" && Board.global() && frameCount%240===0) Board.refresh();
  if (G.scene!=="play" && Stats.global() && frameCount%600===0) Stats.fetch();   // refresh the global play count
  render();
  requestAnimationFrame(loop);
}
Board.init();
Stats.fetch();   // load the global "games played" total
if (DB.name && DB.name.trim()) Profile.load(DB.name);   // adopt cloud account for the saved name
// durable delivery: whenever we regain focus / connectivity, re-push any runs that never reached the cloud
addEventListener("online", ()=>{ try{ Board.flushPending(); }catch(e){} });
addEventListener("pageshow", ()=>{ try{ Board.flushPending(); }catch(e){} });
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden){ try{ Board.flushPending(); }catch(e){} } });
resetWorld(true);
requestAnimationFrame(loop);
</script>

(function(){

  // reuse the same detection helpers as the how-to screen so the gate can't drift out of sync
  var isIOS = (typeof IS_IOS!=="undefined") ? IS_IOS
    : (/iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1));
  var standalone = (typeof isStandalone==="function") ? isStandalone()
    : ((navigator.standalone===true) || (window.matchMedia && (matchMedia("(display-mode: standalone)").matches || matchMedia("(display-mode: fullscreen)").matches)));
  var seen=false; try{ seen=!!localStorage.getItem("maria_ios_hint"); }catch(e){}
  var howtoDone = (typeof howtoSeen==="function") ? howtoSeen() : false;
  if (isIOS && !standalone && !seen && howtoDone){
    el.style.display="block";
    var dismiss=function(){ el.style.display="none"; try{ localStorage.setItem("maria_ios_hint","1"); }catch(e){} };
    el.addEventListener("click", dismiss);
    setTimeout(dismiss, 9000);
  }
})();
