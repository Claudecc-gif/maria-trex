<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#2bb24a"/>
      <stop offset="55%" stop-color="#1a7d33"/>
      <stop offset="100%" stop-color="#0a3c1a"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9dff7a"/>
      <stop offset="100%" stop-color="#3aa53a"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="6"/>

  <!-- cannabis leaf (7 leaflets radiating from a stem point) -->
  <g transform="translate(256,232)" fill="url(#leaf)" stroke="#1f5a22" stroke-width="4" stroke-linejoin="round">
    <g id="lf">
      <path d="M0,18 C-16,-30 -10,-104 0,-150 C10,-104 16,-30 0,18 Z"/>
    </g>
    <use href="#lf" transform="rotate(33)"/>
    <use href="#lf" transform="rotate(-33)"/>
    <use href="#lf" transform="rotate(66) scale(.82)"/>
    <use href="#lf" transform="rotate(-66) scale(.82)"/>
    <use href="#lf" transform="rotate(100) scale(.6)"/>
    <use href="#lf" transform="rotate(-100) scale(.6)"/>
  </g>
  <!-- stem -->
  <rect x="250" y="244" width="12" height="70" rx="5" fill="#5a3a1a"/>

  <!-- T-Rex head peeking bottom-right -->
  <g transform="translate(300,300)">
    <path d="M0,40 Q0,0 44,0 L120,0 Q150,0 150,30 L150,70 Q150,92 124,92 L150,92 L150,108 L120,108 Q0,108 0,60 Z"
          fill="#2faa4a" stroke="#1f7a34" stroke-width="6" stroke-linejoin="round"/>
    <!-- belly/jaw light -->
    <path d="M120,92 L150,92 L150,108 L120,108 Z" fill="#bdf5a0"/>
    <!-- teeth -->
    <g fill="#ffffff"><rect x="118" y="86" width="8" height="14"/><rect x="132" y="86" width="8" height="14"/><rect x="146" y="86" width="6" height="14"/></g>
    <!-- eye -->
    <circle cx="118" cy="34" r="15" fill="#fff"/><circle cx="122" cy="34" r="7" fill="#111"/>
    <!-- rasta bandana -->
    <rect x="40" y="2" width="92" height="9" fill="#e53935"/>
    <rect x="40" y="11" width="92" height="8" fill="#fdd835"/>
    <rect x="40" y="19" width="92" height="7" fill="#43a047"/>
  </g>

  <!-- little smoke puffs -->
  <g fill="rgba(255,255,255,.6)">
    <circle cx="430" cy="150" r="14"/><circle cx="452" cy="124" r="11"/><circle cx="470" cy="100" r="8"/>
  </g>
</svg>
